<head>

<title>사진첩 · 영호의 게임에뮬레이터</title>

<style>
/* ===== 사진첩 · 사이트(레트로 아케이드) 테마와 같은 색 · 글꼴 ===== */
:root{--tx:#f0e9ff;--mu:#a79bc9;--ln:rgba(183,92,255,.45);--pk:#ff4fd8;--sky:#9fd0ff;--gap:6px;--tile:108px;
 --sans:"Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05010f;color:var(--tx);font-family:var(--sans)}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::after{display:none!important} /* 사진이 줄무늬로 가려지지 않도록 주사선 효과 끔 */
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));background:rgba(8,3,22,.74);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(183,92,255,.3)}
.in{width:min(100%,1280px);margin:0 auto}
.r1{display:flex;align-items:center;gap:10px}
.back{flex:none;text-decoration:none;color:var(--tx);font:500 14px var(--sans);padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:rgba(255,255,255,.06);white-space:nowrap}
.back:active{background:rgba(255,255,255,.14)}
.top h1{flex:1;min-width:0;margin:0;font:700 clamp(19px,4.8vw,26px)/1.2 var(--sans);color:#fff;text-shadow:0 0 10px #ff3df0,0 0 24px rgba(255,61,240,.5),2px 2px 0 #3d7bff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.06);cursor:pointer}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:rgba(255,255,255,.16)}
.ib.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.r2{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:38px}
#cnt{flex:1;min-width:0;font:500 13.5px var(--sans);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{flex:none;border:1px solid var(--ln);background:rgba(255,255,255,.06);padding:8px 14px;border-radius:99px;cursor:pointer;font:500 13.5px var(--sans);white-space:nowrap;transition:background .2s}
.c:active{background:rgba(255,255,255,.18)}
@media (hover:hover){.c:hover{background:rgba(255,255,255,.13)}}
.c:disabled{opacity:.4;pointer-events:none}
.c.pri{background:linear-gradient(160deg,#3d7bff,#7a4cff);border-color:transparent;color:#fff}
#r2s{justify-content:space-between}
#sN{flex:1;text-align:center;font:600 15px var(--sans);color:#fff}

/* 사진 격자 */
.app{position:relative;z-index:2;width:min(100%,1280px);margin:0 auto;padding:14px calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
body.sm .app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:var(--gap)}
.ph{position:relative;display:block;width:100%;padding:0;border:0;aspect-ratio:1;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.07);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:box-shadow .18s,background .18s;content-visibility:auto;contain-intrinsic-size:108px}
.ph img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s,transform .2s,border-radius .2s;pointer-events:none}
.ph img.ld{opacity:1}
@media (hover:hover){.ph:hover img{transform:scale(1.05)}}
.ph:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
.ph.bad:before{content:attr(data-n);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font:400 11.5px/1.4 var(--sans);color:var(--mu);word-break:break-all;overflow:hidden}
.ck{position:absolute;right:7px;bottom:7px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.92);background:rgba(0,0,0,.28);box-shadow:0 1px 5px rgba(0,0,0,.55);opacity:0;transform:scale(.7);transition:opacity .18s,transform .22s cubic-bezier(.3,1.5,.5,1)}
body.sm .ck{opacity:1;transform:none}
body.sm .ph:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.38));pointer-events:none}
.ph.on{background:rgba(80,20,160,.45);box-shadow:0 0 0 2.5px var(--pk),0 0 18px rgba(255,79,216,.5)}
.ph.on img{transform:scale(.87);border-radius:10px}
.ph.on .ck{background:linear-gradient(160deg,#3d7bff,#7a4cff);border-color:#fff}
.ph.on .ck:after{content:"";position:absolute;left:6.5px;top:2.5px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.sk{aspect-ratio:1;border-radius:12px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 70%);background-size:300% 100%;animation:shm 1.5s linear infinite}
@keyframes shm{to{background-position:-300% 0}}

/* 비어 있음 · 오류 */
.pnl{margin:30px auto 0;max-width:460px;padding:34px 22px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(80,20,160,.25));border:1.5px solid rgba(183,92,255,.6);border-radius:22px;box-shadow:0 0 0 1px rgba(61,123,255,.35) inset,0 10px 40px rgba(120,40,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pnl .em{font-size:44px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,61,240,.6))}
.pnl h2{margin:14px 0 8px;font:700 19px/1.4 var(--sans);color:#fff}
.pnl p{margin:6px 0;font:400 14px/1.7 var(--sans);color:#d8cdf5;word-break:keep-all}
.pnl p b{color:#ffe45e;font-weight:600}
.pnl small{display:block;margin-top:10px;font:400 12.5px/1.6 var(--sans);color:var(--mu);word-break:keep-all}
.pnl .c{margin-top:14px}

/* 아래 선택 메뉴 (공유 · 다운로드) */
#ab{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:min(calc(100% - 28px),420px);display:flex;gap:10px;padding:10px;border-radius:24px;background:rgba(24,10,56,.84);border:1px solid var(--ln);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 14px 50px rgba(0,0,0,.55),0 0 0 1px rgba(61,123,255,.3) inset;transform:translate(-50%,160%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.25,1),visibility 0s .35s}
body.sm #ab{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.ab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;border:0;border-radius:16px;background:rgba(255,255,255,.12);font:600 15px var(--sans);cursor:pointer;transition:filter .2s,transform .1s}
.ab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ab.pri{background:linear-gradient(160deg,#3d7bff,#7a4cff);box-shadow:0 4px 18px rgba(90,80,255,.4)}
.ab:active{transform:scale(.97)}
.ab:disabled{opacity:.38;pointer-events:none}

/* 크게 보기 */
#vw{position:fixed;inset:0;z-index:100;--vb:1;background:rgba(3,0,10,calc(.97 * var(--vb)));opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;touch-action:none;-webkit-user-select:none;user-select:none}
#vw.on{opacity:1;visibility:visible;transition-delay:0s}
#vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#vs:before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--pk);animation:rot .8s linear infinite;opacity:0;transition:opacity .2s}
#vs.ldg:before{opacity:1}
#vi{max-width:100%;max-height:100%;object-fit:contain;will-change:transform;-webkit-user-drag:none;pointer-events:none}
.vtop{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) calc(12px + env(safe-area-inset-right)) 26px calc(12px + env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,.62),transparent);transition:opacity .25s}
.vtop{pointer-events:none}.vtop .vb{pointer-events:auto}
#vw.hide .vtop,#vw.hide .vnav{opacity:0;pointer-events:none}#vw.hide .vtop .vb{pointer-events:none}
.vtop .vt{flex:1;min-width:0;text-align:center}
.vtop .vt b{display:block;font:600 15px/1.3 var(--sans);color:#fff}
.vtop .vt small{display:block;font:400 12px/1.4 var(--sans);color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .vg{display:flex;gap:8px}
.vb{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
.vb svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vb:active{background:rgba(255,255,255,.3)}
.vnav{display:none;position:absolute;top:50%;z-index:2;width:52px;height:52px;margin-top:-26px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:30px;line-height:1;cursor:pointer;transition:opacity .25s,background .2s}
.vnav:hover{background:rgba(255,255,255,.28)}
.vnav.p{left:16px}.vnav.n{right:16px}
.vnav:disabled{opacity:.25;pointer-events:none}
@media (hover:hover) and (pointer:fine){.vnav{display:block}#vs{cursor:zoom-in}}

/* 시트 · 진행 · 알림 */
.ov{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .3s}
.ov.on{opacity:1;visibility:visible;transition-delay:0s}
.sheet{width:min(100%,520px);max-height:88dvh;overflow:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:rgba(32,14,74,.95);border:1px solid var(--ln);border-bottom:0;box-shadow:0 -10px 60px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.25,1)}
.ov.on .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 12px}
.sheet h3{margin:4px 6px 4px;font:700 20px var(--sans)}
.sheet .ss{margin:0 6px 12px;font:400 13.5px/1.6 var(--sans);color:var(--mu);word-break:keep-all}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:14px 16px;margin-top:8px;border:1px solid var(--ln);border-radius:16px;background:rgba(255,255,255,.07);text-align:left;cursor:pointer}
.opt b{font:600 16px var(--sans);color:#fff}
.opt span{font:400 13px/1.5 var(--sans);color:var(--mu);word-break:keep-all}
.opt.pri{background:linear-gradient(160deg,rgba(61,123,255,.55),rgba(122,76,255,.55));border-color:rgba(159,208,255,.6)}
.opt:active{filter:brightness(1.25)}
.opt.x{align-items:center;background:none;border-color:transparent;color:var(--mu);margin-top:4px}
#bz .sheet{width:min(calc(100% - 40px),340px);padding:26px 22px;border-radius:24px;text-align:center;transform:scale(.94);border-bottom:1px solid var(--ln)}
#bz{align-items:center;z-index:130}
#bz.on .sheet{transform:none}
.sp{width:36px;height:36px;margin:0 auto 14px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--pk);animation:rot .8s linear infinite}
#bzT{margin:0 0 4px;font:700 17px var(--sans)}
#bzS{margin:0 0 14px;font:400 13.5px var(--sans);color:var(--mu)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d7bff,#ff4fd8);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:140;max-width:min(92vw,520px);padding:12px 18px;border-radius:14px;background:rgba(30,20,60,.96);border:1px solid var(--ln);color:#fff;font:500 14px/1.5 var(--sans);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;word-break:keep-all}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.sm #toast{bottom:calc(110px + env(safe-area-inset-bottom))}

/* 태블릿 · PC : 더 큰 사진, 가운데 시트 */
@media (min-width:700px){:root{--tile:150px;--gap:8px}.ph{border-radius:14px;contain-intrinsic-size:150px}.c{padding:9px 16px;font-size:14px}#cnt{font-size:14.5px}}
@media (min-width:1100px){:root{--tile:184px;--gap:10px}.ph{contain-intrinsic-size:184px}}
@media (min-width:700px){
 .ov{align-items:center}
 .sheet{border-radius:26px;border-bottom:1px solid var(--ln);transform:scale(.95);padding-bottom:20px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
 .grab{display:none}
}
@media (max-width:360px){:root{--tile:96px;--gap:4px}.back{padding:8px 11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>

<header class="top"><div class="in">
 <div class="r1">
  <a class="back" href="index.html?select=1">‹ 처음으로</a>
  <h1>📷 사진첩</h1>
  <button type="button" class="ib" id="bRef" aria-label="새로고침" title="새로고침"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
 </div>
 <div class="r2" id="r2n">
  <span id="cnt">불러오는 중…</span>
  <button type="button" class="c" id="bSel">일괄 선택</button>
  <button type="button" class="c" id="bAll">전체 선택</button>
  <button type="button" class="c" id="bSort" title="정렬">이름 ↓</button>
 </div>
 <div class="r2" id="r2s" hidden>

 </div>

<main class="app">

 <div id="state"></div>
</main>

<div id="ab" role="toolbar" aria-label="선택한 사진 작업">
 <button type="button" class="ab" id="abSh" disabled><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>공유</button>
 <button type="button" class="ab pri" id="abDl" disabled><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg>다운로드</button>
</div>

<div id="vw" aria-hidden="true" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
 <div id="vs"><img id="vi" alt="" draggable="false"></div>
 <div class="vtop">
  <button type="button" class="vb" id="vX" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="vt"><b id="vN"></b><small id="vT"></small></div>
  <div class="vg">
   <button type="button" class="vb" id="vSh" aria-label="공유"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
   <button type="button" class="vb" id="vDl" aria-label="다운로드"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg></button>
  </div>
 </div>
 <button type="button" class="vnav p" id="vP" aria-label="이전 사진">‹</button>
 <button type="button" class="vnav n" id="vNx" aria-label="다음 사진">›</button>
</div>

<div class="ov" id="sh" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="grab"></div><h3 id="shT"></h3><p class="ss" id="shS"></p><div id="shB"></div></div></div>
<div class="ov" id="bz" aria-hidden="true"><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="bzT"><div class="sp"></div><p id="bzT"></p><p id="bzS"></p><div class="bar"><i id="bzP"></i></div><button type="button" class="opt x" id="bzX">취소</button></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};

/* ---------- 설정 : 사진 폴더 · 저장소 (GitHub Pages 주소에서 자동으로 알아냅니다) ---------- */
var CFG={owner:'youngho1206',repo:'youngho1206.github.io',dir:'CLOUDPHOTOUPLOAD'};
var HOST=location.hostname,IS_GH=/\.github\.io$/i.test(HOST);
if(IS_GH){CFG.owner=HOST.split('.')[0];var seg=location.pathname.split('/');CFG.repo=seg.length>2?seg[1]:HOST}
var EXT=/\.(jpe?g|png|gif|webp|avif|bmp|heic|heif|svg)$/i;
var MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',avif:'image/avif',bmp:'image/bmp',heic:'image/heic',heif:'image/heif',svg:'image/svg+xml'};
var UA=navigator.userAgent,IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var CK='cloudphoto:list';

var S={photos:[],view:[],sel:new Set(),mode:false,desc:true,loading:false,last:null};
var grid=$('#grid'),tiles=[];

/* ---------- 작은 도구 ---------- */
var tt;
function toast(m,ms){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},ms||2600)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function fmtSize(n){if(!n)return'';return n>=1048576?(n/1048576).toFixed(n>=10485760?0:1)+'MB':Math.max(1,Math.round(n/1024))+'KB'}
function mimeOf(n){var m=/\.([a-z0-9]+)$/i.exec(n);return(m&&MIME[m[1].toLowerCase()])||'application/octet-stream'}
function stamp(){var d=new Date(),p=function(n){return('0'+n).slice(-2)};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())}
function absUrl(p){return new URL(p.src,location.href).href}
function mkp(name,size,raw){return{name:name,size:size||0,src:CFG.dir+'/'+encodeURIComponent(name),raw:raw||null}}

/* ---------- 사진 목록 가져오기 ----------
   GitHub Pages 는 폴더 목록을 직접 알려주지 않아서, 저장소의 CLOUDPHOTOUPLOAD 폴더를 GitHub 에 물어봅니다.
   (폴더 목록을 보여주는 서버라면 그 목록을, 없으면 CLOUDPHOTOUPLOAD/list.json 을 대신 읽습니다.) */
function viaApi(force){
 var u='https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+'/contents/'+CFG.dir;
 return fetch(u,{headers:{Accept:'application/vnd.github+json'},cache:force?'reload':'default'}).then(function(r){
  if(r.status===404)return[];
  if(!r.ok)throw new Error('api '+r.status);

 }).then(function(a){

var CRCT=(function(){var t=new Uint32Array(256),c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  var nm=enc.encode(f.name),sz=f.blob.size,lh=new DataView(new ArrayBuffer(30)),ch=new DataView(new ArrayBuffer(46));

  lh.setUint32(14,f.crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
  parts.push(lh.buffer,nm,f.blob);
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
  ch.setUint32(16,f.crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);

async function saveZip(list){
 var bl=await fetchAll(list,'ZIP 파일 만드는 중…');if(!bl)return;
 var files=[],fail=0;
 for(var i=0;i<list.length;i++){if(bl[i])files.push({name:list[i].name,blob:bl[i]});else fail++}

 toast(fail?(files.length+'장을 저장했어요. '+fail+'장은 불러오지 못했어요.'):files.length+'장을 ZIP 파일로 저장했어요.',3600);
}

  try{saveBlob(await blobOf(list[i]),list[i].name)}catch(e){fail++}

async function share(list){
 if(!list.length){toast('먼저 사진을 선택해 주세요.');return}
 var bl=await fetchAll(list,'공유 준비 중…');if(!bl)return;
 var files=[];bl.forEach(function(b,i){if(b)files.push(fileOf(list[i],b))});
 if(!files.length){toast('사진을 불러오지 못했어요.');return}
 var data={files:files};
 if(navigator.canShare&&navigator.canShare(data)){
  try{await navigator.share(data);return}
  catch(e){
   if(e&&e.name==='AbortError')return;
   if(e&&e.name==='NotAllowedError'){ /* 준비하는 사이 ‘눌렀다’는 기록이 지워진 경우 : 한 번 더 누르게 함 */
    openSheet('공유할 사진이 준비됐어요',files.length+'장',[{t:'공유창 열기',s:'아래 버튼을 한 번 더 눌러 주세요.',c:'pri',f:function(){navigator.share(data).catch(function(){})}}]);return;
   }
  }
 }else if(navigator.canShare&&files.length>1){toast('한 번에 공유하기엔 사진이 많거나 커요. 나눠서 공유해 주세요.',3800)}
 shareLinks(list);
}
function shareLinks(list){ /* 파일 공유가 안 되는 기기 : 사진 주소를 공유(또는 복사) */
 var urls=list.map(absUrl),text=urls.join('\n');
 if(navigator.share){navigator.share(list.length===1?{title:list[0].name,url:urls[0]}:{title:'사진첩',text:text}).catch(function(){});return}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('이 기기는 사진 파일 공유를 지원하지 않아 사진 주소를 복사했어요.',3800)},function(){toast('공유를 지원하지 않는 기기예요.')});return}

}

function zoomTo(ns,cx,cy,anim){
 var r=vs.getBoundingClientRect(),px=cx-(r.left+r.width/2),py=cy-(r.top+r.height/2);
 ns=Math.min(6,Math.max(1,ns));
 V.x=px-(px-V.x)*ns/V.s;V.y=py-(py-V.y)*ns/V.s;V.s=ns;
 if(ns===1){V.x=0;V.y=0}else clampPan();
 vi.style.transition=anim?'transform .22s ease-out':'none';apply();
}
var lt=0,lx=0,ly=0,ltm=0;
function tap(e){
 var n=Date.now();
 if(n-lt<300&&Math.abs(e.clientX-lx)<30&&Math.abs(e.clientY-ly)<30){clearTimeout(ltm);lt=0;zoomTo(V.s>1?1:2.6,e.clientX,e.clientY,true)}
 else{lt=n;lx=e.clientX;ly=e.clientY;clearTimeout(ltm);ltm=setTimeout(function(){vw.classList.toggle('hide')},280)}
}
function pts(){return Array.from(P.values())}
function dist(a){return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1}
vs.addEventListener('pointerdown',function(e){
 if(e.button>0)return;
 try{vs.setPointerCapture(e.pointerId)}catch(x){}
 P.set(e.pointerId,{x:e.clientX,y:e.clientY});vi.style.transition='none';
 if(P.size===1)G={x0:e.clientX,y0:e.clientY,tx:V.x,ty:V.y,t:Date.now(),mode:'',moved:false};
 else if(P.size===2){var a=pts();G={mode:'pinch',pd:dist(a),ps:V.s,moved:true,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2}}
});
vs.addEventListener('pointermove',function(e){
 if(!P.has(e.pointerId)||!G)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(G.mode==='pinch'&&P.size>=2){var a=pts();zoomTo(G.ps*dist(a)/G.pd,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,false);return}
 if(P.size!==1)return;
 var dx=e.clientX-G.x0,dy=e.clientY-G.y0;
 if(Math.abs(dx)+Math.abs(dy)>8)G.moved=true;
 if(V.s>1){V.x=G.tx+dx;V.y=G.ty+dy;clampPan();apply();return}
 if(!G.mode&&G.moved)G.mode=Math.abs(dx)>Math.abs(dy)?'h':'v';
 if(G.mode==='h'){var edge=(V.i===0&&dx>0)||(V.i===S.view.length-1&&dx<0);V.x=edge?dx*.3:dx;V.y=0;apply()}
 else if(G.mode==='v'){var k=Math.min(1,Math.abs(dy)/420);V.x=0;V.y=dy;vw.style.setProperty('--vb',1-k*.65);vi.style.transform='translate3d(0,'+dy+'px,0) scale('+(1-k*.14)+')'}
});
function endPtr(e,cancel){
 if(!P.has(e.pointerId))return;P.delete(e.pointerId);
 if(P.size>0){ /* 두 손가락 중 하나만 뗌 : 남은 손가락으로 이어서 이동 */
  var r=pts()[0];G={x0:r.x,y0:r.y,tx:V.x,ty:V.y,t:Date.now(),mode:'pan',moved:true};
  if(V.s<1.05)reset(true);return;
 }
 var g=G;G=null;if(!g)return;
 if(g.mode==='pinch'||g.mode==='pan'){if(V.s<1.05)reset(true);return}
 if(cancel){reset(true);return}
 if(V.s>1){if(!g.moved)tap(e);return}
 var dx=e.clientX-g.x0,dy=e.clientY-g.y0,dt=Math.max(1,Date.now()-g.t);
 if(g.mode==='h'){if(Math.abs(dx)>Math.min(90,vs.clientWidth*.2)||(Math.abs(dx)>28&&Math.abs(dx)/dt>.45))go(dx<0?1:-1);else reset(true)}
 else if(g.mode==='v'){if(Math.abs(dy)>110||(dy>40&&dy/dt>.6))closeV();else reset(true)}
 else tap(e);
}
vs.addEventListener('pointerup',function(e){endPtr(e,false)});
vs.addEventListener('pointercancel',function(e){endPtr(e,true)});
vs.addEventListener('wheel',function(e){e.preventDefault();zoomTo(V.s*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY,false)},{passive:false});
$('#vX').onclick=function(){closeV()};
$('#vP').onclick=function(){go(-1)};
$('#vNx').onclick=function(){go(1)};
$('#vDl').onclick=function(){var p=S.view[V.i];if(p)saveOne(p)};
$('#vSh').onclick=function(){var p=S.view[V.i];if(p)share([p])};
addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(sh.classList.contains('on'))closeSheet();else if(V.on)closeV();else if(S.mode)exitSel();return}
 if(!V.on)return;
 if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);
});

/* ---------- 시작 : 지난번 목록을 먼저 보여주고, 최신 목록으로 바꿉니다 ---------- */
try{var c=JSON.parse(localStorage.getItem(CK)||'null');if(Array.isArray(c)&&c.length){S.photos=c;render()}}catch(e){}
paint();
load(false);
})();
</script>
