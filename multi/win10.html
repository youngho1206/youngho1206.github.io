.wm .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 20px}.wm .cards div{padding:14px 6px;border:1px solid #c5d3e4;background:linear-gradient(#fff,#e9f0f8);text-align:center;cursor:default;font-size:13px}.wm .cards div:hover{background:#dcecfb}
.wm .wv{display:flex;flex-direction:column;height:100%}.wm .wv iframe{flex:1;border:0;background:#000;min-height:0}.wm .wv .wi{padding:8px 12px;background:#f5f8fc;border-top:1px solid #c5d3e4}
.wm .stg{padding:18px 20px;line-height:1.7}.wm .stg input{width:100%;max-width:440px;border:1px solid #8ea2bb;padding:4px 6px;user-select:text;font:inherit}.wm .stg button{margin-top:8px;padding:4px 16px}
.wm .msg{padding:30px 22px;line-height:1.8;color:#333}
/* 게임공략: 인터넷 익스플로러 스타일 */
.win.iew{background:#0a54d0;padding:0 3px 3px;border-radius:8px 8px 0 0;min-width:320px}
.win.iew.max{border-radius:0}
.win.iew .tbar{height:30px;margin:0 -3px;padding:0 4px 0 3px;border-radius:7px 7px 0 0;background:linear-gradient(#3f97ff,#0a5ee0 14%,#0a55d4 80%,#0a46b4);color:#fff}
.win.iew:not(.act) .tbar{color:#e2ebff;filter:saturate(.7)}
.win.iew .tbar .t{font-size:13px;font-weight:700;text-shadow:1px 1px #0a2f80;padding-left:6px}
.win.iew .tbar button{width:22px;height:22px;margin-left:2px;border:1px solid #fff;border-radius:3px;background:linear-gradient(#69a8ff,#1f62e0);color:#fff;font-size:12px;font-weight:700;padding:0}
.win.iew .tbar .x,.win.iew .tbar .x:hover{background:linear-gradient(#ee8b69,#c5391b);color:#fff}
.win.iew .tbar button:hover{filter:brightness(1.18)}
.win.iew .body{background:#ece9d8}
.iex{display:flex;flex-direction:column;height:100%;background:#ece9d8;color:#000;font-size:12px}
.iex button{font:inherit}
.iex .im{display:flex;align-items:center;gap:2px;padding:2px 4px;background:#f5f4ea;border-bottom:1px solid #d8d4c0;flex:none;overflow:hidden;white-space:nowrap}
.iex .im span{padding:2px 9px}.iex .im span:hover{background:#316ac5;color:#fff}
.iex .im .fl{margin-left:auto;display:grid;grid-template-columns:1fr 1fr;width:20px;height:18px;gap:1px;padding:0;transform:skewX(-6deg)}
.iex .fl b:nth-child(1){background:#e5472f}.iex .fl b:nth-child(2){background:#7fba00}.iex .fl b:nth-child(3){background:#00a4ef}.iex .fl b:nth-child(4){background:#ffb900}
.iex .itb{display:flex;align-items:flex-start;gap:2px;padding:3px 6px 2px;background:linear-gradient(#fbfaf5,#ece9d8);border-bottom:1px solid #aca899;flex:none;overflow:hidden}
.iex .ib{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:46px;padding:2px 5px;border:1px solid transparent;background:none;color:#000;white-space:nowrap}
.iex .ib:hover:not(:disabled){border-color:#a9b7d4;background:#e6eefb}
.iex .ib:disabled{opacity:.5}
.iex .ib i{font-style:normal;font-size:21px;height:28px;display:grid;place-items:center}
.iex .ib .gc{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a6efa6,#1f9a2a 70%);border:1px solid #167d20;color:#fff;font-size:17px;font-weight:700}
.iex .ib .gc.g{background:radial-gradient(circle at 35% 30%,#eee,#9a9a9a 70%);border-color:#888}
.iex .sep{width:1px;height:40px;background:#aca899;margin:0 4px;flex:none}
.iex .iad{display:flex;align-items:center;gap:6px;padding:3px 6px;background:#ece9d8;border-bottom:1px solid #aca899;flex:none}
.iex .iad label{flex:1;display:flex;align-items:center;gap:5px;height:22px;padding:0 4px;background:#fff;border:1px solid #7f9db9;min-width:0}
.iex .iad input{flex:1;border:0;outline:0;font:inherit;font-size:13px;user-select:text;min-width:0}
.iex .iad .go{display:flex;align-items:center;gap:4px;border:0;background:none;padding:2px 4px}
.iex .iad .go b{display:grid;place-items:center;width:18px;height:18px;background:linear-gradient(#59c35a,#1f8d2a);color:#fff;border-radius:3px}
.iex .ipg{flex:1;min-height:0;overflow:auto;position:relative;background:#fff;display:flex;flex-direction:column}
.iex .ist{display:flex;align-items:center;height:22px;padding:0 6px;background:#ece9d8;border-top:1px solid #aca899;flex:none}
.iex .ist .r{margin-left:auto;display:flex;gap:6px;align-items:center;padding-left:10px;border-left:1px solid #aca899}
.ihp{flex:1 0 auto;position:relative;padding:84px 24px 214px;background:linear-gradient(#4aaef3 0,#7cc7f7 40%,#b9e2fb 75%,#d8f1fd 100%);overflow:hidden}
.ihp::before{content:"";position:absolute;left:-40px;top:60px;width:300px;height:320px;background:radial-gradient(ellipse 90px 55px at 80px 60px,#fffe,#fff0 72%),radial-gradient(ellipse 110px 65px at 130px 170px,#fffd,#fff0 72%),radial-gradient(ellipse 80px 48px at 70px 260px,#fffc,#fff0 72%)}

.ihp .tg{position:absolute;left:46px;top:26px;transform:rotate(-6deg);color:#fff;font:italic 700 19px/1.3 "Segoe Script","Nanum Pen Script","Malgun Gothic",cursive;text-shadow:0 1px 4px #2a78c8}
.ihp .tg b{display:block;margin-left:20px;font-size:25px}
.ihp .cn{position:relative;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;max-width:900px;margin:0 auto}
.ihp .lc{flex:1 1 420px;min-width:0}
.ihp .nw{flex:0 1 260px;min-width:220px;background:rgba(228,243,254,.9);border:1px solid #a9d3f2;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #4a8fd433}
.ihp .nw h4{padding:10px 14px;background:#cfe6f8;color:#0b4f96;font-size:14px}
.ihp .nw ul{list-style:none;padding:8px 14px 12px}
.ihp .nw li{position:relative;padding:6px 0 6px 14px;color:#0b57a8;font-size:13px}
.ihp .nw li::before{content:"";position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:#2c8ae0}
.ihp .sbx{display:flex;align-items:center;gap:8px;padding:9px;background:rgba(228,243,254,.9);border:1px solid #b6dbf4;border-radius:8px 8px 0 0}
.sw{display:flex;flex:none;border:2px solid #2a74d6;border-radius:3px;overflow:hidden;background:#fff}
.eg{padding:6px 10px;color:#2a74d6;cursor:default;font-size:12px;font-weight:700;white-space:nowrap}
.eg.on{background:#2a74d6;color:#fff}
.ihp .sbx input{flex:1;min-width:0;height:34px;border:2px solid #2a74d6;outline:0;padding:0 8px;font:inherit;font-size:14px;user-select:text;background:#fff}
.ihp .sgo{height:34px;padding:0 20px;border:0;background:linear-gradient(#2f86e8,#1d63c8);color:#fff;font-size:14px;font-weight:700}
.ihp .ip{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px 2px;padding:10px 6px 8px;background:rgba(228,243,254,.82);border:1px solid #b6dbf4;border-top:0;border-radius:0 0 8px 8px}
.ihp .ci{text-align:center;color:#0b4f96;font-size:12px;padding:4px 0;cursor:default}
.ihp .ci i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 4px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#e3f1fc 70%,#cfe6f8);box-shadow:0 1px 4px #4a8fd455}
.ihp .ci i svg{width:40px;height:40px}
.ihp .ci:hover i{box-shadow:0 0 0 3px #7bb8ee}
.irp{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:#fff}
.irb{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#fff8d6;border-bottom:1px solid #e6dc9c;flex:none;flex-wrap:wrap}
.irb b{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irb .sw{border-width:1px}.irb .eg{padding:2px 10px}
.irb .hint{margin-left:auto;color:#665}
.irb button{border:1px solid #b9ad5c;background:#fff;padding:2px 8px}
.irp iframe{flex:1;width:100%;border:0;min-height:0;background:#fff}
/* 음악 플레이어 */
.win.mpw{background:#2a2c31;min-width:480px;min-height:300px}
.win.mpw .tbar{position:absolute;left:0;right:0;top:0;z-index:6;background:linear-gradient(#000a,#0000);color:#fff}
.win.mpw:not(.act) .tbar{color:#bbb}
.win.mpw .tbar .t{font-size:12px;opacity:.9}
.win.mpw .tbar button:hover{background:#fff2}
.win.mpw .tbar .x:hover{background:#e81123;color:#fff}

function calc(b){
 b.innerHTML=`<div class="calc"><div class="scr"><small></small><span>0</span></div>${["%","CE","C","⌫","1/x","x²","√","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="].map(k=>`<button class="${/[÷×−+]/.test(k)?"o":k=="="?"eq":""}">${k}</button>`).join("")}</div>`;
 const sc=b.querySelector(".scr span"),sm=b.querySelector("small");let cu="0",pr=null,op=null,fresh=true;
 const show=()=>sc.textContent=cu.length>14?(+cu).toExponential(6):cu;
 const calcF=(a,o,c)=>o=="+"?a+c:o=="−"?a-c:o=="×"?a*c:o=="÷"?(c==0?NaN:a/c):c;
 b.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{const k=bt.textContent;
  if(/\d/.test(k)){cu=fresh||cu=="0"?k:cu+k;fresh=false}
  else if(k=="."){if(fresh){cu="0.";fresh=false}else if(!cu.includes("."))cu+="."}
  else if(k=="C"){cu="0";pr=op=null;sm.textContent="";fresh=true}
  else if(k=="CE"){cu="0";fresh=true}
  else if(k=="⌫"){cu=cu.length>1?cu.slice(0,-1):"0"}
  else if(k=="±"){cu=String(-cu)}
  else if(k=="x²"){cu=String(cu*cu);fresh=true}
  else if(k=="√"){cu=String(Math.sqrt(cu));fresh=true}
  else if(k=="1/x"){cu=cu==0?"NaN":String(1/cu);fresh=true}
  else if(k=="%"){cu=String(cu/100)}
  else if(k=="="){if(op!=null){sm.textContent=pr+" "+op+" "+cu+" =";cu=String(calcF(pr,op,+cu));pr=op=null;fresh=true}}
  else{if(op!=null&&!fresh){cu=String(calcF(pr,op,+cu))}pr=+cu;op=k;sm.textContent=cu+" "+k;fresh=true}
  if(cu==="NaN")cu="정의되지 않음";show()});
}

 function score(e,toks,full,chq){
  const n=e._n||(e._n=norm(e.name)),k=e._k||(e._k=norm((e.kw||"")+" "+(e.sub||""))),c=e._c||(e._c=cho(n));let s=0;
  for(const t of toks){
   if(n.startsWith(t))s+=100;
   else{const i=n.indexOf(t);
    if(i>=0)s+=/[\s._\-()\[\]]/.test(n[i-1])?85:62;
    else if(chq&&c.startsWith(t))s+=75;
    else if(chq&&c.includes(t))s+=52;
    else if(k.includes(t))s+=30;
    else return 0}
  }
  if(n===full)s+=80;else if(n.replace(/\.[^.]+$/,"")===full)s+=60;
  return s+(BASE[e.type]||0)-Math.min(n.length,50)*.15;
 }
 function hl(name,toks){
  const n=norm(name);if(n.length!==name.length)return H(name);
  const m=new Array(name.length).fill(0);
  for(const t of toks){if(!t)continue;let i=n.indexOf(t);while(i>=0){for(let j=i;j<i+t.length;j++)m[j]=1;i=n.indexOf(t,i+t.length)}}
  let o="",on=false;
  for(let i=0;i<name.length;i++){if(m[i]&&!on){o+="<mark>";on=true}if(!m[i]&&on){o+="</mark>";on=false}o+=H(name[i])}
  return o+(on?"</mark>":"");
 }
