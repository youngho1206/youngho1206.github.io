<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Player — Retro Archive</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css"><style>
body{min-height:100vh}.player-top{height:70px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.back{color:#f2aa72;font-size:12px}.player-main{max-width:1200px;margin:35px auto;padding:0 22px}.player-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.player-heading h1{font:700 27px "Space Grotesk";margin:8px 0}.player-heading p{color:#8f9db1;font-size:12px;margin:0}.screen-shell{background:#05080e;border:1px solid #ffffff20;border-radius:10px;padding:12px;box-shadow:0 20px 60px #0006}.screen{height:min(68vh,680px);min-height:360px;width:100%;background:#000;border-radius:5px;overflow:hidden}.player-note{font-size:11px;color:#8998ad;line-height:1.8;margin-top:17px}.player-error{padding:40px;text-align:center;color:#aab6c8}.player-error strong{display:block;color:#f2aa72;margin-bottom:8px}
</style></head><body><header class="player-top"><a class="brand" href="./"><span class="brand-mark">R</span><span>RETRO<span class="brand-light">ARCHIVE</span></span></a><a class="back" href="./#library">← BACK TO LIBRARY</a></header><main class="player-main"><div class="player-heading"><div><div class="eyebrow">NOW PLAYING</div><h1 id="game-title">Loading game…</h1><p id="game-platform">Browser game player</p></div></div><div class="screen-shell"><div class="screen" id="dos"><div class="player-error">Preparing the game player…</div></div></div><p class="player-note">Tip: click inside the game screen to capture keyboard input. Press Esc or use your browser controls to leave full-screen mode. Game files are loaded from this site's <code>games/</code> folder.</p></main>
<script>
(async()=>{const id=new URLSearchParams(location.search).get("game");const title=document.querySelector("#game-title"),platform=document.querySelector("#game-platform"),host=document.querySelector("#dos");try{const r=await fetch("games/games.json?t="+Date.now(),{cache:"no-store"});const games=await r.json();const g=games.find(x=>x.id===id);if(!g)throw new Error("게임 정보를 찾을 수 없습니다.");title.textContent=g.title;platform.textContent=({dos:"MS-DOS",win95:"Windows 95",win98:"Windows 98"}[g.platform]||g.platform)+" · "+(g.year||"");if(!g.bundle){const files=Array.isArray(g.files)?g.files:[];if(files.length){const list=files.map(path=>{const label=path.split("/").slice(4).join("/");return `<li><a href="${encodeURI(path)}" target="_blank" rel="noopener">${label.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}</a></li>`}).join("");host.innerHTML=`<div class="player-error"><strong>게임 파일을 불러왔습니다.</strong>ZIP 내부에서 추출한 파일 ${files.length}개를 확인할 수 있습니다.<ul style="text-align:left;line-height:1.9;margin:18px auto;max-width:760px">${list}</ul><p>실행 파일(EXE 등)은 해당 플랫폼을 지원하는 에뮬레이터/가상 PC 환경이 별도로 필요합니다. JS-DOS용 .jsdos 파일이 포함된 경우 자동 실행됩니다.</p></div>`;return;}if(g.platform!=="dos")throw new Error("게임 파일은 등록되었지만 Windows 95/98 가상 PC 실행 환경은 아직 연결되지 않았습니다.");throw new Error("이 DOS 게임에는 JS-DOS 번들이 아직 등록되지 않았습니다.");}const css=document.createElement("link");css.rel="stylesheet";css.href="https://v8.js-dos.com/latest/js-dos.css";document.head.appendChild(css);const s=document.createElement("script");s.src="https://v8.js-dos.com/latest/js-dos.js";s.onload=()=>{host.innerHTML="";Dos(host,{url:g.bundle});};s.onerror=()=>{host.innerHTML='<div class="player-error"><strong>Player library could not load</strong>Check your internet connection and try again.</div>'};document.head.appendChild(s)}catch(e){host.innerHTML='<div class="player-error"><strong>Game is not ready yet</strong>'+e.message+'</div>';title.textContent="Game unavailable"}})();
</script></body></html>
