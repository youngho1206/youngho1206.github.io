<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08051f">
<title>사이트 운영 안내</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#20134b 0%,#0b0827 48%,#050414 100%);color:#fff}
.notice{width:min(100%,760px);padding:clamp(32px,7vw,64px) 24px;text-align:center;border:1px solid rgba(173,145,255,.28);border-radius:22px;background:rgba(16,12,43,.72);box-shadow:0 20px 70px rgba(0,0,0,.38),0 0 45px rgba(119,83,255,.12)}
.mark{width:58px;height:58px;margin:0 auto 26px;border:2px solid #a994ff;border-radius:50%;display:grid;place-items:center;color:#c5b5ff;font-size:30px;font-weight:700}
h1{margin:0;font-size:clamp(19px,4vw,29px);line-height:1.6;font-weight:700;word-break:keep-all}
</style>
</head>
<body>
<main class="notice">
<div class="mark" aria-hidden="true">!</div>
<h1>현재 사이트 운영이 잠시 정지 되었음을 알려드립니다.</h1>
</main>
</body>
</html>
