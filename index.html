<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Web Version</title>
<style>
:root{--bg:#fafafa;--tx:#111827;--sub:#6b7280;--line:#eceef2;--blue:#3b6cff;--vio:#6d4cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
[hidden]{display:none!important}
.screen{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:90px}
h2,h3,p{margin:0}

/* home */
.logo{text-align:center;padding:56px 20px 8px;font-size:clamp(40px,12vw,58px);font-weight:800;letter-spacing:-2px;line-height:1.1}
.logo b{background:linear-gradient(90deg,#2563eb,#6d4cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{color:#111a3a}
.tag{text-align:center;color:#5b6478;font-size:14px;margin:10px 0 28px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.card{background:#fff;border-radius:28px;box-shadow:0 6px 24px rgba(20,30,60,.07);padding:18px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.card:active{transform:scale(.97)}
.card img{width:78%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.08))}
.card h3{font-size:22px;font-weight:700;margin-top:4px}
.card p{font-size:12.5px;color:#6b7390}
.card .go{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:6px}
.foot{text-align:center;color:#8a90a0;font-size:12px;margin-top:28px}

/* bars */
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 8px;position:sticky;top:0;background:var(--bg);z-index:5;min-height:64px}
.ttl{display:flex;align-items:center;gap:6px}
.ttl h2{font-size:26px;font-weight:700;letter-spacing:-.5px}
.ttl p{font-size:13px;color:var(--sub);margin-top:1px}
.acts{display:flex;align-items:center;gap:4px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ib:active,.txtbtn:active{background:#eceef2}
.txtbtn{font-size:16px;padding:8px 12px;border-radius:12px}
.mid{font-size:17px;font-weight:600}

/* photo */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{position:relative;aspect-ratio:1;background:#e5e7eb;overflow:hidden;cursor:pointer}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block}
.vb{position:absolute;right:6px;bottom:6px;color:#fff;width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.vb svg{width:22px;height:22px}
.chk{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}
.cell.on .chk{background:var(--blue);border-color:var(--blue)}
.cell.on .chk::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cell.on img,.cell.on video{opacity:.75}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18vh 24px 0}
.empty img{width:110px;opacity:.45;filter:grayscale(1)}
.empty h3{font-size:18px;font-weight:600;margin-top:22px}
.empty p{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.5}
.pill{margin-top:22px;border:1px solid #e3e6ec;border-radius:30px;padding:14px 32px;font-size:16px;font-weight:500;background:#fff}
.fab{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));right:max(20px,calc(50% - 260px));width:56px;height:56px;border-radius:50%;background:#111827;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:8}
.selbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:9}
.selbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:6px 0;border-radius:12px}
.selbar button:active{background:#f1f3f7}
.selbar button.dis{opacity:.35}

/* viewer */
#viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#viewer .vt{display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;color:#fff}
#viewer .vm{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#viewer .vm img,#viewer .vm video{max-width:100%;max-height:100%}
#viewer .vm img{user-select:none;-webkit-user-drag:none;transform-origin:center center;will-change:transform}
#viewer .vn{position:absolute;top:50%;color:#fff;width:44px;height:64px;display:grid;place-items:center;background:rgba(0,0,0,.25)}

/* menu / toast */
.menu{position:fixed;z-index:60;background:#fff;border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.2);padding:6px;min-width:160px}
.menu button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:10px;font-size:15px}
.menu button:active{background:#f1f3f7}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(17,24,39,.92);color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* music */
.np{display:flex;gap:16px;padding:6px 20px 0;align-items:center}
.cover{width:140px;height:140px;border-radius:24px;flex:none;display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(80,60,160,.18)}
.cover svg{width:54px;height:54px;opacity:.9}
.meta{min-width:0;flex:1}
.meta h3{font-size:21px;font-weight:700;line-height:1.3;word-break:break-all}
.meta p{font-size:15px;color:var(--sub);margin-top:6px}
.mini{display:flex;gap:18px;margin-top:16px}
.seekw{padding:18px 20px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--vio) var(--p,0%),#d1d5db var(--p,0%));outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--vio)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--vio)}
.times{display:flex;justify-content:space-between;font-size:12.5px;color:#4b5563}
.ctl{display:flex;align-items:center;justify-content:space-between;padding:10px 24px}
.ctl button{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;position:relative}
.ctl .pp{width:64px;height:64px}
.ctl .pp svg{width:40px;height:40px}
.ctl .on{color:var(--blue)}
.ctl .one::after{content:'1';position:absolute;font-size:9px;font-weight:700;top:17px;left:21px}
.sheet{background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -4px 24px rgba(20,30,60,.07);margin:12px 8px 0;padding:10px 16px 90px;min-height:340px}
.grab{width:46px;height:5px;border-radius:3px;background:#d1d5db;margin:0 auto 14px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-h b{font-size:17px}.sh-h span{font-size:14px;color:var(--sub);flex:1}
.tr{display:flex;align-items:center;gap:12px;padding:8px 0}
.tr .eq{width:20px;display:flex;gap:2px;align-items:flex-end;height:16px;flex:none}
.tr .eq i{width:3px;background:var(--blue);border-radius:2px;animation:eq 1s infinite ease-in-out}
.tr .eq i:nth-child(1){height:6px}.tr .eq i:nth-child(2){height:14px;animation-delay:.2s}.tr .eq i:nth-child(3){height:9px;animation-delay:.4s}
.paused .eq i{animation:none}
@keyframes eq{50%{transform:scaleY(.4)}}
.tr .th{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.tr .th svg{width:22px;height:22px}
.tr .tx{flex:1;min-width:0;cursor:pointer}
.tr .tx b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .tx small{font-size:13.5px;color:var(--sub)}
.tr.cur .tx b,.tr.cur .tx small{color:var(--blue)}
.tr .du{font-size:14px;color:var(--sub)}

#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(#e9e9ee,#f3f3f6);display:flex;flex-direction:column;overflow:hidden}
#gate[hidden]{display:none}
.gwrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding:min(7vh,56px) 20px 0}
.gtitle{width:min(58vw,250px);filter:drop-shadow(0 8px 12px rgba(255,70,110,.30))}
.glabel{margin-top:min(3.5vh,26px);font-size:15px;color:#6b7280}
.boxes{display:flex;gap:12px;margin-top:16px}
.boxes.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pbox{width:min(15vw,60px);height:min(18vw,72px);border-radius:18px;border:1px solid #e1e2e8;background:#f5f5f8;box-shadow:inset 0 2px 6px rgba(0,0,0,.06),0 1px 0 #fff;display:grid;place-items:center;transition:.12s}
.pbox i{width:11px;height:11px;border-radius:50%;background:#c4c7cf;transition:.12s}
.pbox.f i{background:#374151;width:14px;height:14px}
.pbox.cur{border-color:#ff5c82;box-shadow:0 0 0 3px rgba(255,92,130,.18)}
.gbtn{position:relative;margin-top:min(3vh,22px);width:min(72vw,290px);filter:drop-shadow(0 8px 10px rgba(255,70,110,.28))}
.gbtn img{width:100%;display:block}
.gbtn span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;text-shadow:0 1px 3px rgba(150,0,40,.35)}
.gbtn:active{transform:scale(.98)}
.gforgot{margin-top:min(2.5vh,18px);font-size:14px;color:#6b7280;text-decoration:underline;padding:6px}
.pad{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#f7f7fa;border-radius:28px 28px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.06);padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
@media (max-height:700px){.pad button{height:46px;font-size:22px}.pad{padding-top:10px}.gtitle{width:min(46vw,190px)}.gwrap{padding-top:5vh}.glabel{margin-top:14px}.gbtn{width:min(62vw,250px);margin-top:14px}.gforgot{margin-top:10px}.pbox{height:min(15vw,56px)}}
.pad .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:min(8.6vh,58px);border-radius:14px;background:#fbfbfd;box-shadow:0 2px 5px rgba(0,0,0,.09),inset 0 1px 0 #fff;font-size:24px;color:#374151;display:grid;place-items:center;touch-action:manipulation;user-select:none}
.pad button:active{background:#eceef2}
.pad button.blank{visibility:hidden}
#pwModal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:grid;place-items:center;padding:20px}
.pwb{background:#fff;border-radius:22px;padding:22px 20px 14px;width:min(340px,100%)}
.pwb h3{font-size:18px}.pwb p{font-size:14px;color:var(--sub);margin:6px 0 14px}
.pwb input{width:100%;border:1px solid #d9dde5;border-radius:12px;padding:13px 14px;font-size:17px;outline:0}
.pwb input:focus{border-color:var(--blue)}
.pwh{margin:10px 0 4px}.pwh button{font-size:13px;color:var(--blue);text-decoration:underline}
.pwa{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.pwa button{padding:11px 18px;border-radius:12px;font-size:15px}.pwa #pwOk{color:#fff;background:#111827}
/* memo */
.mgrid{columns:2;column-gap:12px;padding:6px 16px}
.mc{break-inside:avoid;background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(20,30,60,.06);cursor:pointer;display:block;width:100%;text-align:left}
.mc b{display:block;font-size:16px;margin-bottom:6px;word-break:break-all}
.mc p{font-size:13.5px;color:#4b5563;line-height:1.5;max-height:7.5em;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.mc small{display:block;color:#9ca3af;font-size:12px;margin-top:10px}
#editor{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#editor textarea{flex:1;border:0;outline:0;resize:none;padding:6px 20px 30px;font:inherit;font-size:17px;line-height:1.7;color:var(--tx)}
#editor .dt{padding:0 20px 8px;color:#9ca3af;font-size:13px}
</style>
</head>
<body>

<section id="home" class="screen">
  <div class="logo"><b>Web</b> <span>Version</span></div>
  <p class="tag">다양한 기능을 웹에서 간편하게 이용해보세요.</p>
  <div class="cards">
    <button class="card" data-go="photo"><img src="icons/photo.png" alt=""><h3>사진</h3><p>사진을 보고 관리해보세요.</p><span class="go" style="color:#2f6bff"></span></button>
    <button class="card" data-go="music"><img src="icons/music.png" alt=""><h3>음악</h3><p>좋아하는 음악을 감상하세요.</p><span class="go" style="color:#ff4d6a"></span></button>
    <button class="card" data-go="memo"><img src="icons/memo.png" alt=""><h3>메모</h3><p>간편하게 메모를 작성하세요.</p><span class="go" style="color:#f5a623"></span></button>
    <button class="card" data-go="game"><img src="icons/game.png" alt=""><h3>게임</h3><p>재미있는 게임을 즐겨보세요.</p><span class="go" style="color:#6d4cff"></span></button>
  </div>
  <p class="foot">© 2026 Web Version. All rights reserved. · <button id="logout" style="text-decoration:underline;color:inherit;font-size:inherit">로그아웃</button></p>
</section>

<section id="photo" class="screen" hidden></section>
<section id="music" class="screen" hidden></section>
<section id="memo" class="screen" hidden></section>

<div id="gate">
  <div class="gwrap">
  <img class="gtitle" src="icons/title.png" alt="My Site">
  <p class="glabel">4자리 암호를 입력해주세요</p>
  <div class="boxes" id="boxes"><div class="pbox"><i></i></div><div class="pbox"><i></i></div><div class="pbox"><i></i></div><div class="pbox"><i></i></div></div>
  <button id="gBtn" class="gbtn"><img src="icons/btn.png" alt=""><span>로그인</span></button>
  <button id="gForgot" class="gforgot">암호를 잊으셨나요?</button>
 </div>
 <div class="pad" id="pad"><div class="g3"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="blank" tabindex="-1"></button><button data-k="0">0</button><button data-k="b" aria-label="지우기"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12 10l5 5M17 10l-5 5"/></svg></button></div></div>
</div>
<div id="viewer" hidden></div>
<div id="editor" hidden></div>
<div id="toast"></div>

<input type="file" id="camPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="camVideo" accept="video/*" capture="environment" hidden>
<input type="file" id="filePhoto" accept="image/*,video/*" multiple hidden>
<input type="file" id="fileMusic" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac" multiple hidden>
<input type="file" id="fileMemo" accept=".txt,text/plain" multiple hidden>

<script>
const $=s=>document.querySelector(s), API='api.php';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=(p,f)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
 back:svg('<path d="M15 5l-7 7 7 7"/>'),
 next:svg('<path d="M9 5l7 7-7 7"/>'),
 close:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
 dots:svg('<circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>',1),
 plus:svg('<path d="M12 5v14M5 12h14"/>'),
 heart:svg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
 heartOn:svg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',1),
 queue:svg('<path d="M4 6h13M4 11h13M4 16h7"/><path d="M17 20v-6l3-1"/><circle cx="15.5" cy="20" r="1.5"/>'),
 shuffle:svg('<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),
 prev:svg('<rect x="5" y="5" width="3" height="14" rx="1"/><path d="M19 5v14L9 12z"/>',1),
 nextT:svg('<rect x="16" y="5" width="3" height="14" rx="1"/><path d="M5 5v14l10-7z"/>',1),
 play:svg('<path d="M7 4v16l13-8z"/>',1),
 pause:svg('<rect x="6" y="4" width="4.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.5"/>',1),
 repeat:svg('<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>'),
 share:svg('<path d="M12 3v12M7 8l5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),
 trash:svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
 check:svg('<path d="M5 12l5 5 9-10"/>'),
 range:svg('<rect x="3" y="5" width="7" height="7" rx="1.5"/><rect x="14" y="12" width="7" height="7" rx="1.5"/><path d="M10 8.5h4v7"/>'),
 all:svg('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>'),
 zoom:svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/>'),
 note:svg('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
};
document.querySelectorAll('.card .go').forEach(g=>g.innerHTML=svg('<path d="M5 12h14M13 6l6 6-6 6"/>'));

let tt;
function toast(m,sticky){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);if(!sticky)tt=setTimeout(()=>t.classList.remove('show'),2300)}
let TOK='';try{TOK=localStorage.wvTok||'';if(Date.now()>+(localStorage.wvTokExp||0))TOK=''}catch(e){}
function needLogin(j){if(j&&j.need_login){showGate();return true}return false}
async function list(t){const r=await fetch(`${API}?a=list&t=${t}&k=${encodeURIComponent(TOK)}&_=${Date.now()}`);const j=await r.json();if(needLogin(j))throw new Error('login');if(!j.ok)throw new Error(j.error||'error');return j.items}
async function post(d){const fd=new FormData();for(const k in d)fd.append(k,d[k]);fd.append('k',TOK);const r=await fetch(API,{method:'POST',body:fd});const j=await r.json();needLogin(j);return j}
function upload(t,files){return new Promise(res=>{
 if(!files||!files.length)return res({});
 const fd=new FormData();fd.append('a','upload');fd.append('t',t);fd.append('k',TOK);[...files].forEach(f=>fd.append('files[]',f));
 const x=new XMLHttpRequest();x.open('POST',API);
 x.upload.onprogress=e=>{if(e.lengthComputable)toast(`업로드 중... ${Math.round(e.loaded/e.total*100)}%`,true)};
 x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
  if(needLogin(j))return res(j);
  toast(j.ok?`${j.saved}개 업로드 완료`+(j.error?' (일부 실패)':''):(j.error||'업로드 실패 - 서버 응답을 확인해주세요'));res(j)};
 x.onerror=()=>{toast('서버(api.php)에 연결할 수 없어요');res({})};
 x.send(fd)})}
function menu(anchor,items){
 closeMenu();const m=document.createElement('div');m.className='menu';m.id='menu';
 items.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=e=>{e.stopPropagation();closeMenu();f()};m.appendChild(b)});
 document.body.appendChild(m);
 const r=anchor.getBoundingClientRect();m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-10)+'px';m.style.right=Math.max(10,innerWidth-r.right)+'px';
 setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0)}
function closeMenu(){const m=$('#menu');if(m)m.remove()}
const fmtD=ts=>{const d=new Date(ts*1000);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
const fmtT=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const abs=u=>new URL(u,location.href).href;
async function shareUrls(items,label){
 try{
  const files=await Promise.all(items.map(async it=>{const r=await fetch(it.url);const b=await r.blob();return new File([b],it.orig||it.name,{type:b.type})}));
  if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}
 }catch(e){if(e&&e.name==='AbortError')return}
 const link=items.map(i=>abs(i.url)).join('\n');
 try{if(navigator.share){await navigator.share({title:label,text:link});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(link);toast('링크를 복사했어요')}catch(e){prompt('링크를 복사하세요',link)}
}
function download(it){const a=document.createElement('a');a.href=it.url;a.download=it.orig||it.name;document.body.appendChild(a);a.click();a.remove()}

/* ---------- 삭제 암호 (검증은 서버에서만) ---------- */
function askPw(msg){return new Promise(res=>{
 const o=document.createElement('div');o.id='pwModal';
 o.innerHTML=`<div class="pwb"><h3>삭제 암호 입력</h3><p>${esc(msg||'')}</p><input type="password" id="pwIn" inputmode="numeric" autocomplete="off" placeholder="암호"><div class="pwh"><button id="pwHint">비밀번호 힌트 보내기</button></div><div class="pwa"><button id="pwNo">취소</button><button id="pwOk">확인</button></div></div>`;
 document.body.appendChild(o);const inp=o.querySelector('#pwIn');inp.focus();
 const done=v=>{o.remove();res(v)};
 o.querySelector('#pwNo').onclick=()=>done(null);
 o.querySelector('#pwOk').onclick=()=>done(inp.value);
 inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value);if(e.key==='Escape')done(null)};
 o.onclick=e=>{if(e.target===o)done(null)};
 o.querySelector('#pwHint').onclick=async()=>{toast('힌트 메일을 보내는 중...',true);
  try{const j=await post({a:'hint'});toast(j.ok?'비밀번호 힌트를 메일로 보냈어요':(j.error||'메일 발송 실패'))}catch(e){toast('메일 발송 실패')}}})}
async function doDelete(t,names,msg){
 const pw=await askPw(msg);if(pw===null)return false;
 for(const nm of names){
  let j={};try{j=await post({a:'delete',t,name:nm,pw})}catch(e){}
  if(!j.ok){toast(j.error||'삭제 실패');return false}}
 return true}

 if(g('pShoot'))g('pShoot').onclick=()=>$('#camPhoto').click();
 if(g('pUp'))g('pUp').onclick=()=>$('#filePhoto').click();
 if(g('sAll'))g('sAll').onclick=()=>{if(P.sel.size===n)P.sel.clear();else P.items.forEach((_,i)=>P.sel.add(i));renderPhoto()};
 if(g('sRange'))g('sRange').onclick=()=>{

 if(g('sDel'))g('sDel').onclick=async()=>{

 if(g('sShare'))g('sShare').onclick=()=>{if(!P.sel.size)return toast('사진을 선택해주세요');shareUrls([...P.sel].map(i=>P.items[i]),'사진')};
 document.querySelectorAll('#photo .cell').forEach(c=>c.onclick=()=>{

/* viewer */
let VI=0;
function openViewer(i){
 VI=i;const it=P.items[i],v=$('#viewer');v.hidden=false;
 v.innerHTML=`<div class="vt"><button class="ib" id="vClose">${I.close}</button><div class="acts"><button class="ib" id="vZoom">${I.zoom}</button><button class="ib" id="vShare">${I.share}</button><button class="ib" id="vDel">${I.trash}</button></div></div>
 <div class="vm">${isVid(it.name)?`<video src="${it.url}" controls autoplay playsinline></video>`:`<img src="${it.url}" alt="">`}</div>
 ${i>0?`<button class="vn" id="vPrev" style="left:0">${I.back}</button>`:''}${i<P.items.length-1?`<button class="vn" id="vNext" style="right:0">${I.next}</button>`:''}`;
 $('#vClose').onclick=closeViewer;
 $('#vShare').onclick=()=>shareUrls([it],'사진');
 $('#vDel').onclick=async()=>{if(await doDelete('photo',[it.name],'이 사진을 삭제합니다.')){closeViewer();loadPhoto()}};
 if($('#vPrev'))$('#vPrev').onclick=()=>openViewer(i-1);
 if($('#vNext'))$('#vNext').onclick=()=>openViewer(i+1);
 setupZoom(v,i)}
function setupZoom(v,i){
 const vm=v.querySelector('.vm'),img=vm.querySelector('img'),last=P.items.length-1;
 const go=n=>{if(n>=0&&n<=last)openViewer(n)};
 if(!img){ /* 동영상: 좌우 스와이프만 */
  const zb=v.querySelector('#vZoom');if(zb)zb.style.display='none';
  let sx=null;v.ontouchstart=e=>sx=e.touches[0].clientX;
  v.ontouchend=e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(d>70)go(i-1);else if(d<-70)go(i+1)};return}
 vm.style.touchAction='none';img.draggable=false;
 let s=1,tx=0,ty=0,d0=0,s0=1,start=null,multi=false,moved=false,lastTap=0;const pts=new Map();
 const navs=v.querySelectorAll('.vn');
 const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;navs.forEach(n=>n.style.display=s>1.02?'none':'')};
 const clamp=()=>{const mx=Math.max(0,(img.offsetWidth*s-vm.clientWidth)/2),my=Math.max(0,(img.offsetHeight*s-vm.clientHeight)/2);tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty))};
 const zoomAt=(ns,cx,cy)=>{ns=Math.min(6,Math.max(1,ns));const k=ns/s;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;s=ns;if(s<=1.001){s=1;tx=0;ty=0}clamp();apply()};
 const rel=(x,y)=>{const r=vm.getBoundingClientRect();return [x-r.left-r.width/2,y-r.top-r.height/2]};
 vm.onpointerdown=e=>{try{vm.setPointerCapture(e.pointerId)}catch(_){}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){multi=true;const[p,q]=[...pts.values()];d0=Math.hypot(p[0]-q[0],p[1]-q[1])||1;s0=s}
  start={x:e.clientX,y:e.clientY,tx,ty};moved=false};
 vm.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size>=2){const[p,q]=[...pts.values()];const d=Math.hypot(p[0]-q[0],p[1]-q[1]);const[cx,cy]=rel((p[0]+q[0])/2,(p[1]+q[1])/2);zoomAt(s0*d/d0,cx,cy);moved=true}
  else if(start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
   if(s>1){tx=start.tx+dx;ty=start.ty+dy;clamp();apply()}}};
 const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(pts.size===1){const[p]=[...pts.values()];start={x:p[0],y:p[1],tx,ty}}
  if(pts.size>0)return;
  const wasMulti=multi;multi=false;if(wasMulti||!start)return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(s===1&&Math.abs(dx)>70&&Math.abs(dy)<90){go(dx>0?i-1:i+1);return}
  if(!moved){const now=Date.now();
   if(now-lastTap<320){lastTap=0;if(s>1)zoomAt(1,0,0);else{const[cx,cy]=rel(e.clientX,e.clientY);zoomAt(2.5,cx,cy)}}else lastTap=now}};
 vm.onpointerup=end;vm.onpointercancel=end;
 vm.onwheel=e=>{e.preventDefault();const[cx,cy]=rel(e.clientX,e.clientY);zoomAt(s*(e.deltaY<0?1.25:0.8),cx,cy)};
 const vbtn=v.querySelector('#vZoom');if(vbtn)vbtn.onclick=()=>{s>1?zoomAt(1,0,0):zoomAt(2.5,0,0)}}
function closeViewer(){const v=$('#viewer');if(!v.hidden){v.hidden=true;v.innerHTML=''}}

/* ---------- music ---------- */
const audio=new Audio();
const M={items:[],i:0,repeat:0,shuffle:false,fav:{}};
try{M.fav=JSON.parse(localStorage.wvFav||'{}')}catch(e){}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const grad=s=>{const h=hue(s);return `linear-gradient(135deg,hsl(${h},70%,78%),hsl(${(h+50)%360},70%,66%))`};
function parse(it){let b=it.orig.replace(/\.[^.]+$/,'');const k=b.indexOf(' - ');return k>0?{artist:b.slice(0,k),title:b.slice(k+3)}:{artist:'내 음악',title:b}}
async function loadMusic(){
 try{M.items=await list('music').then(a=>a.sort((x,y)=>x.mtime-y.mtime))}catch(e){M.items=[];toast('서버(api.php)에 연결할 수 없어요')}
 if(M.i>=M.items.length)M.i=0;
 if(M.items.length&&!audio.src)setTrack(M.i,false);
 renderMusic()}
function setTrack(i,play){
 M.i=i;const it=M.items[i];if(!it)return;
 audio.src=it.url;if(play)audio.play().catch(()=>toast('재생할 수 없는 파일이에요'));renderMusic()}
function nextIdx(d){
 const n=M.items.length;if(M.shuffle&&n>1){let r;do r=Math.floor(Math.random()*n);while(r===M.i);return r}
 return (M.i+d+n)%n}
audio.onended=()=>{
 if(M.repeat===2){audio.currentTime=0;audio.play();return}
 if(M.repeat===0&&!M.shuffle&&M.i===M.items.length-1){audio.currentTime=0;syncPP();return}
 setTrack(nextIdx(1),true)};
audio.ontimeupdate=()=>{
 const s=$('#seek');if(!s||!audio.duration)return;
 if(!s.dragging){s.value=audio.currentTime/audio.duration*1000;s.style.setProperty('--p',s.value/10+'%')}
 $('#cur').textContent=fmtT(audio.currentTime)};
audio.onloadedmetadata=()=>{const d=$('#dur');if(d)d.textContent=fmtT(audio.duration);
 const t=document.querySelector(`[data-du="${M.i}"]`);if(t)t.textContent=fmtT(audio.duration)};
audio.onplay=audio.onpause=()=>syncPP();
function syncPP(){const b=$('#pp');if(b)b.innerHTML=audio.paused?I.play:I.pause;
 const sh=document.querySelector('.sheet');if(sh)sh.classList.toggle('paused',audio.paused)}
function renderMusic(){
 const n=M.items.length,it=M.items[M.i];
 const info=it?parse(it):null;
 $('#music').innerHTML=`
 <header class="bar"><button class="ib" id="mBack">${I.back}</button><h2 class="mid" style="font-size:20px">음악</h2><div class="acts"><button class="ib" id="mMore">${I.dots}</button></div></header>
 ${n?`<div class="np"><div class="cover" style="background:${grad(it.name)}">${I.note}</div>
  <div class="meta"><h3>${esc(info.title)}</h3><p>${esc(info.artist)}</p>
  <div class="mini"><button id="mFav" style="${M.fav[it.name]?'color:#ff4d6a':''}">${M.fav[it.name]?I.heartOn:I.heart}</button><button id="mQ">${I.queue}</button><button id="mAdd">${I.plus}</button></div></div></div>
  <div class="seekw"><input type="range" id="seek" min="0" max="1000" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
  <div class="ctl"><button id="mShuf" class="${M.shuffle?'on':''}">${I.shuffle}</button><button id="mPrev">${I.prev}</button><button id="pp" class="pp">${audio.paused?I.play:I.pause}</button><button id="mNext">${I.nextT}</button><button id="mRep" class="${M.repeat?'on':''} ${M.repeat===2?'one':''}">${I.repeat}</button></div>`
 :`<div class="empty" style="padding-top:12vh"><img src="icons/music.png" alt=""><h3>음악이 비어있습니다.</h3><p>음악 파일을 업로드하면<br>재생목록에 표시됩니다.</p><button class="pill" id="mUp">음악 업로드</button></div>`}
 <section class="sheet ${audio.paused?'paused':''}"><div class="grab"></div><div class="sh-h"><b>재생목록</b><span>${n}곡</span><button class="ib" id="mAdd2">${I.plus}</button></div>
 <div id="list">${M.items.map((t,i)=>{const p=parse(t);return `<div class="tr${i===M.i?' cur':''}"><div class="eq">${i===M.i?'<i></i><i></i><i></i>':''}</div><div class="th" style="background:${grad(t.name)}">${I.note}</div><div class="tx" data-i="${i}"><b>${esc(p.title)}</b><small>${esc(p.artist)}</small></div><span class="du" data-du="${i}"></span><button class="ib" data-m="${i}">${I.dots}</button></div>`}).join('')||'<p style="text-align:center;color:#9ca3af;padding:40px 0;font-size:14px">재생목록이 비어있습니다.</p>'}</div></section>`;
 const g=id=>document.getElementById(id);
 g('mBack').onclick=home;
 g('mMore').onclick=e=>menu(e.currentTarget,[['음악 업로드',()=>$('#fileMusic').click()]]);
 ['mAdd','mAdd2','mUp'].forEach(id=>g(id)&&(g(id).onclick=()=>$('#fileMusic').click()));
 if(n){
  g('mFav').onclick=()=>{M.fav[it.name]?delete M.fav[it.name]:M.fav[it.name]=1;try{localStorage.wvFav=JSON.stringify(M.fav)}catch(e){}renderMusic()};
  g('mQ').onclick=()=>document.querySelector('.sheet').scrollIntoView({behavior:'smooth'});
  g('pp').onclick=()=>audio.paused?audio.play().catch(()=>toast('재생할 수 없는 파일이에요')):audio.pause();
  g('mPrev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else setTrack(nextIdx(-1),!audio.paused)};
  g('mNext').onclick=()=>setTrack(nextIdx(1),!audio.paused);
  g('mShuf').onclick=()=>{M.shuffle=!M.shuffle;renderMusic()};
  g('mRep').onclick=()=>{M.repeat=(M.repeat+1)%3;renderMusic()};
  const s=g('seek');
  s.oninput=()=>{s.dragging=true;s.style.setProperty('--p',s.value/10+'%');if(audio.duration)g('cur').textContent=fmtT(audio.duration*s.value/1000)};
  s.onchange=()=>{if(audio.duration)audio.currentTime=audio.duration*s.value/1000;s.dragging=false};
  if(audio.duration){g('dur').textContent=fmtT(audio.duration);audio.ontimeupdate()}
 }
 document.querySelectorAll('#list .tx').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;if(i===M.i){audio.paused?audio.play():audio.pause()}else setTrack(i,true)});
 document.querySelectorAll('#list [data-m]').forEach(b=>b.onclick=e=>{
  const t=M.items[+b.dataset.m];
  menu(e.currentTarget,[['음악공유',()=>shareUrls([t],'음악')],['음악다운로드',()=>download(t)],['음악삭제',async()=>{
   const cur=M.items[M.i];
   if(!await doDelete('music',[t.name],'이 음악을 삭제합니다.'))return;
   if(cur&&cur.name===t.name){audio.pause();audio.removeAttribute('src');audio.load();M.i=0}
   loadMusic()}]])})}

 try{N.items=await list('memo')}catch(e){N.items=[];toast('서버(api.php)에 연결할 수 없어요')}

 <button class="fab" id="nNew" aria-label="새 메모">${I.plus}</button>`;
 $('#nBack').onclick=home;
 $('#nMore').onclick=e=>menu(e.currentTarget,[['txt 업로드',()=>$('#fileMemo').click()]]);
 $('#nNew').onclick=()=>openEditor(null);
 document.querySelectorAll('#memo .mc').forEach(c=>c.onclick=()=>openEditor(N.items[+c.dataset.i]))}
let EDIT=null,EDIT0='';
async function openEditor(m){
 let text='';
 if(m){try{const r=await fetch(m.url+'?_='+Date.now());const b=await r.arrayBuffer();
   try{text=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){text=new TextDecoder('euc-kr').decode(b)}
   text=text.replace(/^﻿/,'')}catch(e){text=m.text}}
 EDIT=m?m.name:null;EDIT0=text;
 const ed=$('#editor');ed.hidden=false;
 ed.innerHTML=`<header class="bar"><button class="ib" id="eBack">${I.back}</button><div class="acts">${m?`<button class="ib" id="eShare">${I.share}</button><button class="ib" id="eDel">${I.trash}</button>`:''}<button class="txtbtn" id="eSave" style="color:var(--blue);font-weight:600">저장</button></div></header>
 <div class="dt">${m?fmtD(m.mtime):fmtD(Date.now()/1000)}</div><textarea id="eText" placeholder="메모를 입력하세요"></textarea>`;
 const ta=$('#eText');ta.value=text;if(!m)ta.focus();
 $('#eBack').onclick=()=>closeEditor(false);
 $('#eSave').onclick=async()=>{await saveEditor();toast('저장했어요')};
 if(m){
  $('#eShare').onclick=()=>shareUrls([{url:m.url,name:m.name,orig:memoTitle(ta.value)+'.txt'}],'메모');
  $('#eDel').onclick=async()=>{if(await doDelete('memo',[EDIT],'이 메모를 삭제합니다.')){EDIT0=ta.value;closeEditor(true);loadMemo()}}}}
async function saveEditor(){
 const t=$('#eText').value;
 if(!t.trim()){if(EDIT)toast('내용이 비어 있어 저장하지 않았어요. 삭제는 휴지통 버튼을 이용하세요');EDIT0=t;return}
 const j=await post({a:'save',t:'memo',name:EDIT||'',text:t});
 if(j.ok){EDIT=j.name;EDIT0=t}else toast(j.error||'저장 실패')}
async function closeEditor(skip){
 const ed=$('#editor');if(ed.hidden)return;
 const ta=$('#eText');
 if(!skip&&ta&&ta.value!==EDIT0)await saveEditor();
 ed.hidden=true;ed.innerHTML='';if(!skip)loadMemo()}

/* ---------- 입장 암호 (숫자판) ---------- */
let pin='',busy=false;
function drawPin(){document.querySelectorAll('#boxes .pbox').forEach((b,i)=>{b.classList.toggle('f',i<pin.length);b.classList.toggle('cur',i===pin.length)})}
function showGate(){
 TOK='';try{localStorage.removeItem('wvTok');localStorage.removeItem('wvTokExp')}catch(e){}
 audio.pause();$('#gate').hidden=false;pin='';busy=false;drawPin()}
function wrongPw(){const b=$('#boxes');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');pin='';drawPin()}
async function tryLogin(){
 if(busy)return;
 if(pin.length<4){wrongPw();return toast('4자리 암호를 입력해주세요')}
 busy=true;const pw=pin;
 let j={};try{j=await post({a:'login',pw})}catch(e){busy=false;pin='';drawPin();return toast('서버(api.php)에 연결할 수 없어요')}
 busy=false;
 if(!j.ok){wrongPw();return toast(j.error||'암호가 틀렸어요')}
 TOK=j.token;try{localStorage.wvTok=TOK;localStorage.wvTokExp=Date.now()+24*3600*1000}catch(e){}
 pin='';drawPin();$('#gate').hidden=true;route()}
function pressKey(k){
 if($('#gate').hidden||busy)return;
 if(k==='b')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;
 drawPin();if(pin.length===4)setTimeout(tryLogin,150)}
document.querySelectorAll('#pad [data-k]').forEach(b=>b.onclick=()=>pressKey(b.dataset.k));
document.addEventListener('keydown',e=>{
 if($('#gate').hidden)return;
 if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('b');else if(e.key==='Enter')tryLogin()});
$('#gBtn').onclick=tryLogin;
/* 비밀번호 힌트 메일 (삭제 암호창과 같은 방식) */
function confirmHint(){
 const o=document.createElement('div');o.id='pwModal';o.style.zIndex=120;
 o.innerHTML=`<div class="pwb"><h3>비밀번호 힌트 보내기</h3><p>등록된 메일로 비밀번호 힌트를 보낼까요?</p><div class="pwa"><button id="hNo">취소</button><button id="pwOk">보내기</button></div></div>`;
 document.body.appendChild(o);
 o.querySelector('#hNo').onclick=()=>o.remove();
 o.onclick=e=>{if(e.target===o)o.remove()};
 o.querySelector('#pwOk').onclick=async()=>{o.remove();toast('힌트 메일을 보내는 중...',true);
  try{const j=await post({a:'hint'});toast(j.ok?'비밀번호 힌트를 메일로 보냈어요':(j.error||'메일 발송 실패'))}catch(e){toast('메일 발송 실패')}}}
$('#gForgot').onclick=confirmHint;
$('#logout').onclick=()=>{showGate();toast('로그아웃했어요')};
if(TOK){$('#gate').hidden=true;route()}else{drawPin()}
</script>
</body>
