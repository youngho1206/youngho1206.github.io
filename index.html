<script>
/* 선택을 기억해 두었다가(이번 접속 동안 / 다음 접속부터) 바로 해당 화면으로 보냅니다. ?select=1 로 접속하면 다시 선택할 수 있습니다. */
var T={m:'mobile.html',d:'dex.html',e:'emulator.html',t:'tablet.html',v:'videos.html',c:'classic.html',x:'multi/win10.html'};
function go(k,keep){
 try{if(k==='m'||k==='d')sessionStorage.setItem('ver',k);if(keep===true)localStorage.setItem('ver',k);else if(keep===false)localStorage.removeItem('ver')}catch(e){}
 var p=new URLSearchParams(location.search);p.delete('select');var s=p.toString();
 location.replace(T[k]+(s?'?'+s:''));
}
(function(){
 if(new URLSearchParams(location.search).has('select'))return;
 var v=null;try{v=sessionStorage.getItem('ver')||localStorage.getItem('ver')}catch(e){}
 if(T[v])go(v);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
 /* 데스크톱 화면에서 16:9 포스터 크기에 맞춰 모든 글자·간격이 같이 커지고 작아집니다 (1456px 기준 1단위) */
 --u:calc(min(100vw,177.7778vh) / 1456);
 --cy:#35e6ff;--bl:#3b6bff;--vi:#8b5cff;--mg:#e040fb;--pk:#ff4fa8;
 --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --han:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#050035}
html,body{margin:0;min-height:100%;color:#fff;font-family:var(--kr)}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:#050035;display:flex;justify-content:center;align-items:center}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ───────── 포스터(첫 화면) ───────── */
.poster{position:relative;width:100%;min-height:100vh;min-height:100dvh;overflow:hidden;isolation:isolate;
 padding:max(22px,env(safe-area-inset-top)) 14px max(26px,env(safe-area-inset-bottom));
 display:flex;flex-direction:column;align-items:center;gap:16px;
 background:
  radial-gradient(ellipse 70% 38% at 0% 0%,rgba(0,90,255,.38),transparent 70%),
  radial-gradient(ellipse 70% 38% at 100% 0%,rgba(210,0,255,.32),transparent 70%),
  linear-gradient(180deg,#07013c 0%,#050138 50%,#0b004e 100%)}
.deco,.floor,.sp{display:none}
.topline{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:4px}
.topline i{flex:1;max-width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--cy));box-shadow:0 0 8px var(--cy)}
.topline i+svg+i{background:linear-gradient(90deg,var(--pk),transparent);box-shadow:0 0 8px var(--pk)}
.topline svg{width:46px;height:auto;flex:none;fill:var(--pk);filter:drop-shadow(0 0 8px rgba(255,79,168,.9));shape-rendering:crispEdges}

h1.title{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .22em;font:400 min(12.4vw,86px)/1.08 var(--han);letter-spacing:.01em;text-align:center}
.title span{position:relative;display:inline-block;color:transparent;-webkit-text-fill-color:transparent}
.title span:before,.title span:after{content:attr(data-t);position:absolute;left:0;top:0;white-space:nowrap}
.title span:before{z-index:0;color:#1a0a66;-webkit-text-fill-color:#1a0a66;-webkit-text-stroke:.07em #2b1692;
 text-shadow:0 .02em 0 #2b1692,0 .04em 0 #2b1692,0 .06em 0 #241383,0 .08em 0 #241383,0 .1em 0 #1d0f75,0 .12em 0 #1d0f75}
.title span:after{z-index:1;background-image:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:.025em rgba(255,255,255,.6)}
.title .t1{--g:linear-gradient(180deg,#d7fbff 0%,#5de8ff 38%,#1c9dff 100%);filter:drop-shadow(0 0 .18em rgba(53,230,255,.55))}
.title .t1:before{-webkit-text-stroke-color:#0b3f9e;text-shadow:0 .02em 0 #0b3f9e,0 .04em 0 #0b3f9e,0 .06em 0 #0a3a93,0 .08em 0 #0a3a93,0 .1em 0 #082f7a,0 .12em 0 #082f7a}
.title .t2{--g:linear-gradient(180deg,#ffe3fb 0%,#ff7ee9 38%,#a63dff 100%);transform:skewX(-7deg);filter:drop-shadow(0 0 .18em rgba(224,64,251,.55))}

.infobar{max-width:min(100%,760px);padding:11px 18px;border:2px solid transparent;border-radius:16px;text-align:center;font:500 clamp(12.5px,3.5vw,17px)/1.5 var(--kr);word-break:keep-all;
 background:linear-gradient(rgba(8,10,70,.82),rgba(8,10,70,.82)) padding-box,linear-gradient(90deg,var(--cy),var(--vi) 55%,var(--pk)) border-box;
 box-shadow:0 0 14px rgba(53,230,255,.35),0 0 22px rgba(255,79,168,.22)}
.pick{margin:2px 0 0;font:500 clamp(16px,4.6vw,22px) var(--kr);letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,40,.7)}

.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;width:100%;max-width:640px}
.mi{flex:0 0 calc(33.333% - 7px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 6px 12px;border-radius:18px;
 background:rgba(30,25,120,.35);border:1px solid rgba(120,140,255,.28);transition:transform .18s,background .2s,box-shadow .2s}
.mi:hover,.mi:focus-visible{transform:translateY(-4px);background:rgba(60,50,190,.45);box-shadow:0 0 20px rgba(80,140,255,.5);outline:none}
.mi:active{transform:scale(.97)}
.mi .ic{height:68px;width:100%;display:flex;align-items:center;justify-content:center}
.mi img{display:block;max-height:100%;max-width:86%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(70,130,255,.55))}
.mi b{margin-top:8px;font:700 clamp(15px,4.2vw,20px) var(--kr);color:var(--c,#bfe3ff);text-shadow:0 0 10px rgba(80,150,255,.55)}
.mi small{margin-top:3px;font:400 clamp(11.5px,3.1vw,13.5px)/1.35 var(--kr);color:#fff;opacity:.92;word-break:keep-all}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px;margin-top:4px}
.tb{--c:var(--cy);appearance:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;padding:12px 8px 11px;color:#fff;border-radius:20px;
 border:3px solid var(--c);background:rgba(14,10,80,.72);box-shadow:0 0 12px var(--c),inset 0 0 14px rgba(80,110,255,.35);box-shadow:0 0 12px var(--c),inset 0 0 14px color-mix(in srgb,var(--c) 38%,transparent);
 transition:transform .18s,box-shadow .2s}
.tb:hover,.tb:focus-visible{transform:translateY(-3px);box-shadow:0 0 22px var(--c),inset 0 0 18px rgba(80,110,255,.5);box-shadow:0 0 22px var(--c),inset 0 0 18px color-mix(in srgb,var(--c) 55%,transparent);outline:none}
.tb:active{transform:scale(.97)}
.tb img{height:46px;width:auto;max-width:70px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(70,130,255,.5))}
.tb span{font:700 clamp(13.5px,3.7vw,16px) var(--kr);white-space:nowrap;letter-spacing:-.02em}
.tb .dot{position:absolute;top:-6px;right:-5px;width:15px;height:15px;border-radius:50%;background:#ff3b5c;border:2px solid #fff;display:none;box-shadow:0 0 8px #ff3b5c}
.tb.new .dot{display:block}
.tb.c2{--c:#7c7bff}.tb.c3{--c:#d946ef}.tb.c4{--c:#ff4fa8}

.foot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 16px;max-width:640px;margin-top:6px;font:400 12px var(--kr);color:#b9c3ff}
.foot b{color:#ffe08a;font-weight:700}
.foot .vis{display:inline-flex;gap:10px;align-items:center}
.foot .vis u{width:1px;height:11px;background:rgba(185,195,255,.45);text-decoration:none}
.keep{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;color:#e2e7ff}
.keep input{width:16px;height:16px;accent-color:#ff4fa8}
.foot .lk{display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:center}
.foot .lk a,.foot .lk button{appearance:none;background:none;border:0;border-bottom:1px dotted rgba(185,195,255,.6);padding:0 0 1px;color:#b9c3ff;font:inherit;cursor:pointer}
.foot .lk a:hover,.foot .lk button:hover{color:#fff;border-color:#fff}
.foot button:disabled{opacity:.6}

/* ───────── 데스크톱: 참고 이미지와 같은 16:9 포스터 ───────── */
@media (min-width:900px) and (min-aspect-ratio:13/10){
 body{overflow:hidden}
 .poster{width:calc(var(--u)*1456);height:calc(var(--u)*819);min-height:0;padding:0;display:block;
  background:
   radial-gradient(ellipse 22% 60% at 0% 55%,rgba(0,80,255,.38),transparent 75%),
   radial-gradient(ellipse 22% 60% at 100% 55%,rgba(200,0,255,.32),transparent 75%),
   radial-gradient(ellipse 40% 30% at 50% 0%,rgba(40,30,180,.35),transparent 80%),
   linear-gradient(180deg,#07013c 0%,#050138 45%,#0a004a 100%)}
 .deco{display:block;position:absolute;top:0;height:100%;width:auto;pointer-events:none;z-index:0}
 .deco.l{left:0}.deco.r{right:0}
 .floor{display:block;position:absolute;left:calc(var(--u)*300);right:calc(var(--u)*300);bottom:0;height:calc(var(--u)*215);overflow:hidden;z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
 .floor:before{content:"";position:absolute;left:-60%;right:-60%;top:0;bottom:-40%;
  background:linear-gradient(rgba(90,120,255,.75) 2px,transparent 2px) 0 0/calc(var(--u)*90) calc(var(--u)*46),linear-gradient(90deg,rgba(160,90,255,.75) 2px,transparent 2px) 0 0/calc(var(--u)*90) calc(var(--u)*46);
  transform:perspective(calc(var(--u)*330)) rotateX(58deg);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 55%);mask-image:linear-gradient(180deg,transparent,#000 55%)}
 .sp{display:block;position:absolute;width:calc(var(--u)*18);height:calc(var(--u)*18);z-index:0;pointer-events:none;background:var(--c);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px var(--c));animation:tw 3s ease-in-out infinite alternate}
 @keyframes tw{from{opacity:.45;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}

 .topline{position:absolute;left:calc(var(--u)*430);width:calc(var(--u)*596);top:calc(var(--u)*34);margin:0;gap:calc(var(--u)*24);z-index:2}
 .topline i{max-width:none;height:calc(var(--u)*4)}
 .topline svg{width:calc(var(--u)*87)}
 h1.title{position:absolute;left:0;right:0;top:calc(var(--u)*96);margin:0;font-size:calc(var(--u)*150);gap:0 calc(var(--u)*30);z-index:2;flex-wrap:nowrap;white-space:nowrap}
 .infobar{position:absolute;left:calc(var(--u)*230);top:calc(var(--u)*284);width:calc(var(--u)*996);max-width:none;height:calc(var(--u)*62);padding:0;display:flex;align-items:center;justify-content:center;
  border-width:calc(var(--u)*3);border-radius:calc(var(--u)*16);font-size:calc(var(--u)*25.5);white-space:nowrap;z-index:2}
 .pick{position:absolute;left:0;right:0;top:calc(var(--u)*364);margin:0;text-align:center;font-size:calc(var(--u)*33);z-index:2}
 .menu{position:absolute;left:calc(var(--u)*266);top:calc(var(--u)*428);width:calc(var(--u)*922);max-width:none;display:grid;grid-template-columns:repeat(5,1fr);gap:0;z-index:2}
 .mi{flex:none;padding:0 calc(var(--u)*6);height:calc(var(--u)*176);border:0;border-radius:calc(var(--u)*18);background:transparent;justify-content:flex-start;position:relative}
 .mi+.mi:before{content:"";position:absolute;left:0;top:calc(var(--u)*8);bottom:calc(var(--u)*10);width:1px;background:linear-gradient(180deg,transparent,rgba(190,205,255,.75) 15%,rgba(190,205,255,.75) 85%,transparent)}
 .mi:hover,.mi:focus-visible{background:rgba(80,100,255,.18);box-shadow:0 0 calc(var(--u)*26) rgba(90,140,255,.5)}
 .mi .ic{height:calc(var(--u)*92);margin-top:calc(var(--u)*4)}
 .mi img{max-width:calc(var(--u)*118)}
 .mi b{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*26)}
 .mi small{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*16.5)}
 .tools{position:absolute;left:0;right:0;top:calc(var(--u)*632);width:auto;max-width:none;margin:0 auto;display:flex;justify-content:center;gap:calc(var(--u)*16);z-index:2}
 .tb{min-width:calc(var(--u)*170);height:calc(var(--u)*108);padding:calc(var(--u)*8) calc(var(--u)*20);gap:calc(var(--u)*4);border-width:calc(var(--u)*3);border-radius:calc(var(--u)*24)}
 .tb img{height:calc(var(--u)*58);max-width:calc(var(--u)*80)}
 .tb span{font-size:calc(var(--u)*20)}
 .foot{position:absolute;left:calc(var(--u)*140);right:calc(var(--u)*140);top:calc(var(--u)*762);max-width:none;margin:0;gap:calc(var(--u)*6) calc(var(--u)*22);font-size:max(11px,calc(var(--u)*14));z-index:2}
}

/* ───────── 안내 시트(공지·설치·게임방법) ───────── */
#sh{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(3,0,28,.72);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#sh.on{opacity:1;visibility:visible;transition-delay:0s}
#sh .sheet{width:min(100%,600px);max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;color:#eef1ff;font-family:var(--kr);
 background:linear-gradient(180deg,#14096a,#0a0540);border:2px solid var(--cy);border-radius:24px;box-shadow:0 0 22px rgba(53,230,255,.45),0 24px 60px rgba(0,0,30,.7);
 transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
#sh.on .sheet{transform:none}
.sh-h{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px 24px;border-bottom:1px dashed rgba(120,160,255,.4)}
.sh-h b{font:900 21px var(--kr);color:var(--cy);letter-spacing:.01em}
.sh-h button{border:0;border-radius:99px;background:linear-gradient(135deg,#ff6fb9,#c026d3);color:#fff;font:700 13.5px var(--kr);cursor:pointer;padding:7px 16px;box-shadow:0 0 12px rgba(224,64,251,.5)}
.sh-s{flex:none;padding:8px 24px 0;color:#a9b6ff;font:500 12.5px var(--kr);letter-spacing:.05em}
.sh-b{overflow:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
.gc{background:rgba(255,255,255,.06);border-left:4px solid var(--cy);border-radius:12px;padding:13px 15px;margin-bottom:12px;font:400 14.5px/1.7 var(--kr);color:#eef1ff;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word}
.gc h3{margin:0 0 6px;font:700 16.5px/1.45 var(--kr);color:#ff9bd5;white-space:normal}
.gc.em{color:#a9b6ff;text-align:center;white-space:normal}
.gc ol{margin:0;padding:0;list-style:none;counter-reset:s;white-space:normal}
.gc li{counter-increment:s;display:flex;gap:13px;align-items:flex-start;padding:9px 0}
.gc li+li{border-top:1px dashed rgba(120,160,255,.3)}
.gc li:before{content:counter(s);flex:none;width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#35e6ff,#3b6bff);color:#04123a;font:900 14px/27px var(--kr);text-align:center;box-shadow:0 0 8px rgba(53,230,255,.6)}
.gc small{display:block;margin-top:10px;color:#a9b6ff;font:400 12.5px/1.55 var(--kr);white-space:normal}
.ne-edit{display:block;margin:0 0 12px auto;border:0;border-radius:99px;background:linear-gradient(135deg,#ff6fb9,#c026d3);color:#fff;font:700 13.5px var(--kr);padding:8px 16px;cursor:pointer}
.ne-ta,.ne-in{width:100%;border:2px solid rgba(120,160,255,.5);border-radius:12px;padding:10px;font:400 14px/1.6 var(--kr);color:#fff;background:rgba(5,3,50,.8)}
.ne-ta{resize:vertical}.ne-in{margin-top:8px}
.ne-h{margin:6px 2px;color:#a9b6ff;font:400 12.5px/1.55 var(--kr)}
.ne-c{display:block;margin:8px 2px;color:#eef1ff;font:400 13.5px var(--kr)}
.ne-m{min-height:18px;margin:4px 2px;color:#ff9bd5;font:700 13px var(--kr)}
.ne-r{display:flex;gap:8px;margin:6px 0}
.ne-b{flex:1;height:44px;border:0;border-radius:99px;background:#3a3a7a;color:#fff;font:700 15px var(--kr);cursor:pointer}
.ne-b.ok{background:linear-gradient(135deg,#35e6ff,#3b6bff);color:#04123a}
.ne-b:disabled{opacity:.6}
.sh-b>.ne-b{width:100%;margin-top:4px}

#guideOv{position:fixed;inset:0;z-index:110;display:flex;flex-direction:column;background:rgba(3,0,28,.8);padding:max(12px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#guideOv.on{opacity:1;visibility:visible;transition-delay:0s}
#guideOv .gv{flex:1;min-height:0;width:min(100%,900px);margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#0a0540;border:2px solid var(--cy);border-radius:20px;box-shadow:0 0 22px rgba(53,230,255,.45)}
#guideOv iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
.gv-f{flex:none;display:flex;justify-content:center;padding:10px}
.gv-close{border:0;border-radius:99px;background:linear-gradient(135deg,#ff6fb9,#c026d3);color:#fff;font:700 15px var(--kr);padding:10px 34px;cursor:pointer;box-shadow:0 0 12px rgba(224,64,251,.5)}

/* 앱 설치 안내 배너 */
#instBn{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:12px;width:min(calc(100% - 24px),460px);padding:10px 12px;border-radius:18px;
 background:rgba(10,6,70,.94);border:2px solid var(--cy);box-shadow:0 0 18px rgba(53,230,255,.4),0 10px 30px rgba(0,0,30,.6);color:#fff}
#instBn.on{display:flex}
#instBn img{border-radius:10px;flex:none}
#instBn .ib-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#instBn .ib-t b{font:700 14px var(--kr)}
#instBn .ib-t span{font:400 11.5px/1.4 var(--kr);color:#b9c3ff}
#instBn button{border:0;cursor:pointer;font:700 13px var(--kr);border-radius:99px;padding:8px 14px;color:#04123a;background:linear-gradient(135deg,#35e6ff,#3b6bff)}
#instBn #instNo{background:none;color:#b9c3ff;padding:6px}
</style>
</head>
<body>
<div id="instBn" role="dialog" aria-label="앱 설치 안내"><img src="icons/app-192.png" alt="" width="44" height="44"><div class="ib-t"><b>영호의 게임에뮬레이터</b><span id="instSub">주소창 없이 앱처럼 크게 즐겨요</span></div><button type="button" id="instGo">앱 설치</button><button type="button" id="instNo" aria-label="닫기">✕</button></div>

<div class="poster">
  <img class="deco l" src="menuicons/deco-left.png" alt="" aria-hidden="true">
  <img class="deco r" src="menuicons/deco-right.png" alt="" aria-hidden="true">
  <div class="floor" aria-hidden="true"></div>
  <i class="sp" style="--c:#35e6ff;left:calc(var(--u)*452);top:calc(var(--u)*118)" aria-hidden="true"></i>
  <i class="sp" style="--c:#b07bff;left:calc(var(--u)*1125);top:calc(var(--u)*32);animation-delay:-1s" aria-hidden="true"></i>

/* ---------- 공지사항 : INFO-WEB.TXT ---------- */
var notice=null,SEEN='noticeSeen';
function sig(t){return t.length+':'+t.slice(0,60)}
function seen(){try{return localStorage.getItem(SEEN)}catch(e){return null}}
function loadNotice(){
 return fetch('INFO-WEB.TXT?t='+Date.now(),{cache:'no-store'}).then(function(r){
  if(!r.ok)throw 0;
  var lm=r.headers.get('last-modified');
  return r.arrayBuffer().then(function(buf){
   var t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('euc-kr').decode(buf)}
   t=t.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').trim();
   return{text:t,date:lm?new Date(lm):null};
  });
 }).catch(function(){return{text:'',date:null}});
}
loadNotice().then(function(n){notice=n;if(n.text&&sig(n.text)!==seen())$('#bNotice').classList.add('new')});
$('#bNotice').onclick=function(){
 var go=function(n){
  var nodes=[];
  if(!n.text)nodes.push(mk('gc em','등록된 공지가 없습니다.'));
  else n.text.split(/\n[ \t]*-{3,}[ \t]*\n/).forEach(function(ch){
   ch=ch.trim();if(!ch)return;
   var c=mk('gc'),i=ch.indexOf('\n');
   if(i>0){c.appendChild(mk('',null,'h3')).textContent=ch.slice(0,i).trim();c.appendChild(document.createTextNode(ch.slice(i+1).trim()))}
   else c.textContent=ch;
   nodes.push(c);
  });
  var sub=n.date?'업데이트 '+n.date.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'';
  var eb=mk('ne-edit','✏️ 수정','button');eb.type='button';eb.onclick=neEdit;nodes.unshift(eb);
  open_('공지사항',sub,nodes);
  if(n.text){try{localStorage.setItem(SEEN,sig(n.text))}catch(e){}}
  $('#bNotice').classList.remove('new');
 };
 if(notice)go(notice);else loadNotice().then(function(n){notice=n;go(n)});
};

/* ---------- 공지사항 수정 : GitHub 토큰으로 INFO-WEB.TXT 저장 ---------- */
var NE={o:'youngho1206',r:'youngho1206.github.io',b:'main',p:'INFO-WEB.TXT'};
function neTok(){try{return localStorage.getItem('gh_token')||''}catch(e){return''}}
function neB64(s){var b=new TextEncoder().encode(s),o='';for(var i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
function neApi(t,m,path,body){return fetch('https://api.github.com/repos/'+NE.o+'/'+NE.r+path,{method:m,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
async function neSave(text,t){
 var rr=await neApi(t,'GET',''),rj=await rr.json();
 if(rr.status===401)throw new Error('토큰이 올바르지 않습니다');
 if(!rr.ok)throw new Error('저장소를 확인할 수 없습니다 ('+rr.status+')');
 if(rj.permissions&&rj.permissions.push===false)throw new Error('이 저장소에 쓰기 권한이 없는 토큰입니다');
 for(var n=0;n<3;n++){
  var fr=await neApi(t,'GET','/contents/'+NE.p+'?ref='+NE.b),sha;
  if(fr.ok)sha=(await fr.json()).sha;else if(fr.status!==404)throw new Error('공지 파일을 읽지 못했습니다 ('+fr.status+')');
  var pr=await neApi(t,'PUT','/contents/'+NE.p,{message:'공지사항 수정',content:neB64(text),sha:sha,branch:NE.b});
  if(pr.ok)return;
  if(pr.status===409||pr.status===422){await new Promise(function(r){setTimeout(r,600)});continue}
  if(pr.status===403||pr.status===404)throw new Error('쓰기 권한이 없습니다. 토큰에 Contents 쓰기 권한이 있는지 확인하세요');
  throw new Error('저장에 실패했습니다 ('+pr.status+')');
 }
 throw new Error('동시에 수정되어 실패했습니다. 다시 시도해 주세요');
}
function neEdit(){
 var ta=mk('ne-ta',null,'textarea');ta.value=(notice&&notice.text)||'';ta.rows=14;ta.spellcheck=false;
 var hint=mk('ne-h','공지가 여러 개면 사이에 --- 한 줄을 넣어 나눕니다. 각 공지의 첫 줄이 제목으로 보입니다.');
 var tk=mk('ne-in',null,'input');tk.type='password';tk.placeholder='GitHub 토큰 (ghp_… / github_pat_…)';tk.value=neTok();tk.autocomplete='off';
 var lb=mk('ne-c',null,'label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=!!neTok();lb.appendChild(cb);lb.appendChild(document.createTextNode(' 이 기기에 토큰 기억하기'));
 var msg=mk('ne-m'),row=mk('ne-r'),sv=mk('ne-b ok','저장','button'),cn=mk('ne-b','취소','button');
 sv.type=cn.type='button';row.appendChild(sv);row.appendChild(cn);
 var help=mk('ne-h','※ 구글 계정으로는 GitHub에 직접 저장할 수 없어 GitHub 토큰으로 저장합니다. 만들기: GitHub → Settings → Developer settings → Personal access tokens → 이 저장소(youngho1206.github.io)의 Contents "Read and write" 권한.');
 open_('공지사항 수정','',[ta,hint,tk,lb,msg,row,help]);
 cn.onclick=function(){$('#bNotice').onclick()};
 sv.onclick=async function(){
  var t=tk.value.trim(),txt=ta.value.replace(/\r\n?/g,'\n').trim();
  if(!txt){msg.textContent='공지 내용을 입력해 주세요';return}
  if(!t){msg.textContent='GitHub 토큰을 입력해 주세요';return}
  sv.disabled=true;sv.textContent='저장 중…';msg.textContent='';
  try{
   await neSave(txt+'\n',t);
   try{if(cb.checked)localStorage.setItem('gh_token',t);else localStorage.removeItem('gh_token')}catch(e){}
   notice={text:txt,date:new Date()};try{localStorage.setItem(SEEN,sig(txt))}catch(e){}
   $('#bNotice').onclick();
   $('#shS').textContent='저장되었습니다 · 사이트 반영까지 1~2분 걸릴 수 있어요';$('#shS').style.display='';
  }catch(e){msg.textContent=e.message;sv.disabled=false;sv.textContent='저장'}
 };
}

<script>
/* 캐쉬지우기: 이 사이트의 임시 저장 파일(캐쉬)을 모두 지우고 최신 버전으로 다시 불러옵니다. (업데이트 반영용)
   내 설정·메모·사진 토큰 같은 저장 데이터(localStorage)는 지우지 않습니다. */
(function(){
 var btn=document.getElementById('bCache');if(!btn)return;
 var lab=document.getElementById('bCacheT'),busy=false;
 var FILES=['./','index.html','index-select.html','romsite.html','music.html','mobile.html','dex.html','emulator.html','pcthemes/themes.json','classic.html','index-1.html','winemu.html','dosplayer.html','dos.html','emuhost.html',
  'gallery.html','tablet.html','videos.html','videos/videos.json','map.html','memo.html','calc.html','life.html','search.html',
  'retro.js','retro.css','perf.css','cutegame.css','mamegame.js','arcade.js','arcade.css','dock.js','emudata.js','theme.js','themeadd.js','pctheme.js','pcplus.js',
  'manifest.webmanifest','sw.js','INFO-WEB.TXT','MAME/games.json','pctheme/data.json','pctheme/retro.js','pctheme/retro.css',
  'webthema/themes.json','webthema/names.json','webthema/base-style.css','webthema/thema01.html','webthema/thema02.html','webthema/thema05.html','xmas.css','xmas.js'];
 function urls(){
  var u={};
  FILES.forEach(function(f){u[f]=1});
  document.querySelectorAll('link[href],script[src]').forEach(function(e){
   var v=e.getAttribute('href')||e.getAttribute('src');
   if(v&&!/^(https?:)?\/\//.test(v)&&v.indexOf('data:')!==0)u[v]=1;   // ?v=1 이 붙은 주소까지 포함
  });
  return Object.keys(u);
 }
 function say(t){lab.textContent=t}
 btn.addEventListener('click',function(){
  if(busy)return;
  if(!confirm('이 사이트의 저장된 캐쉬(임시 파일)를 모두 지우고\n최신 버전으로 새로 불러옵니다.\n\n설정·메모 등 내 데이터는 지워지지 않습니다.\n계속할까요?'))return;
  busy=true;btn.disabled=true;say('지우는 중…');
  var jobs=[];
  /* 1) 앱(서비스워커) 캐쉬 삭제 */
  if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  /* 2) 서비스워커 등록 해제 (새로 접속하면 최신 버전으로 다시 등록됩니다) */
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  /* 3) 브라우저에 남아 있는 파일 캐쉬 갱신 (cache:'reload' = 서버에서 새로 받아 덮어쓰기) */
  jobs.push(Promise.all(urls().map(function(u){return fetch(u,{cache:'reload',credentials:'same-origin'}).catch(function(){})})));
  Promise.all(jobs.map(function(p){return p.catch(function(){})})).then(function(){
   say('완료! 새로 불러옵니다');
   setTimeout(function(){location.reload()},700);
  });
 });
})();
</script>
<script>
/* 데이터삭제: 이 사이트에 쌓인 기록(설정·메모·저장파일·게임 세이브·토큰 등)을 모두 지우고, 처음 접속한 상태로 되돌립니다. (캐쉬지우기와 별개) */
(function(){
 if(window.__wipeBound)return;window.__wipeBound=true;
 var busy=false;
 var KNOWN_DB=['dosweb','EmulatorJS-roms','EmulatorJS-bios','EmulatorJS-core','EmulatorJS-states','/data/saves','/home/web_user/retroarch/userdata'];
 function delDB(n){return new Promise(function(res){try{var q=indexedDB.deleteDatabase(n);q.onsuccess=q.onerror=q.onblocked=function(){res()};setTimeout(res,1500)}catch(e){res()}})}
 function wipeDBs(){
  if(!window.indexedDB)return Promise.resolve();
  var names={};KNOWN_DB.forEach(function(n){names[n]=1});
  var p=(indexedDB.databases?indexedDB.databases().catch(function(){return[]}):Promise.resolve([]));
  return p.then(function(list){
   (list||[]).forEach(function(d){if(d&&d.name)names[d.name]=1});
   return Promise.all(Object.keys(names).map(delDB));
  });
 }
 function wipeCookies(){
  try{
   var dir=location.pathname.replace(/[^\/]*$/,'');
   document.cookie.split(';').forEach(function(c){
    var n=c.split('=')[0].replace(/^\s+|\s+$/g,'');if(!n)return;
    ['/',dir].forEach(function(p){document.cookie=n+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path='+p});
   });
  }catch(e){}
 }
 function run(b){
  if(busy)return;
  if(!confirm('이 사이트에 쌓인 기록을 모두 삭제합니다.\n\n지워지는 항목:\n- 설정·테마·화면 선택 기록\n- 메모·일기 등 저장된 내 데이터\n- 게임스크린샷 연결(토큰) 정보\n- 게임 저장·불러오기 데이터\n- 캐쉬(임시 파일)\n\n삭제 후 처음 접속한 것처럼 첫 화면으로 돌아가며,\n지운 데이터는 되돌릴 수 없습니다.\n\n정말 삭제할까요?'))return;
  busy=true;b.disabled=true;
  var lab=b.querySelector('span')||b;lab.textContent='삭제 중…';
  try{localStorage.clear()}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  wipeCookies();
  var jobs=[wipeDBs()];
  if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  Promise.all(jobs.map(function(p){return p.catch(function(){})})).then(function(){
   try{localStorage.clear();sessionStorage.clear()}catch(e){}
   lab.textContent='완료! 처음 화면으로 이동';
   setTimeout(function(){location.replace(new URL('index.html',location.href).href)},800);
  });
 }
 document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target:null;if(!t)return;
  var c=t.closest('.js-wipe');if(c)run(c);
 });
})();

/* 방문자 수: 무료 카운터 서비스 사용(1순위 abacus, 안 되면 counterapi). 같은 기기는 하루 1회만 집계합니다. */
(function(){
 var NS='youngho1206-emulator';
 var d=new Date(),day=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
 var counted=false;try{counted=localStorage.getItem('visitDay3')===day}catch(e){}
 var P=[
  function(k,up){return 'https://abacus.jasoncameron.dev/'+(up?'hit':'get')+'/'+NS+'/'+k},
  function(k,up){return 'https://api.counterapi.dev/v1/'+NS+'/'+k+(up?'/up':'')}
 ];
 function num(j){var n=j&&(j.value!=null?j.value:(j.count!=null?j.count:null));return n==null?NaN:Number(n)}
 function req(i,k,up){return fetch(P[i](k,up),{cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(j){var n=num(j);if(isNaN(n))throw 'fmt';return n})}
 function hit(k){
  var seq=Promise.reject();
  [0,1].forEach(function(i){
   seq=seq.catch(function(){return counted?req(i,k,false).catch(function(){return req(i,k,true)}):req(i,k,true)});
  });
  return seq;
 }
 function show(id,p){p.then(function(n){document.getElementById(id).textContent=n.toLocaleString('ko-KR')}).catch(function(){document.getElementById(id).textContent='-'})}
 var pt=hit('d'+day),pa=hit('total');
 show('vToday',pt);show('vTotal',pa);
 Promise.all([pt,pa]).then(function(){try{localStorage.setItem('visitDay3',day)}catch(e){}}).catch(function(){});
})();
</script>

var items=[['bt','BT','블루투스','pair'],['usb','USB','USB','wired'],['otg','OTG','OTG','wired'],['kb','⌨','키보드'],['ms','🖱','마우스'],['pad','🎮','게임패드']];
var bar=document.createElement('div');
bar.id='ds-bar';
bar.innerHTML='<span class="it bw" title="배터리"><span class="bat"><b></b></span><span class="bp">--</span></span>'
 +items.map(function(a){return '<span class="it off" data-k="'+a[0]+'"'+(a[3]?' data-act="'+a[3]+'"':'')+'><i></i><span>'+a[1]+'</span></span>'}).join('');
document.body.appendChild(bar);
var svb=document.createElement('button');svb.type='button';svb.id='ds-sv';
svb.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8.500 5-14 14-14 0 9-5.500 14-14 14z"/><path d="M5 19l7-7"/></svg><span>절전</span><span class="st">꺼짐</span>';
document.body.appendChild(svb);

function toast(m){tt.textContent=m;tt.style.display='block';clearTimeout(tt._t);tt._t=setTimeout(function(){tt.style.display='none'},2600)}

function render(){
  items.forEach(function(a){
    var el=bar.querySelector('[data-k="'+a[0]+'"]'),on=!!S[a[0]];
    el.classList.toggle('on',on);el.classList.toggle('off',!on);
    el.title=a[2]+(on?' · 연결됨':' · 미연결')+(a[3]?' (탭하여 연결)':'');
  });
  sv.classList.toggle('on',saver);sv.setAttribute('aria-pressed',saver?'true':'false');sv.querySelector('.st').textContent=saver?'켜짐':'꺼짐';
  sv.title='절전 모드 '+(saver?'켜짐':'꺼짐')+' (탭하여 전환)';
}

/* ---------- 배터리 ---------- */
function paintBatt(){
  var f=bar.querySelector('.bat b'),p=bar.querySelector('.bp'),w=bar.querySelector('.bw');
  if(!batt){p.textContent='--';f.style.width='0';w.title='이 브라우저는 배터리 정보를 제공하지 않습니다';return}
  var l=Math.round(batt.level*100);
  f.style.width=l+'%';f.style.background=l<=20?'#ef4444':l<=50?'#f5b301':'#2bdc5b';
  p.textContent=(batt.charging?'⚡':'')+l+'%';
  w.title='배터리 '+l+'%'+(batt.charging?' · 충전 중':'');
}
function onBatt(){
  paintBatt();
  if(ls(KEY)||!batt)return; /* 사용자가 직접 정했으면 자동 전환 안 함 */
  var low=batt.level<=0.2&&!batt.charging;
  if(low&&!saver){autoSaver=true;setSaver(true);toast('배터리 20% 이하 · 절전 모드 켜짐')}
  else if(!low&&autoSaver&&saver){autoSaver=false;setSaver(false)}
}
if(navigator.getBattery){
  navigator.getBattery().then(function(b){
    batt=b;['levelchange','chargingchange'].forEach(function(e){b.addEventListener(e,onBatt)});onBatt();
  }).catch(function(){});

/* ---------- 게임패드 ---------- */
function scanPads(){
  var c=0;
  try{var g=origGP?origGP():[];for(var i=0;i<g.length;i++)if(g[i]&&g[i].connected)c++}catch(e){}
  var v=c>0?1:0;if(S.pad!==v){S.pad=v;render()}
}
addEventListener('gamepadconnected',scanPads);
addEventListener('gamepaddisconnected',function(){setTimeout(scanPads,50)});

/* 절전 모드: 게임패드가 없으면 getGamepads()를 호출해도 장치 조회를 하지 않음 */
function patchGP(w){
  try{
    var n=w.navigator;if(!n||!n.getGamepads||n.__dsP)return;
    var o=(w===window&&origGP)?origGP:n.getGamepads.bind(n);
    n.__dsP=1;
    Object.defineProperty(n,'getGamepads',{configurable:true,writable:true,value:function(){
      return (saver&&!S.pad)?[null,null,null,null]:o();
    }});
  }catch(e){}
}
function patchAll(){
  patchGP(window);
  var f=document.querySelectorAll('iframe');
  for(var i=0;i<f.length;i++){try{patchGP(f[i].contentWindow)}catch(e){}}
}
document.addEventListener('load',function(e){
  var t=e.target;if(t&&t.tagName==='IFRAME'){try{patchGP(t.contentWindow)}catch(x){}}
},true);

/* 절전 모드: 화면에 상호작용 없는 장식 캔버스(눈, 배경효과 등) 숨김 */
function hideDeco(on){
  var c=document.querySelectorAll('canvas');
  for(var i=0;i<c.length;i++){
    var el=c[i];
    if(on){
      if(el.dataset.dsH)continue;
      var cs=getComputedStyle(el);
      if(cs.position==='fixed'&&cs.pointerEvents==='none'){el.dataset.dsH=el.style.display||'-';el.style.display='none'}
    }else if(el.dataset.dsH){
      el.style.display=el.dataset.dsH==='-'?'':el.dataset.dsH;delete el.dataset.dsH;
    }
  }
}
function padPoll(){
  if(!saver&&!padIv&&origGP){padIv=setInterval(scanPads,2500)}
  else if(saver&&padIv){clearInterval(padIv);padIv=0}
}
function setSaver(v){
  saver=!!v;
  document.documentElement.classList.toggle('ds-saver',saver);
  patchAll();hideDeco(saver);padPoll();render();
}

/* ---------- 마우스 / 키보드 ---------- */
var mq=window.matchMedia?matchMedia('(any-pointer:fine) and (any-hover:hover)'):null;
function msUpd(){S.ms=(mq&&mq.matches)||S.msSeen?1:0;render()}
if(mq){if(mq.addEventListener)mq.addEventListener('change',msUpd);else if(mq.addListener)mq.addListener(msUpd)}
function msSeen(e){
  if(e.pointerType==='mouse'&&e.isTrusted){S.msSeen=1;removeEventListener('pointermove',msSeen,true);msUpd()}
}
addEventListener('pointermove',msSeen,true);

var kbT=0,kbLast=0;
addEventListener('keydown',function(e){
  if(!e.isTrusted||!e.code||e.key==='Unidentified')return; /* 화면 키보드 제외 */

  var t=Date.now();
  if(t-kbLast>1500){kbLast=t;clearTimeout(kbT);kbT=setTimeout(function(){S.kb=0;render()},300000)}
},true);

/* ---------- USB / OTG / HID ---------- */
function refreshWired(){
  var n=0,p=[];
  try{if(navigator.usb)p.push(navigator.usb.getDevices().then(function(l){n+=l.length},function(){}))}catch(e){}
  try{if(navigator.hid)p.push(navigator.hid.getDevices().then(function(l){n+=l.length},function(){}))}catch(e){}
  Promise.all(p).then(function(){S.usb=(!isAndroid&&n>0)?1:0;S.otg=(isAndroid&&n>0)?1:0;render()});
}
['usb','hid'].forEach(function(k){
  try{if(navigator[k]){navigator[k].addEventListener('connect',refreshWired);navigator[k].addEventListener('disconnect',refreshWired)}}catch(e){}
});
async function wiredPair(){
  try{
    if(navigator.usb)await navigator.usb.requestDevice({filters:[]});
    else if(navigator.hid)await navigator.hid.requestDevice({filters:[]});
    else{toast('이 브라우저는 USB/OTG 연결을 지원하지 않습니다');return}
  }catch(e){if(!e||e.name!=='NotFoundError')toast('USB/OTG 연결 실패')}
  refreshWired();
}

/* ---------- 블루투스 ---------- */
var btDevs=[];
function btRefresh(){
  var c=0;btDevs.forEach(function(d){if(d.gatt&&d.gatt.connected)c++});
  S.bt=c>0?1:0;render();
}
function btAdd(d){if(btDevs.indexOf(d)<0){btDevs.push(d);d.addEventListener('gattserverdisconnected',btRefresh)}}
if(navigator.bluetooth&&navigator.bluetooth.getDevices){
  navigator.bluetooth.getDevices().then(function(l){l.forEach(btAdd);btRefresh()}).catch(function(){});
}
async function btPair(){
  if(!navigator.bluetooth){toast('이 브라우저는 블루투스 연결을 지원하지 않습니다');return}
  try{
    var d=await navigator.bluetooth.requestDevice({acceptAllDevices:true});
    btAdd(d);if(d.gatt)await d.gatt.connect();
    btRefresh();toast((d.name||'블루투스 장치')+' 연결됨');
  }catch(e){if(!e||e.name!=='NotFoundError')toast('블루투스 연결 실패')}
}
