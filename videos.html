<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<title>게임동영상 · 영호의 게임에뮬레이터</title>
<style>
:root{
 --bg:#f6f6f6;--sf:#fff;--sf2:#ececee;--tx:#111;--sb:#6e6e73;--ln:rgba(0,0,0,.08);
 --ac:#3e91ff;--ac2:#e3eeff;--dg:#ff3b30;--sh:0 6px 24px rgba(0,0,0,.12);
 --ft:"SamsungOne","Samsung Sharp Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#000;--sf:#1c1c1e;--sf2:#2c2c2e;--tx:#f2f2f2;--sb:#9b9ba1;--ln:rgba(255,255,255,.1);
 --ac:#5aa2ff;--ac2:#14284a;--dg:#ff6259;--sh:0 6px 24px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ft)}
body{min-height:100dvh;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(14px,3vw,28px) calc(140px + env(safe-area-inset-bottom,0px))}

/* ───── 상단 바 (스크롤하면 작은 제목이 나타남) ───── */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;min-height:calc(56px + env(safe-area-inset-top,0px));
 padding:env(safe-area-inset-top,0px) clamp(8px,2vw,20px) 0;background:color-mix(in srgb,var(--bg) 86%,transparent);
 -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:box-shadow .2s}
.bar.sc{box-shadow:0 1px 0 var(--ln)}
.bar .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;text-decoration:none;color:var(--tx)}
.bar .ic:active{background:var(--sf2)}
.bar .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .mt{flex:1;min-width:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:.2s}
.bar.sc .mt,.sel .bar .mt{opacity:1;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:99px;background:var(--sf);font-size:15px;font-weight:600;box-shadow:0 0 0 1px var(--ln) inset}
.pill:active{background:var(--sf2)}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill.ac{background:var(--ac);color:#fff;box-shadow:none}
.pill.ac:active{filter:brightness(.92)}
.r-n,.r-s{display:flex;gap:8px;align-items:center}
.r-s{display:none}
.sel .r-n{display:none}.sel .r-s{display:flex}
.b-n{display:grid}.sel .b-n{display:none}
.b-s{display:none}.sel .b-s{display:grid}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--sb);display:grid;place-items:center;flex:none;transition:.15s}
.chk svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.on>.chk,.chk.on{background:var(--ac);border-color:var(--ac)}
.on>.chk svg,.chk.on svg{opacity:1}

/* ───── 큰 제목 ───── */
.hero{padding:clamp(38px,9vw,84px) 6px 18px}
.hero h1{margin:0;font-size:clamp(34px,6.4vw,52px);line-height:1.15;font-weight:800;letter-spacing:-.02em}
.hero p{margin:8px 0 0;color:var(--sb);font-size:15px;min-height:1.4em}

/* ───── 목록 ───── */
.dh{margin:22px 4px 10px;font-size:14px;font-weight:700;color:var(--sb)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px 12px}
@media (max-width:560px){.gr{grid-template-columns:1fr 1fr;gap:16px 10px}}
.it{position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.th{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:var(--sf2);transition:transform .18s cubic-bezier(.3,.9,.4,1),box-shadow .18s}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th .pl{position:absolute;left:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.th .pl:after{content:"";margin-left:2px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.th .chk{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.28);border-color:#fff;opacity:0;transform:scale(.6)}
.sel .th .chk{opacity:1;transform:none}
.it.on .th{transform:scale(.92);box-shadow:0 0 0 3px var(--ac)}
.it.on .th .chk{background:var(--ac);border-color:var(--ac)}
.it.on .th .chk svg{opacity:1}
.tt{margin:9px 4px 0;font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.sbt{margin:3px 4px 0;font-size:12.5px;color:var(--sb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{display:none;text-align:center;padding:64px 20px;color:var(--sb)}
.empty .eb{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--sf);display:grid;place-items:center;box-shadow:0 0 0 1px var(--ln) inset}
.empty .eb svg{width:44px;height:44px;fill:none;stroke:var(--sb);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}

/* ───── 하단 작업 바 ───── */
.abar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;width:min(560px,calc(100% - 24px));
 display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px;border-radius:30px;background:var(--sf);box-shadow:var(--sh),0 0 0 1px var(--ln) inset;
 transform:translate(-50%,160%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sel .abar{transform:translate(-50%,0)}
.abar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:20px;font-size:12.5px;font-weight:600;word-break:keep-all}
.abar button:active:not(:disabled){background:var(--sf2)}
.abar button:disabled{opacity:.35;cursor:default}
.abar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.abar .del{color:var(--dg)}

/* ───── 팝업 / 시트 ───── */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);animation:fi .18s}
.ov.on{display:flex}
@keyframes fi{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.dlg{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--sf);border-radius:30px 30px 0 0;padding:26px 22px calc(20px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.9,.3,1)}
@media (min-width:640px){.ov{align-items:center}.dlg{border-radius:30px;padding-bottom:22px}}
.dlg h2{margin:0 0 6px;font-size:21px;font-weight:800;text-align:center}
.dlg .ds{margin:0 0 18px;text-align:center;color:var(--sb);font-size:14px;line-height:1.5;word-break:keep-all}
.dlg label{display:block;margin:14px 4px 6px;font-size:13px;font-weight:700;color:var(--sb)}
.dlg input[type=text],.dlg input[type=url],.dlg input[type=password]{width:100%;height:50px;border-radius:16px;border:0;background:var(--sf2);color:var(--tx);padding:0 16px;font:inherit;font-size:16px;outline:2px solid transparent}
.dlg input:focus{outline-color:var(--ac)}
.dlg input.pwd{text-align:center;font-size:24px;letter-spacing:.5em;padding-left:.5em}
.dlg .er{min-height:20px;margin:8px 4px 0;color:var(--dg);font-size:13.5px;text-align:center}
.dlg .br{display:flex;gap:10px;margin-top:16px}
.dlg .br button{flex:1;height:50px;border-radius:99px;background:var(--sf2);font-size:16px;font-weight:700}
.dlg .br button.ok{background:var(--ac);color:#fff}
.dlg .br button.no{background:var(--dg);color:#fff}
.dlg .br button:disabled{opacity:.55}
.pv{margin-top:10px;display:flex;align-items:center;gap:12px}
.pv .pi{width:132px;aspect-ratio:16/9;border-radius:14px;background:var(--sf2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--sb);font-size:12px}
.pv .pi img{width:100%;height:100%;object-fit:cover}
.pv button{height:40px;padding:0 16px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:700;font-size:14px}
.hint{margin:6px 4px 0;font-size:12.5px;color:var(--sb);line-height:1.45}

/* ───── 플레이어 ───── */
.ov.pl{align-items:center;background:rgba(0,0,0,.82)}
.pc{width:min(960px,100%);padding:0 12px;animation:up .24s}
.pf{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;box-shadow:var(--sh)}
.pf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pn{margin:14px 6px 0;color:#fff;font-size:17px;font-weight:700;line-height:1.4;word-break:keep-all}
.pn small{display:block;margin-top:2px;font-size:13px;font-weight:500;color:#c8c8cc}
.pr{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pr button{height:42px;padding:0 18px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14.5px}
.pr button.ac{background:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:calc(100% - 40px);
 padding:12px 20px;border-radius:99px;background:rgba(40,40,44,.94);color:#fff;font-size:14px;display:none;text-align:center}
</style>
</head>
<body>
<div id="app">
 <header class="bar" id="bar">
  <a class="ic b-n" href="index.html?select=1" aria-label="처음 화면으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
  <button class="ic b-s" type="button" id="bX" aria-label="선택 끝내기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="mt" id="mt">게임동영상</div>
  <div class="r-n">
   <button type="button" class="pill ac" id="bUp"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>업로드</button>
   <button type="button" class="pill" id="bSel">선택</button>
  </div>
  <div class="r-s">
   <button type="button" class="pill" id="bAll"><span class="chk" id="allChk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>전체선택</button>
  </div>
 </header>

 <div class="wrap">
  <section class="hero"><h1 id="h1">게임동영상</h1><p id="cnt"></p></section>
  <div class="empty" id="empty">
   <div class="eb"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg></div>
   <b>아직 올린 영상이 없어요</b>오른쪽 위의 ‘업로드’로 유튜브 영상을 추가해 보세요.
  </div>
  <main id="list"></main>
 </div>

 <nav class="abar" id="abar" aria-label="선택한 영상 작업">
  <button type="button" id="aYT"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg>유튜브로 보기</button>
  <button type="button" id="aCh"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.2c1.4-2.2 3.4-3.2 5.8-3.2s4.4 1 5.8 3.2"/></svg>채널보기</button>
  <button type="button" id="aSh"><svg viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>공유하기</button>
  <button type="button" id="aDel" class="del"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7M10 11v5M14 11v5"/></svg>삭제</button>
 </nav>
</div>

<div class="ov pl" id="pl" aria-hidden="true"><div class="pc"><div class="pf" id="pf"></div><div class="pn" id="pn"></div>
 <div class="pr"><button type="button" class="ac" id="pYT">유튜브로 보기</button><button type="button" id="pCh">채널보기</button><button type="button" id="pX">닫기</button></div></div></div>
<div class="ov" id="md" aria-hidden="true"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var OWNER='youngho1206',REPO='youngho1206.github.io',BR='main',DIR='videos',LIST='videos.json';
var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+DIR+'/';
var RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BR+'/'+DIR+'/';
/* 비밀번호는 코드에 그대로 적지 않고, 변환(해시)한 값만 넣어 두었습니다. */
var SALT='yh-gamevideo-v1',PWH='66d64c06f6dfe52d3ef218987d2c3f2cd3335176d526cb3c2760d694400aea91',ITER=120000;

var $=function(s){return document.querySelector(s)};
function mk(c,t,tag){var e=document.createElement(tag||'div');if(c)e.className=c;if(t!=null)e.textContent=t;return e}
var delay=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var list=[],sel={},selMode=false,unlocked=false,cur=null,fails=0,lockUntil=0;
var wk=['일','월','화','수','목','금','토'];

var tt;function toast(m,ms){var e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(function(){e.style.display='none'},ms||2600)}
function p2(n){return String(n).padStart(2,'0')}
function stamp(){var d=new Date();return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+'_'+Math.random().toString(36).slice(2,6)}
function fmtDay(ts){var d=new Date(ts);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wk[d.getDay()]+')'}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function dec(b){var bin=atob(b.replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function encText(s){var u=new TextEncoder().encode(s),bin='';for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return btoa(bin)}
function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var x=String(r.result);res(x.slice(x.indexOf(';base64,')+8))};r.onerror=rej;r.readAsDataURL(blob)})}
function enc(s){return new TextEncoder().encode(s)}

/* ───── 유튜브 주소 ───── */
function ytId(u){
 u=(u||'').trim();if(!u)return'';
 if(/^[\w-]{11}$/.test(u))return u;
 var m=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/i);
 return m?m[1]:'';
}
function watchUrl(it){return 'https://www.youtube.com/watch?v='+it.vid}
function shortUrl(it){return 'https://youtu.be/'+it.vid}
function chanUrl(it){return it.channel||('https://www.youtube.com/results?search_query='+encodeURIComponent(it.author||it.title||''))}
function openNew(u){var w=window.open(u,'_blank','noopener');if(!w)location.href=u}

/* ───── GitHub 저장 ───── */
function tok(){try{return localStorage.getItem('gh_token')||''}catch(e){return''}}
async function gh(method,path,body,key,n){
 n=n||0;
 var h={'Accept':'application/vnd.github+json'};if(key)h.Authorization='Bearer '+key;if(body)h['Content-Type']='application/json';
 var url=API+encodeURIComponent(path)+(method==='GET'?'?ref='+BR+'&t='+Date.now():'');
 var r=await fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
 if(r.status===404&&method==='GET')return null;
 if(r.status===409&&method!=='GET'&&n<5){await delay(700*(n+1));return gh(method,path,body,key,n+1)}
 if(!r.ok){var e=new Error(String(r.status));e.status=r.status;throw e}
 return r.json();
}
async function checkKey(k){
 var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO,{headers:{Authorization:'Bearer '+k,Accept:'application/vnd.github+json'}});
 var j=await r.json();
 if(!r.ok||j.message)throw new Error('bad');
 if(j.permissions&&j.permissions.push===false)throw new Error('bad');
}
async function commitList(mutate,key,msg){
 for(var n=0;n<6;n++){
  var f=await gh('GET',LIST,null,key),arr=[];
  if(f){try{arr=JSON.parse(dec(f.content))}catch(e){arr=[]}}
  arr=mutate(arr);
  try{
   await gh('PUT',LIST,{message:msg,content:encText(JSON.stringify(arr,null,1)),branch:BR,sha:f?f.sha:undefined},key);
   return arr;
  }catch(e){
   if(e.status===409||e.status===422){await delay(600*(n+1));continue}
   throw e;
  }
 }
 throw new Error('conflict');
}
async function load(){
 var arr=null;
 try{var f=await gh('GET',LIST,null,tok());arr=f?JSON.parse(dec(f.content)):[]}
 catch(e){
  try{var f2=await gh('GET',LIST,null,'');arr=f2?JSON.parse(dec(f2.content)):[]}catch(_){
   try{var r=await fetch(DIR+'/'+LIST+'?t='+Date.now(),{cache:'no-store'});arr=r.ok?await r.json():[]}catch(__){arr=[]}
  }
 }
 list=Array.isArray(arr)?arr.filter(function(x){return x&&x.vid}):[];
 render();
}

/* ───── 화면 그리기 ───── */
var CK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function thumbList(it){
 var a=[];
 if(it.thumb){a.push(RAW+it.thumb+'?v='+(it.ts||''));a.push(DIR+'/'+it.thumb)}
 a.push('https://i.ytimg.com/vi/'+it.vid+'/hqdefault.jpg');
 return a;
}
function setImg(img,srcs){
 var i=0;img.onerror=function(){i++;if(i<srcs.length)img.src=srcs[i];else img.onerror=null};
 img.src=srcs[0];
}
function card(it){
 var d=mk('it'+(sel[it.id]?' on':'')),th=mk('th'),img=document.createElement('img');
 d.dataset.id=it.id;img.alt='';img.loading='lazy';img.draggable=false;setImg(img,thumbList(it));
 th.appendChild(img);th.appendChild(mk('pl'));
 var c=mk('chk');c.innerHTML=CK;th.appendChild(c);
 d.appendChild(th);d.appendChild(mk('tt',it.title||'제목 없음'));
 if(it.author)d.appendChild(mk('sbt',it.author));
 bindCard(d,it);
 return d;
}
function render(){
 var box=$('#list');box.innerHTML='';
 $('#cnt').textContent=list.length?'영상 '+list.length+'개':'';
 $('#empty').style.display=list.length?'none':'block';
 var s=list.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)}),k='',gr;
 s.forEach(function(it){
  var d=dayKey(it.ts||0);
  if(d!==k){k=d;box.appendChild(mk('dh',fmtDay(it.ts||0)));gr=mk('gr');box.appendChild(gr)}
  gr.appendChild(card(it));
 });
 syncSel();
}
function ids(){return Object.keys(sel).filter(function(k){return sel[k]})}
function items(){var a=ids();return list.filter(function(x){return a.indexOf(x.id)>=0})}
function syncSel(){
 var n=ids().length;
 $('#app').classList.toggle('sel',selMode);
 document.querySelectorAll('.it').forEach(function(e){e.classList.toggle('on',!!sel[e.dataset.id])});
 $('#mt').textContent=selMode?(n?n+'개 선택됨':'항목을 선택하세요'):'게임동영상';
 $('#allChk').classList.toggle('on',list.length>0&&n===list.length);
 $('#aYT').disabled=n!==1;$('#aCh').disabled=n!==1;$('#aSh').disabled=n<1;$('#aDel').disabled=n<1;
}
function setMode(on){selMode=on;if(!on)sel={};syncSel()}

/* 탭 = 재생(또는 선택), 길게 누르기 = 선택 시작 */
function bindCard(d,it){
 var t=null,lp=false,sx=0,sy=0;
 d.addEventListener('pointerdown',function(e){
  lp=false;sx=e.clientX;sy=e.clientY;clearTimeout(t);
  t=setTimeout(function(){lp=true;if(!selMode)selMode=true;sel[it.id]=true;syncSel();if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}},480);
 });
 var cancel=function(){clearTimeout(t)};
 d.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)cancel()});
 d.addEventListener('pointerup',cancel);d.addEventListener('pointercancel',cancel);d.addEventListener('pointerleave',cancel);
 d.addEventListener('contextmenu',function(e){e.preventDefault()});
 d.addEventListener('click',function(){
  if(lp){lp=false;return}
  if(selMode){sel[it.id]=!sel[it.id];syncSel()}else play(it);
 });
}
$('#bSel').onclick=function(){if(!list.length){toast('선택할 영상이 없습니다');return}setMode(true)};
$('#bX').onclick=function(){setMode(false)};
$('#bAll').onclick=function(){
 var all=ids().length===list.length;sel={};if(!all)list.forEach(function(x){sel[x.id]=true});syncSel();
};

/* 스크롤하면 위쪽에 작은 제목 */
if('IntersectionObserver' in window){
 new IntersectionObserver(function(e){$('#bar').classList.toggle('sc',!e[0].isIntersecting)},{rootMargin:'-70px 0px 0px 0px'}).observe($('#h1'));
}

/* ───── 작업 버튼 ───── */
$('#aYT').onclick=function(){var a=items();if(a.length===1)openNew(watchUrl(a[0]))};
$('#aCh').onclick=function(){var a=items();if(a.length===1)openNew(chanUrl(a[0]))};
$('#aSh').onclick=async function(){
 var a=items();if(!a.length)return;
 var text=a.length===1?a[0].title:'게임동영상 '+a.length+'개',url=a.length===1?shortUrl(a[0]):'';
 var body=a.map(function(x){return (x.title||'')+'\n'+shortUrl(x)}).join('\n\n');
 try{
  if(navigator.share){await navigator.share(a.length===1?{title:text,text:text,url:url}:{title:text,text:body});return}
 }catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(a.length===1?url:body);toast('링크를 복사했습니다')}
 catch(e){window.prompt('아래 내용을 복사해 공유하세요',a.length===1?url:body)}
};
$('#aDel').onclick=async function(){
 var a=items();if(!a.length)return;
 var ok=await confirmDlg('삭제',a.length+'개의 영상을 이 페이지에서 삭제할까요?','유튜브에 올린 원본 영상은 지워지지 않습니다.','삭제');
 if(!ok)return;
 var key=await ensureAuth();if(!key)return;
 var rm=a.map(function(x){return x.id});
 try{
  toast('삭제하는 중…',8000);
  var arr=await commitList(function(arr){return arr.filter(function(p){return rm.indexOf(p.id)<0})},key,'delete '+rm.length+' video(s)');
  for(var i=0;i<a.length;i++){
   if(!a[i].thumb)continue;
   try{var f=await gh('GET',a[i].thumb,null,key);if(f)await gh('DELETE',a[i].thumb,{message:'delete '+a[i].thumb,sha:f.sha,branch:BR},key)}catch(_){}
  }
  list=arr.filter(function(x){return x&&x.vid});setMode(false);render();toast('삭제했습니다');
 }catch(e){failMsg(e)}
};
function failMsg(e){
 if(e&&e.status===401){try{localStorage.removeItem('gh_token')}catch(_){}toast('인증이 만료되었습니다. 다시 시도해 주세요',4000);return}
 if(e&&(e.status===403||e.status===404)){toast('저장 권한이 없습니다',4000);return}
 toast('저장에 실패했습니다. 잠시 후 다시 시도해 주세요',4000);
}

/* ───── 재생 ───── */
function play(it){
 cur=it;
 var f=document.createElement('iframe');
 f.src='https://www.youtube-nocookie.com/embed/'+it.vid+'?autoplay=1&rel=0&playsinline=1';
 f.allow='accelerometer; autoplay; clips*; encrypted-media; gyroscope; picture-in-picture; fullscreen';f.allowFullscreen=true;f.title=it.title||'게임동영상';
 f.referrerPolicy='strict-origin-when-cross-origin';
 $('#pf').innerHTML='';$('#pf').appendChild(f);
 var pn=$('#pn');pn.textContent=it.title||'';if(it.author){var s=mk('',it.author,'small');pn.appendChild(s)}
 $('#pl').classList.add('on');$('#pl').setAttribute('aria-hidden','false');
}
function stop(){$('#pf').innerHTML='';$('#pl').classList.remove('on');$('#pl').setAttribute('aria-hidden','true');cur=null}
$('#pX').onclick=stop;
$('#pl').addEventListener('click',function(e){if(e.target===$('#pl')||e.target===$('.pc'))stop()});
$('#pYT').onclick=function(){if(cur)openNew(watchUrl(cur))};
$('#pCh').onclick=function(){if(cur)openNew(chanUrl(cur))};

/* ───── 팝업 ───── */
var md=$('#md'),mdDone=null;
function mOpen(nodes,done){
 md.innerHTML='';var d=mk('dlg');nodes.forEach(function(n){d.appendChild(n)});md.appendChild(d);
 mdDone=done||null;md.classList.add('on');md.setAttribute('aria-hidden','false');return d;
}
function mClose(v){md.classList.remove('on');md.setAttribute('aria-hidden','true');md.innerHTML='';var f=mdDone;mdDone=null;if(f)f(v)}
md.addEventListener('click',function(e){if(e.target===md)mClose(null)});
addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(md.classList.contains('on'))mClose(null);else if($('#pl').classList.contains('on'))stop();else if(selMode)setMode(false)});
function btns(a){var r=mk('br');a.forEach(function(b){var x=mk(b[1]||'',b[0],'button');x.type='button';x.onclick=b[2];r.appendChild(x);b.el=x});return r}

function confirmDlg(title,msg,sub,okText){
 return new Promise(function(res){
  mOpen([mk('',title,'h2'),mk('ds',msg+(sub?'\n'+sub:'')),btns([['취소','',function(){mClose(false)}],[okText||'확인','no',function(){mClose(true)}]])],function(v){res(!!v)});
  md.querySelector('.ds').style.whiteSpace='pre-line';
 });
}

/* 비밀번호 확인 */
async function hashPw(p){
 var k=await crypto.subtle.importKey('raw',enc(p),'PBKDF2',false,['deriveBits']);
 var b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc(SALT),iterations:ITER},k,256);
 return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
}
function askPw(){
 return new Promise(function(res){
  var inp=mk('pwd',null,'input');inp.type='password';inp.inputMode='numeric';inp.autocomplete='off';inp.maxLength=12;inp.placeholder='••••';
  var er=mk('er'),ok;
  async function go(){
   var v=inp.value.trim();if(!v)return;
   if(Date.now()<lockUntil){er.textContent='잠시 후 다시 시도해 주세요 ('+Math.ceil((lockUntil-Date.now())/1000)+'초)';return}
   if(!(window.crypto&&crypto.subtle)){er.textContent='보안 연결(https)에서만 사용할 수 있습니다';return}
   ok.disabled=true;
   var h='';try{h=await hashPw(v)}catch(e){}
   ok.disabled=false;
   if(h===PWH){fails=0;mClose(true)}
   else{fails++;inp.value='';if(fails>=5){lockUntil=Date.now()+15000;fails=0;er.textContent='여러 번 틀렸습니다. 15초 뒤에 다시 시도해 주세요'}else er.textContent='비밀번호가 맞지 않습니다';inp.focus()}
  }
  var b=btns([['취소','',function(){mClose(false)}],['확인','ok',go]]);ok=b.querySelector('.ok');
  mOpen([mk('','비밀번호 입력','h2'),mk('ds','업로드·삭제는 비밀번호를 입력해야 사용할 수 있어요.'),inp,er,b],function(v){res(!!v)});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  setTimeout(function(){inp.focus()},120);
 });
}
/* 이 기기에 처음 한 번만 필요한 인증키 */
function askKey(){
 return new Promise(function(res){
  var inp=mk('',null,'input');inp.type='password';inp.autocomplete='off';inp.placeholder='인증키 입력';inp.setAttribute('autocapitalize','off');
  var er=mk('er'),ok;
  async function go(){
   var v=inp.value.trim();if(!v)return;
   ok.disabled=true;ok.textContent='확인 중…';
   try{await checkKey(v);try{localStorage.setItem('gh_token',v)}catch(e){}mClose(v)}
   catch(e){er.textContent='인증키가 올바르지 않거나 권한이 없습니다';ok.disabled=false;ok.textContent='확인'}
  }
  var b=btns([['취소','',function(){mClose(null)}],['확인','ok',go]]);ok=b.querySelector('.ok');
  mOpen([mk('','관리자 인증','h2'),mk('ds','이 기기에서 처음 한 번만 입력하면 됩니다.'),inp,er,b],function(v){res(v||null)});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  setTimeout(function(){inp.focus()},120);
 });
}
async function ensureAuth(){
 if(!unlocked){var ok=await askPw();if(!ok)return null;unlocked=true}
 var k=tok();if(!k)k=await askKey();
 return k||null;
}

/* ───── 업로드 ───── */
var auto={title:'',ch:''};
async function toJpeg(file){
 var u=URL.createObjectURL(file);
 try{
  var img=await new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=u});
  var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,960/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*s);c.height=Math.round(h*s);
  var x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return await new Promise(function(r){c.toBlob(r,'image/jpeg',.86)});
 }finally{URL.revokeObjectURL(u)}
}
function openUpload(key){
 var url=mk('',null,'input');url.type='url';url.placeholder='https://youtu.be/…';url.autocomplete='off';url.setAttribute('autocapitalize','off');
 var title=mk('',null,'input');title.type='text';title.placeholder='영상 제목';
 var ch=mk('',null,'input');ch.type='url';ch.placeholder='https://www.youtube.com/@내채널';ch.autocomplete='off';
 try{ch.value=localStorage.getItem('yv_ch')||''}catch(e){}
 var file=document.createElement('input');file.type='file';file.accept='image/*';file.style.display='none';
 var pi=mk('pi','썸네일'),pb=mk('','이미지 선택','button');pb.type='button';
 var pv=mk('pv');pv.appendChild(pi);pv.appendChild(pb);
 var er=mk('er'),blob=null,tmr=null;
 auto={title:'',ch:''};
 function lab(t){return mk('',t,'label')}
 pb.onclick=function(){file.click()};
 function showPrev(src){pi.innerHTML='';if(src){var i=document.createElement('img');i.src=src;i.alt='';pi.appendChild(i)}else pi.textContent='썸네일'}
 file.onchange=async function(){
  var f=file.files&&file.files[0];blob=null;if(!f)return;
  if(f.size>25*1024*1024){er.textContent='이미지는 25MB 이하만 올릴 수 있어요';return}
  try{blob=await toJpeg(f);er.textContent='';showPrev(URL.createObjectURL(blob));pb.textContent='다시 선택'}
  catch(e){er.textContent='이미지를 읽지 못했습니다';blob=null}
 };
 url.addEventListener('input',function(){
  clearTimeout(tmr);
  tmr=setTimeout(async function(){
   var id=ytId(url.value);if(!id)return;
   if(!blob)showPrev('https://i.ytimg.com/vi/'+id+'/hqdefault.jpg');
   try{
    var r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
    if(!r.ok)return;var j=await r.json();
    if(j.title&&(!title.value||title.value===auto.title)){title.value=j.title;auto.title=j.title}
    if(j.author_url&&(!ch.value||ch.value===auto.ch)){ch.value=j.author_url;auto.ch=j.author_url}
    auto.author=j.author_name||'';
   }catch(e){}
  },450);
 });
 var save,cancel;
 var row=btns([['취소','',function(){mClose(null)}],['저장','ok',async function(){
  er.textContent='';
  var id=ytId(url.value);if(!id){er.textContent='유튜브 링크를 올바르게 입력해 주세요';return}
  if(list.some(function(x){return x.vid===id})){er.textContent='이미 올린 영상입니다';return}
  var t=title.value.trim();if(!t){er.textContent='제목을 입력해 주세요';return}
  var c=ch.value.trim();if(c&&!/^https?:\/\//i.test(c)){er.textContent='채널 주소는 https:// 로 시작해야 합니다';return}
  save.disabled=true;cancel.disabled=true;save.textContent='저장 중…';
  var iid=stamp(),it={id:iid,vid:id,title:t,author:auto.author||'',channel:c,thumb:'',ts:Date.now()},tn=null;
  try{
   if(blob){tn=iid+'.jpg';await gh('PUT',tn,{message:'add thumbnail '+tn,content:await b64(blob),branch:BR},key);it.thumb=tn}
   try{await commitList(function(arr){arr=arr.filter(function(p){return p.id!==iid&&p.vid!==id});arr.push(it);return arr},key,'add video '+iid)}
   catch(e){if(tn){try{var f=await gh('GET',tn,null,key);if(f)await gh('DELETE',tn,{message:'rollback '+tn,sha:f.sha,branch:BR},key)}catch(_){}}throw e}
   try{localStorage.setItem('yv_ch',c)}catch(e){}
   list.push(it);render();mClose(true);toast('저장되었습니다');
  }catch(e){
   save.disabled=false;cancel.disabled=false;save.textContent='저장';
   if(e&&e.status===401){try{localStorage.removeItem('gh_token')}catch(_){}er.textContent='인증이 만료되었습니다. 창을 닫고 다시 시도해 주세요'}
   else if(e&&(e.status===403||e.status===404))er.textContent='저장 권한이 없습니다';
   else er.textContent='저장에 실패했습니다. 잠시 후 다시 시도해 주세요';
  }
 }]]);
 cancel=row.children[0];save=row.children[1];
 var h=mk('hint','썸네일을 고르지 않으면 유튜브 기본 썸네일이 쓰입니다. 링크를 붙여넣으면 제목과 채널이 자동으로 채워져요.');
 mOpen([mk('','영상 업로드','h2'),mk('ds','유튜브에 올린 영상의 링크와 썸네일을 추가하세요.'),
  lab('유튜브 링크'),url,lab('제목'),title,lab('채널 주소 (선택)'),ch,lab('썸네일'),pv,file,h,er,row]);
 setTimeout(function(){url.focus()},150);
}
$('#bUp').onclick=async function(){var k=await ensureAuth();if(k)openUpload(k)};

load();
})();
</script>
