<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>메모 · NOTE</title>
<style>
:root{
  --bg:#f6f6f4;--card:#fff;--ink:#1b1b1b;--mut:#8a8a86;--line:rgba(0,0,0,.08);--acc:#f5a800;--acc2:#ffcb3d;--blue:#2b6df0;--red:#e5484d;
  --sans:"SamsungOne","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121212;--card:#1f1f1f;--ink:#f2f2f0;--mut:#9a9a96;--line:rgba(255,255,255,.1)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font-family:inherit;color:inherit}
body{overflow:hidden}

.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.view[hidden]{display:none}

/* ===== 목록 화면 ===== */
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(10px + var(--sat)) max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left));max-width:1100px;width:100%;margin:0 auto}
.bar .grow{flex:1}
.txtbtn{border:0;background:none;font:500 15px var(--sans);padding:9px 12px;border-radius:99px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.txtbtn:hover{background:rgba(128,128,128,.14)}
.txtbtn:active{background:rgba(128,128,128,.24)}
.txtbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;padding:6px max(20px,env(safe-area-inset-left)) 4px;font:700 32px var(--sans);letter-spacing:-.02em;max-width:1100px;width:100%;margin:0 auto}
.sub{color:var(--mut);font:400 13.5px var(--sans);padding:0 max(20px,env(safe-area-inset-left)) 10px;max-width:1100px;width:100%;margin:0 auto}

.sbox{max-width:1100px;width:100%;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.sbox label{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:99px;background:rgba(128,128,128,.13)}
.sbox svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 16px var(--sans);color:var(--ink)}
.sbox input::placeholder{color:var(--mut)}

.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.list{max-width:1100px;margin:0 auto;padding:4px max(14px,env(safe-area-inset-right)) calc(110px + var(--sab)) max(14px,env(safe-area-inset-left));
  columns:2;column-gap:12px}
@media (min-width:640px){.list{columns:3}}
@media (min-width:980px){.list{columns:4}}
.note{position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 12px;padding:16px 16px 14px;text-align:left;border:1px solid var(--line);border-radius:20px;background:var(--card);cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .15s,box-shadow .2s;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.note:hover{box-shadow:0 8px 22px rgba(0,0,0,.12);transform:translateY(-2px)}
.note:active{transform:scale(.98)}
.note .tt{font:600 16px/1.35 var(--sans);margin:0 0 6px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .bd{font:400 14px/1.5 var(--sans);color:var(--mut);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.note .dt{margin-top:12px;font:400 12px var(--sans);color:var(--mut);opacity:.85}
.note.c0{background:var(--card)}
.note.c1{background:#fff6d6}.note.c2{background:#e3f1ff}.note.c3{background:#e6f7e4}.note.c4{background:#ffe6ea}
@media (prefers-color-scheme:dark){.note.c1{background:#3b3414}.note.c2{background:#14304a}.note.c3{background:#1a3a1a}.note.c4{background:#46212a}}
.empty{display:none;text-align:center;color:var(--mut);padding:70px 24px;font:400 15px/1.7 var(--sans)}
.empty svg{width:70px;height:70px;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.45;margin-bottom:12px}
.empty.on{display:block}

.write{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(22px + var(--sab));display:flex;align-items:center;gap:8px;height:58px;padding:0 24px 0 20px;border:0;border-radius:99px;
  background:linear-gradient(180deg,var(--acc2),var(--acc));color:#2b1d00;font:700 16px var(--sans);box-shadow:0 8px 22px rgba(245,168,0,.45),0 2px 6px rgba(0,0,0,.2);cursor:pointer;z-index:5;transition:transform .15s}
.write:active{transform:scale(.94)}
.write svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 편집 화면 ===== */
#ed{background:var(--card)}
.ebar{flex:none;display:flex;align-items:center;gap:4px;padding:calc(8px + var(--sat)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--card)}
.ebar .grow{flex:1}
.ibtn{width:44px;height:44px;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:rgba(128,128,128,.14)}
.ibtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.del{color:var(--red)}
.save{border:0;background:var(--blue);color:#fff;font:600 15px var(--sans);padding:0 20px;height:40px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.save:active{transform:scale(.95)}
.save svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:820px;margin:0 auto;padding:12px max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
#tt{flex:none;border:0;outline:0;background:none;color:var(--ink);font:700 24px var(--sans);padding:10px 0 8px;width:100%;letter-spacing:-.01em;border-bottom:1px solid var(--line)}
#tt::placeholder{color:var(--mut);font-weight:500}
#bd{flex:1;min-height:0;width:100%;resize:none;border:0;outline:0;background:none;color:var(--ink);font:400 17px/1.75 var(--sans);padding:14px 0 calc(16px + var(--sab))}
#bd::placeholder{color:var(--mut)}
.stat{flex:none;display:flex;justify-content:space-between;font:400 12px var(--sans);color:var(--mut);padding:8px max(18px,env(safe-area-inset-right)) calc(8px + var(--sab)) max(18px,env(safe-area-inset-left));border-top:1px solid var(--line);max-width:820px;width:100%;margin:0 auto}
.palette{display:flex;gap:10px;align-items:center}
.palette button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(128,128,128,.35);cursor:pointer;padding:0}
.palette button.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(43,109,240,.25)}
.palette .p0{background:#fff}.palette .p1{background:#ffe9a0}.palette .p2{background:#bcdcff}.palette .p3{background:#bfe8bb}.palette .p4{background:#ffc3cd}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,20px);max-width:88vw;padding:12px 20px;border-radius:99px;background:rgba(30,30,30,.92);color:#fff;font:500 14px var(--sans);opacity:0;pointer-events:none;transition:.25s;z-index:50;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 확인창 */
#dlg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.4)}
#dlg.on{display:flex}
#dlg .box{width:min(320px,100%);background:var(--card);border-radius:24px;padding:24px 20px 14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#dlg p{margin:0 0 18px;font:500 16px/1.5 var(--sans)}
#dlg .r{display:flex;gap:8px}
#dlg .r button{flex:1;height:44px;border:0;border-radius:99px;font:600 15px var(--sans);cursor:pointer;background:rgba(128,128,128,.16)}
#dlg .r button.ok{background:var(--red);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 목록 -->
<section class="view" id="lv">
  <div class="bar">
    <a class="txtbtn" href="index.html" id="exit" aria-label="나가기">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>나가기
    </a>
    <span class="grow"></span>
  </div>
  <h1>메모</h1>
  <div class="sub" id="cnt">0개의 메모</div>
  <div class="sbox"><label><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="sq" type="search" placeholder="메모 검색" aria-label="메모 검색" enterkeyhint="search"></label></div>
  <div class="scroll">
    <div class="list" id="list"></div>
    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.500"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <div id="emptyT">작성한 메모가 없습니다.<br>아래 <b>글쓰기</b> 버튼을 눌러 시작해 보세요.</div>
    </div>
  </div>
  <button class="write" id="newBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>글쓰기
  </button>
</section>

<!-- 편집 -->
<section class="view" id="ed" hidden>
  <div class="ebar">
    <button class="ibtn" id="back" type="button" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="grow"></span>
    <button class="ibtn del" id="del" type="button" aria-label="삭제"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button class="save" id="save" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M5 20h14"/></svg>저장</button>
  </div>
  <div class="page">
    <input id="tt" type="text" placeholder="제목" maxlength="120" autocomplete="off" enterkeyhint="next">
    <textarea id="bd" placeholder="내용을 입력하세요" spellcheck="false"></textarea>
  </div>
  <div class="stat"><span id="info">0자</span><span class="palette" id="pal" aria-label="메모 색상"><button class="p0 on" data-c="0" type="button" aria-label="기본"></button><button class="p1" data-c="1" type="button" aria-label="노랑"></button><button class="p2" data-c="2" type="button" aria-label="파랑"></button><button class="p3" data-c="3" type="button" aria-label="초록"></button><button class="p4" data-c="4" type="button" aria-label="분홍"></button></span></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<div id="dlg" role="alertdialog" aria-modal="true"><div class="box"><p>이 메모를 삭제할까요?</p><div class="r"><button type="button" id="dNo">취소</button><button type="button" class="ok" id="dYes">삭제</button></div></div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const KEY='memo.items.v1';
let notes=[],cur=null,dirty=false;

/* ---------- 저장소 (이 기기의 브라우저에만 보관) ---------- */
function load(){
  try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(a)?a.filter(n=>n&&typeof n.id==='string'):[]}catch(_){notes=[]}
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(_){toast('브라우저 저장 공간이 부족합니다.')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(t){
  const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,'0');
  if(d.toDateString()===n.toDateString())return `오늘 ${p(d.getHours())}:${p(d.getMinutes())}`;
  const y=d.getFullYear()===n.getFullYear()?'':d.getFullYear()+'.';
  return `${y}${p(d.getMonth()+1)}.${p(d.getDate())}`;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- 목록 ---------- */
function render(){
  const q=$('#sq').value.trim().toLowerCase();
  const arr=notes.slice().sort((a,b)=>b.t-a.t).filter(n=>!q||(n.title+'\n'+n.body).toLowerCase().includes(q));
  $('#cnt').textContent=notes.length+'개의 메모';
  $('#list').innerHTML=arr.map((n,i)=>
    `<button class="note c${n.c|0}" data-id="${n.id}" style="animation-delay:${Math.min(i,12)*30}ms" type="button">
      <div class="tt">${esc(n.title||firstLine(n.body)||'제목 없음')}</div>
      <p class="bd">${esc(n.title?n.body:restLines(n.body))}</p>
      <div class="dt">${fmtDate(n.t)}</div></button>`).join('');
  const e=$('#empty');e.classList.toggle('on',!arr.length);
  $('#emptyT').innerHTML=q?'검색 결과가 없습니다.':'작성한 메모가 없습니다.<br>아래 <b>글쓰기</b> 버튼을 눌러 시작해 보세요.';
}
const firstLine=b=>(b||'').split('\n').find(l=>l.trim())||'';
const restLines=b=>{const a=(b||'').split('\n');const i=a.findIndex(l=>l.trim());return i<0?'':a.slice(i+1).join('\n')};
$('#sq').addEventListener('input',render);
$('#list').addEventListener('click',e=>{const b=e.target.closest('.note');if(b)openEd(b.dataset.id)});

/* ---------- 편집 ---------- */
let color=0;
function setColor(c){
  color=c;dirty=true;
  document.querySelectorAll('#pal button').forEach(b=>b.classList.toggle('on',+b.dataset.c===c));
}
$('#pal').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setColor(+b.dataset.c)});
function updInfo(){
  const v=$('#bd').value;
  $('#info').textContent=v.length.toLocaleString()+'자 · '+(v?v.split('\n').length:0)+'줄';
}
function openEd(id){
  cur=id?notes.find(n=>n.id===id)||null:null;
  $('#tt').value=cur?cur.title:'';
  $('#bd').value=cur?cur.body:'';
  setColor(cur?(cur.c|0):0);dirty=false;
  $('#del').style.visibility=cur?'visible':'hidden';
  $('#lv').hidden=true;$('#ed').hidden=false;
  updInfo();
  history.pushState({ed:1},'');
  if(!cur)setTimeout(()=>$('#tt').focus(),60);
}
function closeEd(){
  $('#ed').hidden=true;$('#lv').hidden=false;render();
}
$('#newBtn').onclick=()=>openEd(null);
$('#bd').addEventListener('input',()=>{dirty=true;updInfo()});
$('#tt').addEventListener('input',()=>{dirty=true});
$('#tt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#bd').focus()}});

/* 뒤로: 내용이 바뀌었으면 자동으로 보관함에 임시 저장 (파일 다운로드는 '저장' 버튼에서만) */
function keep(){
  const title=$('#tt').value.trim(),body=$('#bd').value;
  if(!title&&!body.trim()){
    if(cur){notes=notes.filter(n=>n.id!==cur.id);persist()}
    return false;
  }
  if(cur){Object.assign(cur,{title,body,c:color,t:Date.now()})}
  else{cur={id:uid(),title,body,c:color,t:Date.now()};notes.push(cur)}
  persist();return true;
}
function goBack(){
  if(dirty)keep();
  closeEd();
}
$('#back').onclick=()=>{if(history.state&&history.state.ed)history.back();else goBack()};
addEventListener('popstate',()=>{if(!$('#ed').hidden)goBack()});

/* ---------- 저장 = TXT 파일 다운로드 ---------- */
function safeName(s){
  s=(s||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
  return s;
}
function stamp(){
  const d=new Date(),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function downloadTxt(name,text){
  /* 맨 앞 BOM: 윈도우 메모장에서도 한글이 깨지지 않게 */
  const blob=new Blob(['\ufeff',text.replace(/\r?\n/g,'\r\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
$('#save').onclick=()=>{
  const title=$('#tt').value.trim(),body=$('#bd').value;
  if(!title&&!body.trim()){toast('저장할 내용을 입력해 주세요.');return}
  keep();dirty=false;
  const base=safeName(title)||safeName(firstLine(body))||('메모_'+stamp());
  const text=(title?title+'\n\n':'')+body;
  downloadTxt(base+'.txt',text);
  $('#del').style.visibility='visible';
  toast('「'+base+'.txt」 파일로 저장했어요.');
};

/* ---------- 삭제 ---------- */
$('#del').onclick=()=>{if(cur)$('#dlg').classList.add('on')};
$('#dNo').onclick=()=>$('#dlg').classList.remove('on');
$('#dYes').onclick=()=>{
  $('#dlg').classList.remove('on');
  if(cur){notes=notes.filter(n=>n.id!==cur.id);persist();cur=null}
  dirty=false;
  if(history.state&&history.state.ed)history.back();else closeEd();
  toast('메모를 삭제했어요.');
};
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')$('#dlg').classList.remove('on')});

/* 단축키: Ctrl/Cmd+S 저장 */
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!$('#ed').hidden){e.preventDefault();$('#save').click()}
  if(e.key==='Escape'){if($('#dlg').classList.contains('on'))$('#dlg').classList.remove('on')}
});

/* 시작 */
load();render();
})();
</script>
</body>
</html>
