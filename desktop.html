<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="noads.js"></script>
<script src="adnotice.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sky OS">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sky OS · 최영호의 웹에뮬레이터 PC</title>
<script>
/* 아이폰 핀치 확대 방지 */
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
</script>
<style>
:root{--tbh:48px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--acc:#4a90e2;--ic:#fff;--if:none;--sw:2;
 --bar:#2f343f;--bar2:#23272f;--txt:#c9cdd6;--font:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",system-ui,sans-serif}
html[data-ic=color]{--ic:var(--acc)}
html[data-ic=bold]{--sw:3.2}
html[data-ic=fill]{--if:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#03040a;font-family:var(--font);color:var(--txt);-webkit-text-size-adjust:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea,select{font-family:inherit;user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0}
.ic{width:100%;height:100%;fill:var(--if);stroke:var(--ic);stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;display:block;overflow:visible}
/* 바탕화면 아이콘 */
#desk{position:fixed;left:14px;top:calc(var(--sat) + 14px);display:flex;flex-direction:column;gap:14px;z-index:1}
.di{width:84px;background:none;border:0;color:#fff;font-size:13px;text-align:center;padding:6px 2px;border-radius:6px;text-shadow:0 1px 3px #000}
.di:hover,.di:focus{background:rgba(255,255,255,.12);outline:0}
.di svg{width:50px;height:50px;display:block;margin:0 auto 4px}
/* 작업표시줄 */
#tb{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tbh) + var(--sab));padding-bottom:var(--sab);background:rgba(4,6,12,.94);display:flex;align-items:center;z-index:5000;border-top:1px solid rgba(255,255,255,.05)}
#start{width:52px;height:var(--tbh);background:none;border:0;display:grid;place-items:center;border-bottom:2px solid transparent}
#start i{display:grid;grid-template-columns:repeat(3,5px);gap:3px}
#start i b{width:5px;height:5px;border-radius:50%}
#tasks{flex:1;display:flex;align-items:stretch;height:var(--tbh);overflow-x:auto;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.tk{width:52px;flex:none;background:none;border:0;display:grid;place-items:center;border-bottom:2px solid transparent;position:relative}
.tk svg{width:26px;height:26px}
.tk.on{background:rgba(255,255,255,.08);border-bottom-color:var(--acc)}
.tk.mn{opacity:.55}
#tray{display:flex;align-items:center;gap:14px;padding:0 12px;font-size:13px;color:#fff;flex:none}
#tray svg{width:18px;height:18px;opacity:.85}
#tray .g{width:22px;height:22px;font-weight:700;font-size:20px;display:grid;place-items:center}
#sd{width:22px;height:20px;border:1.5px solid #ddd;border-radius:2px;background:none;padding:0;position:relative}
#sd:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#ddd}
/* 메뉴(시작) */
#menu{position:fixed;left:8px;bottom:calc(var(--tbh) + var(--sab) + 8px);width:min(900px,calc(100vw - 16px));height:min(540px,calc(100dvh - var(--tbh) - var(--sab) - 24px - var(--sat)));background:rgba(43,48,59,.97);border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:none;z-index:4900;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
#menu.on{display:flex;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.ml{width:230px;flex:none;background:rgba(30,34,42,.98);display:flex;flex-direction:column;padding:12px 0;overflow:auto}
.ml button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#d5d9e1;font-size:15px;padding:11px 18px;text-align:left}
.ml button svg{width:22px;height:22px;flex:none}
.ml button.on{background:rgba(255,255,255,.09);box-shadow:inset 3px 0 var(--acc)}
.ml button:hover{background:rgba(255,255,255,.06)}
.ml hr{border:0;border-top:1px solid rgba(255,255,255,.08);width:100%;margin:8px 0}
.ml .sp{flex:1}
.mr{flex:1;overflow:auto;padding:22px 20px}
.mr h4{margin:0 0 14px;font-size:13px;font-weight:500;color:#8f96a5;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px 6px}
.tile{background:none;border:0;border-radius:8px;color:#e9ecf2;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;line-height:1.25;text-align:center}
.tile:hover,.tile:focus{background:rgba(255,255,255,.1);outline:0}
.tile .ti{width:50px;height:50px}
.tile small{display:block;color:#8f96a5;font-size:11px;margin-top:2px}
/* 창 */
#wins{position:fixed;inset:0;bottom:calc(var(--tbh) + var(--sab));z-index:10;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:#f3f4f6;color:#2e3436;border-radius:7px 7px 0 0;box-shadow:0 8px 36px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.5);pointer-events:auto;min-width:260px;min-height:180px}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.wtb{height:40px;flex:none;background:var(--bar);color:var(--txt);display:flex;align-items:center;border-radius:7px 7px 0 0;touch-action:none;font-size:14px;position:relative}
.win.max .wtb{border-radius:0}
.wtl,.wtr{display:flex;align-items:center;gap:2px;padding:0 6px;flex:none;z-index:1}
.wtt{position:absolute;left:0;right:0;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 160px}
.wtr{margin-left:auto}
.wc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:16px;line-height:1;cursor:pointer;color:#cfd3db}
.wc:hover{background:rgba(255,255,255,.1)}
.wc.cl{background:#d9545a;color:#fff;font-size:14px;margin-left:4px}
.wb{flex:1;position:relative;overflow:hidden;min-height:0;background:#f3f4f6}
.wb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
.win.max .rs{display:none}
.tbb{background:none;border:0;color:var(--txt);height:30px;padding:0 10px;border-radius:4px;font-size:14px;white-space:nowrap}
.tbb:hover{background:rgba(255,255,255,.1)}
.tbb.on{background:#4a90e2;color:#fff}
.tbb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
/* 대화상자 */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:9000;padding:16px}
#dlg.on{display:grid}
.db{background:#f6f7f9;color:#2e3436;border-radius:10px;width:min(440px,100%);box-shadow:0 12px 50px rgba(0,0,0,.7);overflow:hidden;max-height:92dvh;display:flex;flex-direction:column}
.db h3{margin:0;padding:16px 20px 6px;font-size:17px}
.dc{padding:6px 20px 12px;font-size:14px;line-height:1.55;overflow:auto;user-select:text}
.dc label{display:block;margin:10px 0 4px;font-size:12.5px;color:#666}
.dc input[type=text],.dc input[type=password],.dc input:not([type]),.dc select{width:100%;padding:9px 10px;border:1px solid #c6c9d0;border-radius:6px;font-size:14px;background:#fff;color:#222}
.dbt{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 16px}
.dbt button,.btn{border:1px solid #c6c9d0;background:#fff;color:#2e3436;border-radius:6px;padding:8px 16px;font-size:14px}
.dbt button.pri,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.dbt button.dng,.btn.dng{background:#d9545a;border-color:#d9545a;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(var(--tbh) + var(--sab) + 18px);transform:translateX(-50%);background:rgba(20,22,28,.95);color:#fff;padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:9500;display:none;max-width:92vw;text-align:center}
#toast.on{display:block}
/* 가이드 */
.gd{height:100%;background:#fff;padding:5px;display:flex;flex-direction:column}
.gs{flex:1;margin:0;border-radius:12px 12px 0 0;overflow:auto;color:#fff;padding:34px 40px;background:linear-gradient(135deg,#05070f,#0d1230 55%,#1a0b30);position:relative}
.gs:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,transparent 0 120px,rgba(61,123,255,.14) 120px 190px,transparent 190px 330px,rgba(255,45,111,.1) 330px 400px);pointer-events:none}
.gs>*{position:relative}
.gs h2{font-size:26px;margin:0 0 14px;text-align:center}
.gs.in h2{text-align:left;font-size:25px;margin-top:70px}
.gs p,.gs li{font-size:15px;line-height:1.75;color:#e4e7f0;margin:0 0 8px}
.gs ul{padding-left:20px;margin:6px 0}
.gs .logo{font-size:34px;letter-spacing:.2em;font-weight:300;margin-top:10px}
.grow{display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px;margin-top:26px}
.grow div{width:80px;text-align:center;font-size:13px}
.grow svg{width:40px;height:40px;margin:0 auto 6px}
.mock{width:min(520px,100%);margin:0 auto 18px;border:1px solid rgba(255,255,255,.2);border-radius:6px;overflow:hidden;background:rgba(30,34,45,.8)}
.mock .mg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px;font-size:11px;text-align:center}
.mock .mg svg{width:26px;height:26px;margin:0 auto 3px}
.mock .mb{height:22px;background:#04060c;display:flex;align-items:center;padding:0 8px;gap:8px;font-size:10px}
.gn{height:58px;flex:none;background:#f5f5f5;border-radius:0 0 12px 12px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#555;font-size:14px}
.gn button{background:none;border:0;color:#555;font-size:14px;padding:8px}
.gn .go{background:#4274e6;color:#fff;border-radius:6px;padding:8px 38px}
.gn label{display:flex;align-items:center;gap:8px}
/* 메모 */
.mm{display:flex;height:100%;position:relative;background:#fff;flex-direction:column}
.mm .ed{flex:1;display:flex;min-height:0}
.gut{width:34px;flex:none;background:#efefef;color:#888;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;text-align:right;padding:2px 6px 0 0;overflow:hidden;white-space:pre;user-select:none}
.mm textarea{flex:1;border:0;outline:0;resize:none;padding:2px 4px;font:14px/1.45 ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;background:#fff;color:#2e3436;white-space:pre;overflow:auto;tab-size:8}
.mm .sb{height:30px;flex:none;background:#efefef;border-top:1px solid #d6d6d6;display:flex;align-items:center;justify-content:flex-end;gap:26px;padding:0 14px;font-size:13px;color:#555}
.pm{position:absolute;right:6px;top:2px;width:222px;background:#fff;border:1px solid #cfcfcf;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:8px 0;display:none;z-index:5}
.pm.on{display:block}
.pm .r3{display:flex;margin:0 10px 8px;border:1px solid #d3d3d3;border-radius:3px}
.pm .r3 button{flex:1;background:#fff;border:0;height:30px;color:#666}
.pm>button.i{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 18px;font-size:14px;color:#444}
.pm>button.i:hover{background:#4a90e2;color:#fff}
.pm hr{border:0;border-top:1px solid #e1e1e1;margin:5px 0}
/* 파일관리자 */
.fm{display:flex;height:100%}
.fs{width:200px;flex:none;background:#fff;border-right:1px solid #ddd;padding:6px 0;overflow:auto}
.fs button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:9px 16px;color:#555;font-size:14px;text-align:left}
.fs button svg{width:16px;height:16px;stroke:#666;fill:none;stroke-width:1.6;flex:none}
.fs button.on{background:#5294e2;color:#fff}.fs button.on svg{stroke:#fff}
.fs hr{border:0;border-top:1px solid #e3e3e3;margin:5px 0}
.fc{flex:1;background:#fff;overflow:auto;padding:22px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 6px;align-content:start}
.fc.lv{grid-template-columns:1fr;gap:0;padding:4px}
.fc.lv .fi{flex-direction:row;gap:12px;padding:5px 10px;text-align:left}
.fc.lv .fi svg{width:26px;height:26px}
.fi{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:6px;font-size:13px;color:#555;text-align:center;word-break:break-all;cursor:default}
.fi svg{width:54px;height:54px}
.fi.sel{background:#dbe8fb}
.fi small{display:block;color:#999;font-size:11px}
.fe{grid-column:1/-1;text-align:center;color:#999;padding:60px 0;font-size:14px}
.pth{height:30px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:4px;padding:0 10px;min-width:120px;max-width:44vw;overflow:hidden;white-space:nowrap;font-size:14px;margin-left:4px}
.pth svg{width:16px;height:16px;stroke:currentColor;flex:none}
/* 게임에뮬레이터 탐색창 */
.emm{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.emm .fc{flex:1;min-height:0}
.eh{display:none;flex:none;align-items:center;gap:12px;padding:6px 14px 6px 48px;background:#f5f6f8;border-bottom:1px solid #e3e5ea;font-size:12.5px;color:#777}
.eh.on{display:flex}
.eh span:first-child{flex:1}.eh .ey{width:70px}.eh .et{width:120px}
.fc.lv .fi .en{flex:1;min-width:0}
.fc.lv .fi .ey{width:70px;color:#888;font-size:13px}
.fc.lv .fi .et{width:120px;color:#888;font-size:13px}
.fc.lv .fi .ii{width:26px;height:26px}
.fi .ii{width:54px;height:54px;object-fit:contain}
.emm .fi svg.ic{stroke:#3d5a8a;fill:rgba(74,144,226,.12);stroke-width:2}
.fs button .ii{width:20px;height:20px;flex:none}
.fs button svg.ic{stroke:#666;fill:none;stroke-width:2}
.fs button.on svg.ic{stroke:#fff}
.est{flex:none;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#f3f4f6;border-top:1px solid #dfe1e6;font-size:12.5px;color:#666}
/* 계산기 */
.cl-{height:100%}
.ca{height:100%;display:flex;flex-direction:column;background:#eef0f2}
.cd{background:#f2f2f2;padding:8px 14px 0;height:118px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid #e0e0e0;flex:none}
.ch{display:flex;justify-content:space-between;color:#777;font-size:17px;min-height:24px;padding-bottom:6px}
.ce{background:#fff;height:46px;line-height:46px;padding:0 14px;font-size:21px;color:#444;overflow:hidden;text-align:left;flex:none;margin:0 -14px;padding-left:14px}
.ck{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:7px;padding:12px;min-height:0}
.ck button{background:#fafafa;border:1px solid #d9dadc;border-radius:3px;font-size:18px;color:#555}
.ck button.n{background:#d9dbdf}
.ck button:active{filter:brightness(.92)}
.ck button.eq{grid-column:5;grid-row:4/6;background:#4aa9d8;color:#fff;border-color:#4aa9d8;font-size:22px}
/* Sky Web */
.win.web .wtb{background:#0b5cb8;color:#fff}
.win.web .wc{color:#fff}
.tabs{display:flex;align-items:flex-end;height:40px;flex:1;min-width:0;padding-left:4px;gap:2px}
.tab{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(255,255,255,.2);color:#fff;border-radius:9px 9px 0 0;font-size:13px;max-width:200px;min-width:70px;flex:0 1 190px;overflow:hidden;white-space:nowrap}
.tab.on{background:#fff;color:#222}
.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;cursor:default}
.tab b{font-weight:400;cursor:pointer;width:18px;text-align:center}
.tabs .plus{width:28px;height:28px;margin-bottom:3px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;border:0;font-size:18px;line-height:1;flex:none}
.wv{display:flex;flex-direction:column;height:100%;background:#fff}
.wt{height:46px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid #e3e3e3}
.wt button{width:32px;height:32px;border-radius:50%;background:none;border:0;font-size:17px;color:#555}
.wt button:hover{background:#eee}
.wt input{flex:1;height:34px;border:0;border-radius:17px;background:#edf1f6;padding:0 16px;font-size:14px;outline:0;color:#222}
.wpg{flex:1;position:relative}
.wpg>div,.wpg>iframe{position:absolute;inset:0;width:100%;height:100%}
.wpg iframe{border:0;background:#fff}
.nt{overflow:auto;text-align:center;padding:60px 20px 20px;color:#333}
.nt h1{font-weight:400;font-size:40px;margin:0 0 22px;color:#0b5cb8;letter-spacing:.02em}
.nt form{max-width:540px;margin:0 auto 30px}
.nt input{width:100%;height:46px;border-radius:23px;border:1px solid #ddd;box-shadow:0 1px 6px rgba(0,0,0,.12);padding:0 22px;font-size:16px;outline:0}
.nt .sc{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:680px;margin:0 auto}
.nt .sc a{width:96px;text-decoration:none;color:#333;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px;border-radius:10px}
.nt .sc a:hover{background:#f0f2f5}
.nt .sc i{width:48px;height:48px;border-radius:50%;background:#e8ecf2;display:grid;place-items:center}
.nt .sc svg{width:26px;height:26px;stroke:#0b5cb8}
.nt p{font-size:12px;color:#888;margin-top:26px}
/* 설정 */
.st{display:flex;height:100%;background:#f5f6f7}
.sl{width:236px;flex:none;background:#fff;border-right:1px solid #ddd;overflow:auto}
.sl button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:13px 18px;font-size:15px;color:#444;text-align:left}
.sl button svg{width:20px;height:20px;stroke:#666;fill:none;stroke-width:1.7;flex:none}
.sl button.on{background:#5294e2;color:#fff}.sl button.on svg{stroke:#fff}
.sm{flex:1;display:flex;flex-direction:column;min-width:0}
.sh{height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#555;border-bottom:1px solid #e0e0e0;background:#f5f6f7;position:relative}
.sh .bk{position:absolute;left:8px;display:none;background:none;border:0;font-size:20px;color:#555}
.sc2{flex:1;overflow:auto;padding:18px 24px 30px;color:#3b3f45;font-size:14px}
.sc2 h5{margin:0 0 10px;font-size:14px;color:#555;display:flex;justify-content:space-between;align-items:center}
.kv{background:#fff;border:1px solid #dcdcdc;border-radius:6px}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:11px 16px;border-bottom:1px solid #eee}
.kv div:last-child{border:0}
.kv b{font-weight:500;color:#666;flex:none}
.kv span{text-align:right;word-break:break-all;color:#333}
.wg{background:#fff;border:1px solid #dcdcdc;border-radius:6px;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.th{cursor:pointer;text-align:center;font-size:13px;color:#555;position:relative}
.th .pv{height:84px;border-radius:7px;border:2px solid transparent;background-size:cover;background-position:center;position:relative;overflow:hidden}
.th .pv:after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(0,0,0,.75)}
.th.on .pv{border-color:var(--acc);box-shadow:0 0 0 2px rgba(74,144,226,.4)}
.th .pv.ph{height:96px}

/* 게임에뮬레이터 탐색창 : 파일 탐색기처럼 기종을 보고 골라서 실행합니다 (더블클릭 / Enter, 폰·태블릿은 한 번 터치) */
function openEmuExplorer(){
 const ALL=EMU();
 const CATS=[['all','전체 게임에뮬레이터','nes'],['c','게임기 · 아케이드','gb'],['p','윈도우 · DOS','win']];
 const KIND=x=>x.t==='p'?(x.id==='dos'?'DOS':'Windows'):(x.id==='mamegame'?'아케이드':'게임기');
 openWin({key:'emuexp',title:'게임에뮬레이터',icon:'nes',w:900,h:560,
  left:`<button class="tbb" id="xb" title="뒤로">‹</button><button class="tbb" id="xf" title="앞으로">›</button><span class="pth" id="xp"></span>`,
  right:`<button class="tbb" id="xq" title="검색">${SIC.pc.replace(/<rect.*<\/svg>/,'<circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/></svg>')}</button><button class="tbb" id="xv" title="보기 전환">☰</button>`,
  init(w){
   let cat='all',hist=['all'],hi=0,sel=null,lt=0,ltk='',list=false,filt='';
   w.body.innerHTML=`<div class="fm"><div class="fs" id="xsb"></div><div class="emm"><div class="eh" id="xh"><span>이름</span><span class="ey">발매</span><span class="et">종류</span></div><div class="fc" id="xcn"></div><div class="est"><span id="xn"></span><span id="xs"></span></div></div></div>`;
   const items=()=>ALL.filter(x=>(cat==='all'||x.t===cat)&&(!filt||(x.n+' '+x.id).toLowerCase().includes(filt)));
   const draw=()=>{
    const cn=CATS.find(c=>c[0]===cat);
    w.setTitle(cn[1]);
    $('#xp',w.el).innerHTML=`${SIC.home.replace('<svg','<svg class="ic"')}<span>${cat==='all'?'게임에뮬레이터':'게임에뮬레이터 / '+esc(cn[1])}</span>`;
    $('#xsb',w.body).innerHTML=CATS.map(c=>`<button class="${c[0]===cat?'on':''}" data-c="${c[0]}">${svg(c[2])}<span>${c[1]}</span></button>`).join('');
    const box=$('#xcn',w.body);box.className='fc'+(list?' lv':'');$('#xh',w.body).classList.toggle('on',list);
    const it=items();
    box.innerHTML=it.length?it.map(x=>`<div class="fi ${sel===x.id?'sel':''}" data-k="${x.id}" title="${esc(x.n)}">${svg(shape(x.id))}<span class="en">${esc(x.n)}${list?'':`<small>${x.s}</small>`}</span>${list?`<span class="ey">${x.s}</span><span class="et">${KIND(x)}</span>`:''}</div>`).join(''):'<div class="fe">검색 결과가 없어요</div>';
    $('#xn',w.body).textContent=it.length+'개 항목'+(filt?' (검색: '+filt+')':'');
    const cur=sel&&ALL.find(x=>x.id===sel);$('#xs',w.body).textContent=cur?cur.n+' 선택됨 · 더블클릭하면 실행':'';
   };
   const go=(c,push=true)=>{if(push){hist=hist.slice(0,hi+1);hist.push(c);hi=hist.length-1}cat=c;sel=null;filt='';draw()};
   const run=id=>{openEmuWin(id)};
   $('#xsb',w.body).onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.c)};
   $('#xcn',w.body).onclick=e=>{
    const it=e.target.closest('.fi');if(!it){sel=null;draw();return}
    const k=it.dataset.k,now=Date.now();
    if(mobile()||(ltk===k&&now-lt<450)){lt=0;run(k);return}
    sel=k;ltk=k;lt=now;$$('.fi',w.body).forEach(f=>f.classList.toggle('sel',f===it));
    const cur=ALL.find(x=>x.id===k);$('#xs',w.body).textContent=cur.n+' 선택됨 · 더블클릭하면 실행';
   };
   w.el.tabIndex=-1;
   w.el.addEventListener('keydown',e=>{if(e.key==='Enter'&&sel&&!e.target.closest('input')){e.preventDefault();run(sel)}});
   $('#xb',w.el).onclick=()=>{if(hi>0){hi--;go(hist[hi],false)}};
   $('#xf',w.el).onclick=()=>{if(hi<hist.length-1){hi++;go(hist[hi],false)}};
   $('#xv',w.el).onclick=e=>{list=!list;e.target.textContent=list?'▦':'☰';draw()};
   $('#xq',w.el).onclick=async()=>{const q=await promptD('검색','찾을 게임기 이름',filt);if(q!=null){filt=q.trim().toLowerCase();draw()}};
   draw();
  }});
}

function appCalc(){
 openWin({key:'calc',title:'계산기',icon:'calc',w:370,h:520,
  left:`<button class="tbb" id="cu">↶ 실행 취소</button>`,right:`<button class="tbb">기본 ▾</button>`,
  init(w){
   const K=['⌫','(',')','mod','π','7','8','9','÷','√','4','5','6','×','x²','1','2','3','−','=','0','.','%','+'];
   w.body.innerHTML=`<div class="ca"><div class="cd"><div class="ch"><span id="ch1"></span><span id="ch2"></span></div><div class="ce" id="ce">0</div></div><div class="ck" id="ck">${K.map(k=>`<button data-k="${k}" class="${/^[0-9]$/.test(k)?'n':''} ${k==='='?'eq':''}">${k}</button>`).join('')}</div></div>`;
   let ex='',st=[],done=false;
   const show=()=>{$('#ce',w.body).textContent=ex||'0'};
   const push=()=>st.push(ex);
   const calc=()=>{
    if(!ex)return;let s=ex.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/mod/g,' MOD ').replace(/%/g,'/100').replace(/ MOD /g,'%').replace(/π/g,'(Math.PI)').replace(/√\(/g,'Math.sqrt(').replace(/²/g,'**2');
    let o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;while(o-->0)s+=')';
    if(!/^[0-9+\-*\/%().\sMathPIsqrt]*$/.test(s)){$('#ce',w.body).textContent='오류';ex='';return}
    try{let r=Function('"use strict";return ('+s+')')();if(!isFinite(r))throw 0;r=+r.toPrecision(12);$('#ch1',w.body).textContent=ex;$('#ch2',w.body).textContent='= '+r;push();ex=String(r);done=true;show()}catch(e){$('#ce',w.body).textContent='오류';ex='';done=true}
   };
   const press=k=>{
    if(k==='='){calc();return}
    if(k==='⌫'){push();ex=ex.replace(/(mod|√\(|.)$/,'');done=false;show();return}
    push();const op=/^[÷×−+%]|mod$/.test(k);
    if(done&&!op&&k!=='x²')ex='';done=false;
    if(k==='x²')ex+='²';else if(k==='√')ex+='√(';else if(k==='π'&&/[\d)π]$/.test(ex))ex+='×π';else ex+=k;
    show();};
   $('#ck',w.body).onclick=e=>{const b=e.target.closest('button');if(b)press(b.dataset.k)};
   $('#cu',w.el).onclick=()=>{if(st.length){ex=st.pop();show()}};
   w.el.addEventListener('keydown',e=>{const m={'*':'×','/':'÷','-':'−'};if(/^[0-9.+()%]$/.test(e.key))press(e.key);else if(m[e.key]){e.preventDefault();press(m[e.key])}else if(e.key==='Enter'||e.key==='='){e.preventDefault();press('=')}else if(e.key==='Backspace')press('⌫')});
   w.el.tabIndex=-1;w.el.style.outline='0';w.el.focus();
  }});
}

async function gh(g,m,path,body){const u=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`+(m==='GET'?`?ref=${encodeURIComponent(g.branch)}&t=${Date.now()}`:'');
 const r=await fetch(u,{method:m,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+g.token,'X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
 if(r.status===401){const c=ghCfg();c.token='';LS.s(GHK,c);throw Error('토큰이 올바르지 않거나 만료됐어요. 다시 인증해 주세요.')}

<script>
(function(){

if(window.top!==window||window.__dsBar)return;

function render(){

    var el=bar.querySelector('[data-k="'+a[0]+'"]'),on=!!S[a[0]];
    el.classList.toggle('on',on);el.classList.toggle('off',!on);
    el.title=a[2]+(on?' · 연결됨':' · 미연결')+(a[3]?' (탭하여 연결)':'');
  });

/* ---------- 배터리 ---------- */
function paintBatt(){
  var f=bar.querySelector('.bat b'),p=bar.querySelector('.bp'),w=bar.querySelector('.bw');
  if(!batt){p.textContent='--';f.style.width='0';w.title='이 브라우저는 배터리 정보를 제공하지 않습니다';return}
  var l=Math.round(batt.level*100);
  f.style.width=l+'%';f.style.background=l<=20?'#ef4444':l<=50?'#f5b301':'#2bdc5b';
  p.textContent=(batt.charging?'⚡':'')+l+'%';
  w.title='배터리 '+l+'%'+(batt.charging?' · 충전 중':'');
}
function onBatt(){
  paintBatt();
  if(ls(KEY)||!batt)return; /* 사용자가 직접 정했으면 자동 전환 안 함 */
  var low=batt.level<=0.2&&!batt.charging;
  if(low&&!saver){autoSaver=true;setSaver(true);toast('배터리 20% 이하 · 절전 모드 켜짐')}
  else if(!low&&autoSaver&&saver){autoSaver=false;setSaver(false)}
}

  navigator.getBattery().then(function(b){
    batt=b;['levelchange','chargingchange'].forEach(function(e){b.addEventListener(e,onBatt)});onBatt();
  }).catch(function(){});
}

/* ---------- 게임패드 ---------- */
function scanPads(){
  var c=0;
  try{var g=origGP?origGP():[];for(var i=0;i<g.length;i++)if(g[i]&&g[i].connected)c++}catch(e){}
  var v=c>0?1:0;if(S.pad!==v){S.pad=v;render()}
}
addEventListener('gamepadconnected',scanPads);
addEventListener('gamepaddisconnected',function(){setTimeout(scanPads,50)});

/* 절전 모드: 게임패드가 없으면 getGamepads()를 호출해도 장치 조회를 하지 않음 */
function patchGP(w){
  try{
    var n=w.navigator;if(!n||!n.getGamepads||n.__dsP)return;
    var o=(w===window&&origGP)?origGP:n.getGamepads.bind(n);
    n.__dsP=1;
    Object.defineProperty(n,'getGamepads',{configurable:true,writable:true,value:function(){
      return (saver&&!S.pad)?[null,null,null,null]:o();
    }});
  }catch(e){}
}
function patchAll(){
  patchGP(window);
  var f=document.querySelectorAll('iframe');
  for(var i=0;i<f.length;i++){try{patchGP(f[i].contentWindow)}catch(e){}}
}
document.addEventListener('load',function(e){
  var t=e.target;if(t&&t.tagName==='IFRAME'){try{patchGP(t.contentWindow)}catch(x){}}
},true);

/* 절전 모드: 화면에 상호작용 없는 장식 캔버스(눈, 배경효과 등) 숨김 */
function hideDeco(on){
  var c=document.querySelectorAll('canvas');
  for(var i=0;i<c.length;i++){
    var el=c[i];
    if(on){
      if(el.dataset.dsH)continue;
      var cs=getComputedStyle(el);
      if(cs.position==='fixed'&&cs.pointerEvents==='none'){el.dataset.dsH=el.style.display||'-';el.style.display='none'}
    }else if(el.dataset.dsH){
      el.style.display=el.dataset.dsH==='-'?'':el.dataset.dsH;delete el.dataset.dsH;
    }
  }
}
function padPoll(){
  if(!saver&&!padIv&&origGP){padIv=setInterval(scanPads,2500)}
  else if(saver&&padIv){clearInterval(padIv);padIv=0}
}
function setSaver(v){
  saver=!!v;
  document.documentElement.classList.toggle('ds-saver',saver);
  patchAll();hideDeco(saver);padPoll();render();
}

/* ---------- 마우스 / 키보드 ---------- */
var mq=window.matchMedia?matchMedia('(any-pointer:fine) and (any-hover:hover)'):null;
function msUpd(){S.ms=(mq&&mq.matches)||S.msSeen?1:0;render()}
if(mq){if(mq.addEventListener)mq.addEventListener('change',msUpd);else if(mq.addListener)mq.addListener(msUpd)}
function msSeen(e){
  if(e.pointerType==='mouse'&&e.isTrusted){S.msSeen=1;removeEventListener('pointermove',msSeen,true);msUpd()}
}

var kbT=0,kbLast=0;

  if(!S.kb){S.kb=1;render()}
  var t=Date.now();
  if(t-kbLast>1500){kbLast=t;clearTimeout(kbT);kbT=setTimeout(function(){S.kb=0;render()},300000)}
},true);

/* ---------- USB / OTG / HID ---------- */
function refreshWired(){
  var n=0,p=[];
  try{if(navigator.usb)p.push(navigator.usb.getDevices().then(function(l){n+=l.length},function(){}))}catch(e){}
  try{if(navigator.hid)p.push(navigator.hid.getDevices().then(function(l){n+=l.length},function(){}))}catch(e){}
  Promise.all(p).then(function(){S.usb=(!isAndroid&&n>0)?1:0;S.otg=(isAndroid&&n>0)?1:0;render()});
}
['usb','hid'].forEach(function(k){
  try{if(navigator[k]){navigator[k].addEventListener('connect',refreshWired);navigator[k].addEventListener('disconnect',refreshWired)}}catch(e){}
});
async function wiredPair(){
  try{
    if(navigator.usb)await navigator.usb.requestDevice({filters:[]});
    else if(navigator.hid)await navigator.hid.requestDevice({filters:[]});
    else{toast('이 브라우저는 USB/OTG 연결을 지원하지 않습니다');return}
  }catch(e){if(!e||e.name!=='NotFoundError')toast('USB/OTG 연결 실패')}
  refreshWired();
}

/* ---------- 블루투스 ---------- */
var btDevs=[];
function btRefresh(){
  var c=0;btDevs.forEach(function(d){if(d.gatt&&d.gatt.connected)c++});
  S.bt=c>0?1:0;render();
}
function btAdd(d){if(btDevs.indexOf(d)<0){btDevs.push(d);d.addEventListener('gattserverdisconnected',btRefresh)}}
if(navigator.bluetooth&&navigator.bluetooth.getDevices){
  navigator.bluetooth.getDevices().then(function(l){l.forEach(btAdd);btRefresh()}).catch(function(){});
}
async function btPair(){
  if(!navigator.bluetooth){toast('이 브라우저는 블루투스 연결을 지원하지 않습니다');return}
  try{
    var d=await navigator.bluetooth.requestDevice({acceptAllDevices:true});
    btAdd(d);if(d.gatt)await d.gatt.connect();
    btRefresh();toast((d.name||'블루투스 장치')+' 연결됨');
  }catch(e){if(!e||e.name!=='NotFoundError')toast('블루투스 연결 실패')}
}

/* ---------- 클릭 ---------- */
bar.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='sv'){var v=!saver;ls(KEY,v?'on':'off');autoSaver=false;setSaver(v);toast(v?'절전 모드 켜짐 · 연결된 장치만 사용':'절전 모드 꺼짐')}
  else if(a==='pair')btPair();
  else if(a==='wired')wiredPair();
});

svb.addEventListener('click',function(){var v=!saver;ls(KEY,v?'on':'off');autoSaver=false;setSaver(v);toast(v?'절전 모드 켜짐 · 연결된 장치만 사용':'절전 모드 꺼짐')});

/* ---------- 시작 ---------- */
msUpd();refreshWired();scanPads();
setSaver(ls(KEY)==='on');
})();
</script>
