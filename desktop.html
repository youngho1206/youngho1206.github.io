<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap');
/* emulator */
#emu{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#emu.show{display:flex;animation:zoom .5s cubic-bezier(.2,.9,.3,1)}
@keyframes zoom{from{opacity:0;transform:scale(.94)}}
#bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:rgba(14,13,12,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);overflow-x:auto;scrollbar-width:none;transition:margin .35s}
#bar::-webkit-scrollbar{display:none}
#bar.hide{margin-top:-70px}
#bar .t{flex:1;min-width:90px;font:600 18px var(--serif);letter-spacing:.04em;color:var(--acc2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);padding:8px 13px;border-radius:99px;font:500 12px var(--sans);letter-spacing:.04em;cursor:pointer;white-space:nowrap;transition:.25s}
#bar button:hover{border-color:var(--acc);color:var(--acc2);background:rgba(212,175,106,.08)}
#bar button:active{transform:scale(.94)}
#bar button:disabled{opacity:.3;pointer-events:none}
#stage{flex:1;position:relative;min-height:0}
#fr{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:radial-gradient(circle at 50% 38%,#1d1a12,#060608 70%);z-index:2}
#drop.hidden{display:none}
#drop .big{width:min(36vw,132px);aspect-ratio:1;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(0,0,0,.65))}
#drop .big svg,#drop .big img{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-9px)}}
#drop h2{margin:6px 0 0;font:600 clamp(24px,4vw,36px) var(--serif);letter-spacing:.04em;color:var(--acc2)}
#drop p{margin:0;color:var(--mut);font-size:12.5px;font-weight:300;letter-spacing:.03em;max-width:420px;line-height:1.7}
.btn{border:0;background:linear-gradient(135deg,var(--acc2),var(--acc) 60%,#a98240);color:#1a1409;font:600 14px var(--sans);letter-spacing:.08em;padding:14px 32px;border-radius:99px;cursor:pointer;box-shadow:0 10px 30px rgba(212,175,106,.3),inset 0 1px 0 rgba(255,255,255,.5);transition:.3s;margin-top:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(212,175,106,.45),inset 0 1px 0 rgba(255,255,255,.5)}
#drop.over{outline:1px dashed var(--acc);outline-offset:-16px}
#fab{display:none;position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(14,13,12,.7);color:var(--acc2);font-size:17px;backdrop-filter:blur(8px)}
#emu.nobar #fab{display:block}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:rgba(18,16,12,.9);border:1px solid var(--line);color:var(--acc2);padding:11px 22px;border-radius:99px;font-size:12.5px;letter-spacing:.04em;opacity:0;transition:.4s;z-index:50;backdrop-filter:blur(12px);pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#rot{display:none;position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.88);color:var(--acc2);align-items:center;justify-content:center;flex-direction:column;gap:10px;font:600 20px var(--serif);letter-spacing:.06em}
#rot span{font-size:54px;animation:rt 2s ease-in-out infinite}
@keyframes rt{50%{transform:rotate(-90deg)}}
body.mob.fs.port #rot{display:flex}
#emu.pfs{z-index:1000}
@media (max-width:520px){#bar button{padding:8px 11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.app,.eyebrow,.orn,header p{opacity:1}}
#pc{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#pc.show{display:flex;animation:zoom .5s cubic-bezier(.2,.9,.3,1)}
#pbar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:rgba(14,13,12,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);overflow-x:auto;scrollbar-width:none;transition:margin .35s}
#pbar::-webkit-scrollbar{display:none}
#pbar.hide{margin-top:-70px}
#pbar .t{flex:1;min-width:90px;font:600 18px var(--serif);letter-spacing:.04em;color:var(--acc2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar button{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);padding:8px 13px;border-radius:99px;font:500 12px var(--sans);letter-spacing:.04em;cursor:pointer;white-space:nowrap;transition:.25s}
#pbar button:hover{border-color:var(--acc);color:var(--acc2);background:rgba(212,175,106,.08)}
#pbar button:active{transform:scale(.94)}
#pbar button:disabled{opacity:.3;pointer-events:none}
#pc.nobar #fab{display:block}
#pc.pfs{z-index:1000}
@media (max-width:520px){#pbar button{padding:8px 11px}}
#pstage{flex:1;position:relative;min-height:0;background:#000}
#vscreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#vscreen canvas{width:100%!important;height:100%!important;object-fit:contain}
/* 해상도 최적화 모드 */
#fr.rs{margin:auto!important;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 40px rgba(0,0,0,.6)}
#vscreen.rs canvas{width:var(--rw)!important;height:var(--rh)!important;max-width:none;object-fit:fill;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
/* 해상도 선택창 */
#resdlg{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#resdlg.on{display:flex}
#resdlg .rbox{width:min(440px,100%);max-height:100%;overflow:auto;text-align:center;padding:26px 22px 20px;border-radius:22px;border:1px solid var(--line);background:rgba(20,18,14,.96);box-shadow:0 24px 70px rgba(0,0,0,.7);color:var(--fg);font-family:var(--sans)}
#resdlg h3{margin:0 0 6px;font:600 20px/1.4 var(--serif);color:var(--acc2);word-break:keep-all}
#resdlg p{margin:0 0 16px;font-size:13.5px;line-height:1.7;color:var(--mut);word-break:keep-all}
#resdlg .ropt{display:block;width:100%;margin:8px 0 0;padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);font:600 15px var(--sans);cursor:pointer;transition:.2s}
#resdlg .ropt small{display:block;margin-top:3px;font:400 11.5px var(--sans);color:var(--mut)}
#resdlg .ropt:hover,#resdlg .ropt.cur{border-color:var(--acc);color:var(--acc2);background:rgba(212,175,106,.1)}
#resdlg .ropt:active{transform:scale(.97)}
#resdlg label.rskip{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none}
#resdlg label.rskip input{width:18px;height:18px;accent-color:var(--acc)}
#resdlg .rclose{margin-top:10px;border:0;background:none;color:var(--mut);font:400 12px var(--sans);cursor:pointer;text-decoration:underline}
#resdlg .rwarn{display:none}
#resdlg.warn .rwarn{display:block}
#resdlg.warn .rmain{display:none}
#resdlg .rwarn .ico{font-size:34px;margin-bottom:6px}
#resdlg .rback{margin-top:8px;border:1px solid var(--line);background:none;color:var(--fg);padding:11px;width:100%;border-radius:14px;font:500 14px var(--sans);cursor:pointer}
#mhint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;pointer-events:none;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 16px;font-size:12.5px;white-space:nowrap;display:none}
#mhint.on{display:block}
#vscreen.mlock,#vscreen.mlock *{cursor:none!important}
#pmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:radial-gradient(circle at 50% 38%,#1d1a12,#060608 70%);z-index:2}
#pmsg.hidden{display:none}
#pmsg .big{width:min(34vw,120px);aspect-ratio:1;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(0,0,0,.65))}
#pmsg .big svg,#pmsg .big img{width:100%;height:100%;display:block}
#pmsg h2{margin:4px 0 0;font:600 clamp(24px,4vw,34px) var(--serif);color:var(--acc2)}
#pmsg p{margin:0;color:var(--mut);font-size:13px;font-weight:300;line-height:1.8;max-width:460px}
#pmsg b{color:var(--acc2);font-weight:500}
.sec{font:600 clamp(22px,3.6vw,32px) var(--serif);color:var(--acc2);letter-spacing:.06em;text-align:center;margin:34px 0 22px}
.sec small{display:block;font:300 11px var(--sans);letter-spacing:.35em;color:var(--mut);margin-top:8px;text-transform:uppercase}
.st{display:block;font:normal 11px var(--sans);color:var(--mut);margin-top:7px;min-height:14px}
.pb{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}

#loadbox{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(92vw,460px);box-sizing:border-box;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(12,12,14,.94);backdrop-filter:blur(16px);z-index:2000;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.9,.3,1);font:12px var(--sans);text-align:left}
#loadbox.on{transform:translate(-50%,0)}
#loadbox b{display:block;color:var(--acc2);font-weight:600;margin-bottom:4px}
#loadbox span{display:block;color:var(--mut);line-height:1.6}
#loadbox .loadbar{display:block;height:4px;margin-top:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
#loadbox .loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .2s}
.loadspin{display:inline-block;width:11px;height:11px;margin-right:7px;border:2px solid rgba(255,255,255,.18);border-top-color:var(--acc2);border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 가상 키보드 (iOS 26 · 투명 글래스 스타일) ===== */
#pbar button.on{border-color:var(--acc);color:var(--acc2);background:rgba(212,175,106,.14)}
#vk{--gap:4px;--kh:46px;--fs:17px;--a:.14;--vkf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
 position:absolute;z-index:6;left:0;top:0;display:none;box-sizing:border-box;width:600px;padding:calc(var(--gap)*1.2) calc(var(--gap)*1.4) calc(var(--gap)*1.4);
 border-radius:clamp(18px,calc(var(--kh)*.62),36px);
 background:linear-gradient(180deg,rgba(255,255,255,calc(var(--a) + .05)),rgba(255,255,255,calc(var(--a) - .05))),rgba(22,24,32,.2);
 -webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);
 border:1px solid rgba(255,255,255,.32);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.1),inset 0 0 26px rgba(255,255,255,.07),0 22px 54px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25);
 touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--vkf)}
#vk.show{display:block;animation:vkin .3s cubic-bezier(.2,.9,.3,1)}
@keyframes vkin{from{opacity:0;transform:translateY(16px) scale(.98)}}
#vk .vkh{display:flex;align-items:center;gap:calc(var(--gap)*1.5);height:max(26px,calc(var(--kh)*.62));padding:0 calc(var(--gap)*.8);cursor:grab;touch-action:none}
#vk .vkh:active{cursor:grabbing}
#vk .vkg{flex:1;display:flex;justify-content:center;pointer-events:none}
#vk .vkg:before{content:"";width:max(36px,calc(var(--kh)*1.1));height:5px;border-radius:5px;background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.25)}
#vk .vkh button{flex:none;border:1px solid rgba(255,255,255,.28);color:#fff;height:calc(100% - 4px);min-width:calc(var(--kh)*.8);padding:0 calc(var(--fs)*.6);border-radius:99px;
 background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);font:600 calc(var(--fs)*.72) var(--vkf);letter-spacing:0;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#vk .vkh button:active{background:rgba(255,255,255,.5);transform:scale(.94)}
#vk .vkh button.on{background:rgba(255,255,255,.85);color:#10131a;text-shadow:none}
#vk .vkr{display:flex;width:100%}
#vk .vkr.off{display:none}
#vk .kw{flex:0 0 auto;width:calc(var(--w)/15*100%);padding:calc(var(--gap)/2);touch-action:none}
#vk .k{position:relative;box-sizing:border-box;height:var(--kh);display:flex;align-items:center;justify-content:center;border-radius:max(7px,calc(var(--kh)*.27));
 background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.24);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.3);
 color:#fff;font:500 var(--fs)/1 var(--vkf);text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;overflow:visible;transition:transform .08s,background .12s,color .12s}
#vk .kw.s .k{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.08))}
#vk .kw.m .k{font-size:calc(var(--fs)*.74);font-weight:600}
#vk .kw.sp .k{font-size:calc(var(--fs)*.78);color:rgba(255,255,255,.85)}
#vk .kw.dn .k{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.48));color:#10131a;text-shadow:none;transform:scale(.94)}
#vk .kw.on .k{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.74));color:#10131a;text-shadow:none}
#vk .kw.lock .k:before{content:"";position:absolute;top:max(3px,calc(var(--kh)*.1));right:max(4px,calc(var(--kh)*.12));width:max(5px,calc(var(--kh)*.12));height:max(5px,calc(var(--kh)*.12));border-radius:50%;background:#30d158;box-shadow:0 0 6px #30d158}
#vk .kw.pop.dn .k:after{content:attr(data-p);position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);min-width:calc(100% + 16px);height:calc(var(--kh)*1.2);display:flex;align-items:center;justify-content:center;
 border-radius:max(10px,calc(var(--kh)*.3));background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#10131a;font-size:calc(var(--fs)*1.7);font-weight:500;text-shadow:none;box-shadow:0 8px 22px rgba(0,0,0,.38);pointer-events:none;z-index:3}
@media (prefers-reduced-motion:reduce){#vk.show{animation:none}#vk .k{transition:none}}
@media (hover:none){#vk .vkh{cursor:default}}

#dl{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,130%);width:min(92vw,470px);background:rgba(18,16,12,.93);border:1px solid var(--line);border-radius:18px;padding:12px 16px;z-index:40;backdrop-filter:blur(14px);transition:transform .5s cubic-bezier(.2,.9,.3,1);font-size:12.5px}
#dl.on{transform:translate(-50%,0)}
#dl b{color:var(--acc2);font-weight:500}
#dl .pb{height:4px;margin:8px 0}
#dl span{color:var(--mut);display:block;line-height:1.7}
/* ===== 기타기능 · iOS 스타일 알림 ===== */
#etcgrid .app .ico svg{border-radius:22.5%}
#ioa{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#ioa.on{opacity:1;visibility:visible;transition-delay:0s}
#ioa .ioa-box{width:min(270px,80vw);border-radius:14px;overflow:hidden;text-align:center;color:#fff;background:rgba(44,44,48,.82);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(1.12);opacity:0;transition:transform .25s cubic-bezier(.2,1.2,.4,1),opacity .2s;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
#ioa.on .ioa-box{transform:scale(1);opacity:1}
#ioa .ioa-body{padding:20px 16px 18px}
#ioa b{display:block;font-size:17px;font-weight:600;margin-bottom:5px}
#ioa p{margin:0;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.88)}
#ioa button{display:block;width:100%;border:0;border-top:.5px solid rgba(255,255,255,.25);background:none;color:#0a84ff;font-weight:600;font-size:17px;font-family:inherit;padding:12px 0;cursor:pointer}
#ioa button:active{background:rgba(255,255,255,.12)}
#loadbox,#dl{visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.3,1),visibility 0s .4s}
#loadbox.on,#dl.on{visibility:visible;transition-delay:0s}
#win{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:4vh 4vw;background:rgba(4,4,6,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#win.on{display:flex;animation:zoom .45s cubic-bezier(.2,.9,.3,1)}
#win .w{display:flex;flex-direction:column;width:min(960px,100%);height:min(88vh,780px);overflow:hidden;border:1px solid var(--line);border-radius:30px;background:#0b0a0d;box-shadow:0 44px 110px rgba(0,0,0,.75)}
#win .wh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 14px 26px;border-bottom:1px solid var(--line)}
#win .wh b{font:600 20px var(--serif);color:var(--acc2);letter-spacing:.05em}
#win .wh button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);padding:9px 18px;border-radius:99px;font:500 13px var(--sans);cursor:pointer;transition:.3s}
#win .wh button:hover{border-color:var(--acc);color:var(--acc2)}
#win iframe{flex:1;width:100%;border:0;background:#0b0a0d}
</style>

<div class="arc">
 <div class="frame" id="frame">
  <header class="hd">

const store={},mb=b=>(b/1048576).toFixed(1)+'MB',fmt=s=>(isFinite(s)&&s>=0)?Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0'):'--:--';

/* 서버에 이미지가 있는지 확인: HEAD 대신 Range GET 사용 (HEAD/Content-Length가 막힌 서버에서도 동작) */
async function probe(p){
 for(const e of ['img','zip','iso']){
  const u=`os/${p.id}/${p.id}.${e}`;
  try{
   const ac=new AbortController();
   const r=await fetch(u,{headers:{Range:'bytes=0-0'},cache:'no-store',signal:ac.signal});
   const ct=r.headers.get('content-type')||'';let size=0;
   if(r.status===206){const m=(r.headers.get('content-range')||'').match(/\/(\d+)\s*$/);size=m?+m[1]:0}
   else if(r.ok)size=+r.headers.get('content-length')||0;
   const ok=r.ok&&!/html/i.test(ct);
   try{ac.abort()}catch(_){}
   if(ok)return{u,size};
  }catch(_){}
 }
 return null;
}
let _cache;
const getCache=()=>_cache||(_cache=(self.caches?(caches.delete('cyh-os').catch(()=>0),caches.open('cyh-os2')):Promise.resolve(null)).catch(()=>null));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function fetchBlob(f,onProg){
 let err;
 for(let t=0;t<3;t++){
  try{
   const r=await fetch(f.u,{cache:'no-cache'});
   if(!r.ok)throw Error('서버 응답 '+r.status);
   const total=f.size||+r.headers.get('content-length')||0;
   if(!r.body||!r.body.getReader){const b=await r.blob();onProg(b.size,total||b.size);return b}
   const rd=r.body.getReader(),parts=[];let got=0;
   for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onProg(got,total)}
   return new Blob(parts);
  }catch(e){err=e;if(t<2)await sleep(700*(t+1))}
 }
 throw err;
}
/* 이미지 한 개 불러오기 (캐시 사용, 실패 시 3회 재시도). 끝나면 항상 fin() 호출 → 대기 중인 부팅이 멈추지 않음 */
async function loadOne(p,f,prog){
 const s=store[p.id];s.name=f.u;s.state='load';s.err='';s.got=0;s.total=f.size||0;
 try{
  const cache=await getCache();let blob=null;
  try{const hit=cache&&await cache.match(f.u);if(hit&&f.size){const b=await hit.blob();if(b.size===f.size)blob=b}}catch(_){}
  if(!blob){
   badge(p.id,'받는 중…',0);
   blob=await fetchBlob(f,(got,total)=>{s.got=got;s.total=total;if(total)badge(p.id,Math.min(99,Math.floor(got/total*100))+'%',Math.min(99,got/total*100));else badge(p.id,mb(got),50);prog&&prog(got,total)});
   try{cache&&await cache.put(f.u,new Response(blob))}catch(_){}
  }
  s.blob=blob;s.state='ok';badge(p.id,'준비됨 · '+mb(blob.size),100);
 }catch(e){s.state='err';s.err=e&&e.message||'알 수 없는 오류';badge(p.id,'불러오기 실패',0)}

async function preload(){

  const found=[];
  await Promise.all(P.map(async p=>{const f=await probe(p);
   if(f)found.push({p,f});else{store[p.id].state='none';badge(p.id,'이미지 없음',0);store[p.id].fin()}}));
  if(!found.length)return;
  found.sort((a,b)=>a.f.size-b.f.size);
  const tot=found.reduce((x,y)=>x+y.f.size,0),dl=$('#dl');let base=0;
  found.forEach(({p})=>{store[p.id].state='queue';badge(p.id,'대기 중')});

   const s=store[p.id],t0=performance.now();let last=0;
   const prog=(got,total)=>{const now=performance.now();if(now-last<200)return;last=now;
    const sp=got/Math.max(.001,(now-t0)/1000),all=base+got,pct=total?Math.min(99,Math.floor(got/total*100)):0;
    const rem=total&&sp>0?`이 파일 남은 시간 <b>${fmt((total-got)/sp)}</b>`:'남은 시간 계산 중';
    dl.innerHTML=`<b>${p.n}</b> 불러오는 중${total?' · '+pct+'%':''}<i class="pb"><i style="width:${pct}%"></i></i><span>${mb(got)}${total?' / '+mb(total):''} · ${mb(sp)}/s · ${rem}`+(tot?`<br>전체 ${Math.min(99,Math.round(all/tot*100))}% · 전체 남은 시간 <b>${fmt((tot-all)/sp)}</b>`:'')+`</span>`};
   if(s.state==='queue')await loadOne(p,f,prog);else await s.prom;
   base+=f.size;
  }
  const bad=found.filter(x=>store[x.p.id].state==='err');
  dl.innerHTML=bad.length?`<b>⚠ ${bad.map(x=>x.p.n).join(', ')} 불러오기 실패</b><span>해당 OS를 눌러 시작하면 자동으로 다시 시도합니다.</span>`:'<b>✓ 모든 이미지 준비 완료</b>';
  setTimeout(()=>dl.classList.remove('on'),bad.length?6000:2500);
 }catch(e){console.error(e)}

}

addEventListener('popstate',()=>{if(window.pcfsOn&&pcfsOn()){history.pushState({pc:1},'');pcExitFs();return}if($('#pc').classList.contains('show'))A.quit()});

<script src="arcade.js"></script>
<script>
/* ---------- 기능 창(지도·메모·계산기) ---------- */
function winOpen(it){document.getElementById('wt').textContent=it.n;document.getElementById('wf').src=it.href;document.getElementById('win').classList.add('on')}
function winClose(){document.getElementById('win').classList.remove('on');document.getElementById('wf').src='about:blank'}
document.getElementById('wx').onclick=winClose;
document.getElementById('wf').addEventListener('load',function(){
 try{if(this.src==='about:blank')return;
  this.contentDocument.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href="index.html"]');if(a){e.preventDefault();e.stopPropagation();winClose()}},true)}catch(_){}
});
document.getElementById('win').addEventListener('click',e=>{if(e.target.id==='win')winClose()});
addEventListener('keydown',e=>{if(e.key==='Escape')winClose()});

/* ===== 해상도 최적화: 에뮬레이터를 열면 크기 선택창 표시 (640×480 / 800×600 / 원본) ===== */
(function(){
 const SZ={'640':[640,480],'800':[800,600]};
 const NM={full:'원본',800:'800×600',640:'640×480'};
 let mode='full',skip=false;
 try{mode=localStorage.getItem('resMode')||'full';skip=localStorage.getItem('resSkip')==='1'}catch(_){}
 if(!NM[mode])mode='full';
 const $$=id=>document.getElementById(id);
 function save(){try{localStorage.setItem('resMode',mode);localStorage.setItem('resSkip',skip?'1':'0')}catch(_){}}
 function fitBox(stage){
  const sz=SZ[mode];if(!sz||!stage)return null;
  const sw=stage.clientWidth,sh=stage.clientHeight;if(!sw||!sh)return null;
  const k=Math.min(1,sw/sz[0],sh/sz[1]);
  return [Math.floor(sz[0]*k),Math.floor(sz[1]*k)];
 }
 function apply(){
  const fr=$$('fr'),vs=$$('vscreen');
  const b1=fitBox($$('stage')),b2=fitBox($$('pstage'));
  if(b1){fr.classList.add('rs');fr.style.width=b1[0]+'px';fr.style.height=b1[1]+'px'}
  else{fr.classList.remove('rs');fr.style.width='';fr.style.height=''}
  if(b2){vs.classList.add('rs');vs.style.setProperty('--rw',b2[0]+'px');vs.style.setProperty('--rh',b2[1]+'px')}
  else{vs.classList.remove('rs')}
  ['bRes','pRes'].forEach(id=>{const e=$$(id);if(e){e.textContent='🖥 해상도 · '+NM[mode];e.classList.toggle('on',mode!=='full')}});
 }
 /* 선택창 만들기 */
 const dlg=document.createElement('div');dlg.id='resdlg';dlg.setAttribute('role','dialog');dlg.setAttribute('aria-modal','true');
 dlg.innerHTML='<div class="rbox">'
  +'<div class="rmain"><h3>🖥 해상도 선택</h3><p>게임 화면의 해상도의 유지를 위해 원하는 크기를 선택하세요.</p>'
  +'<button type="button" class="ropt" data-m="640">640 × 480<small>작고 선명하게 (4:3)</small></button>'
  +'<button type="button" class="ropt" data-m="800">800 × 600<small>조금 더 크게 (4:3)</small></button>'
  +'<button type="button" class="ropt" data-m="full">원본상태로 플레이 하기<small>화면 크기에 맞춰 꽉 채움</small></button>'
  +'<label class="rskip"><input type="checkbox" id="resSkip"> 다시는 이 창 안보기</label>'
  +'<button type="button" class="rclose" id="resClose">닫기</button><div style="margin-top:8px;font-size:10.5px;color:#6f6c63">버전 2026-10-09 · 중앙정렬 수정판</div></div>'
  +'<div class="rwarn"><div class="ico">⚠️</div><h3>원본 상태 안내</h3><p>원본 상태에서 플레이 하면 화면크기에 따라 화면이 잘 안나올 수 있습니다.</p>'
  +'<button type="button" class="ropt" id="resOk">확인</button><button type="button" class="rback" id="resBack">← 다시 선택</button></div>'
  +'</div>';
 function host(){return $$('pc').classList.contains('show')?$$('pc'):$$('emu')}
 function open(){
  host().appendChild(dlg);dlg.classList.remove('warn');
  $$('resSkip').checked=skip;
  dlg.querySelectorAll('.ropt[data-m]').forEach(b=>b.classList.toggle('cur',b.dataset.m===mode));
  dlg.classList.add('on');
 }
 function close(){dlg.classList.remove('on','warn')}
 function choose(m){
  mode=m;skip=$$('resSkip').checked;save();apply();close();
  toast('🖥 해상도: '+NM[m]);
 }
 dlg.addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='resClose')return close();
  if(b.id==='resBack')return dlg.classList.remove('warn');
  if(b.id==='resOk')return choose('full');
  if(b.dataset.m==='full')return dlg.classList.add('warn');
  if(b.dataset.m)choose(b.dataset.m);
 });
 $$('bRes').onclick=open;
 try{A.res=open}catch(_){}
 /* 에뮬레이터가 열릴 때(게임목록에서 기종 선택) 선택창 표시 */
 ['emu','pc'].forEach(id=>{
  const el=$$(id);let was=el.classList.contains('show');
  new MutationObserver(()=>{
   const now=el.classList.contains('show');
   if(now&&!was&&!skip)setTimeout(open,350);
   if(!now&&was&&dlg.parentNode===el)close();
   was=now;setTimeout(apply,60);
  }).observe(el,{attributes:true,attributeFilter:['class']});
 });
 if(window.ResizeObserver){const ro=new ResizeObserver(apply);ro.observe($$('stage'));ro.observe($$('pstage'))}
 ['resize','orientationchange','fullscreenchange','webkitfullscreenchange'].forEach(v=>addEventListener(v,()=>setTimeout(apply,80)));
 apply();
})();
</script>
