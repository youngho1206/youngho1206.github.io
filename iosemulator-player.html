<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>iOS 에뮬레이터 화면</title>
<style>
/* 아이폰·아이패드 전용 실행 화면 : iosemulator.html 안에서만 사용합니다. (직접 열지 마세요) */
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hidectl .ejs_virtualGamepad_parent,.hidectl .ejs_menu_bar{display:none!important}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function(){
 var P=window.parent,logs=[];
 function send(m){try{P.postMessage(m,location.origin)}catch(e){}}
 function log(s){logs.push(String(s).slice(0,240));if(logs.length>40)logs.shift()}

 /* 오류를 모아 두었다가 iosemulator.html 메뉴의 '진단'에서 보여 줍니다 */
 addEventListener('error',function(e){log('오류: '+(e.message||'')+' '+String(e.filename||'').split('/').pop()+':'+(e.lineno||''))});
 addEventListener('unhandledrejection',function(e){log('약속 거부: '+(e.reason&&e.reason.message||e.reason))});
 var ce=console.error;
 console.error=function(){try{log('console.error: '+[].slice.call(arguments).join(' '))}catch(_){}try{ce.apply(console,arguments)}catch(_){}};

 function diag(){
  var c=document.createElement('canvas'),gl2=false,gl1=false;
  try{gl2=!!c.getContext('webgl2')}catch(_){}
  try{gl1=!!(c.getContext('webgl')||c.getContext('experimental-webgl'))}catch(_){}
  return{
   ua:navigator.userAgent,
   wasm:typeof WebAssembly==='object',
   webgl2:gl2,webgl1:gl1,
   sab:typeof SharedArrayBuffer!=='undefined',
   isolated:self.crossOriginIsolated===true,
   touch:navigator.maxTouchPoints||0,
   size:innerWidth+'x'+innerHeight
  };
 }
 window.__diag=function(){return{info:diag(),logs:logs}};

 addEventListener('message',function(e){
  if(e.source!==P||e.origin!==location.origin)return;
  var m=e.data;if(m&&m.t==='start')run(m);
 });

 function run(m){
  var d=diag();
  if(!d.wasm){send({t:'error',msg:'이 브라우저에서 WebAssembly를 쓸 수 없습니다. iOS/iPadOS를 최신으로 업데이트하고, 잠금 모드(Lockdown)가 켜져 있다면 이 사이트만 예외로 해 주세요.'});return}
  if(!d.webgl1&&!d.webgl2){send({t:'error',msg:'WebGL(그래픽)을 사용할 수 없습니다. 저전력 모드를 끄고 Safari를 완전히 종료한 뒤 다시 열어 보세요.'});return}

  /* 아이패드의 '데스크탑용 웹사이트 요청' 모드(맥으로 인식)에서도 터치 조작 버튼이 나오도록 */
  var ua=navigator.userAgent;
  if(m.ios&&!/iPhone|iPad|iPod/.test(ua)){
   try{Object.defineProperty(navigator,'userAgent',{get:function(){return ua+' iPad Mobile'},configurable:true})}catch(_){}
  }

  window.EJS_player='#game';
  window.EJS_core=m.core;
  window.EJS_gameName=m.name;
  window.EJS_gameUrl=new File([m.file],m.file.name);   /* 이 화면(iframe)에서 만든 File */
  /* 호환모드 : 0=기본 · 1=기본+WebGL2 끄기 · 2=최신 엔진 · 3=최신 엔진+WebGL2 끄기 */
  var mode=(m.mode|0)%4;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/'+(mode>=2?'latest':'stable')+'/data/';
  if(mode%2===1)window.EJS_defaultOptions={'webgl2Enabled':'disabled'};
  log('호환모드 '+(mode+1)+' · 엔진 '+(mode>=2?'latest':'stable')+' · WebGL2 '+(mode%2===1?'끔':'기본'));
  window.EJS_color=m.color;
  window.EJS_language='ko-KR';
  window.EJS_threads=false;          /* 아이폰 Safari 는 SharedArrayBuffer(스레드) 사용 불가 → 단일 스레드 코어 */
  window.EJS_startOnLoaded=false;    /* 아이폰은 '터치' 후에만 소리/화면 시작 가능 → 시작 버튼을 직접 누르게 함 */
  window.EJS_ready=function(){send({t:'emuReady'})};
  window.EJS_onGameStart=function(){send({t:'started'})};

  var s=document.createElement('script');
  s.src=window.EJS_pathtodata+'loader.js';
  s.onload=function(){send({t:'engine'})};
  s.onerror=function(){send({t:'error',msg:'에뮬레이터 엔진을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'})};
  document.body.appendChild(s);
 }

 send({t:'frameReady'});
})();
</script>
</body>
</html>
