<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="noads.js"></script>
<script src="saver.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11120a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>영호의 게임 바탕화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
 --tb:calc(52px + env(safe-area-inset-bottom,0px));
 --ink:#e9e7da;--mut:#a9a78f;--bar:rgba(24,25,19,.93);--acc:#b7dc72;
 --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#10110a;color:var(--ink);font-family:var(--kr);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid #8fc5ff;outline-offset:2px}
#screen{position:fixed;inset:0;overflow:hidden}

/* ───── 바탕화면 ───── */
#wall{position:absolute;inset:0;background:
 radial-gradient(58% 72% at 46% 44%,rgba(118,106,52,.52),rgba(70,64,32,.26) 46%,transparent 78%),#10110a}
#wall:before{content:"";position:absolute;--r:max(66vh,38vw);width:calc(var(--r)*2);height:calc(var(--r)*2);left:34%;top:46%;margin:calc(var(--r)*-1) 0 0 calc(var(--r)*-1);border-radius:50%;
 background:radial-gradient(circle closest-side,rgba(120,108,52,.20) 0,rgba(96,86,42,.12) 70%,rgba(110,100,50,.10) 93%,rgba(190,174,92,.21) 98.6%,rgba(190,174,92,0) 100%);filter:blur(1.2px)}
@media (orientation:portrait){#wall:before{--r:72vw;left:22%}}
/* 앱 서랍 */
#drawer{position:absolute;left:0;right:0;top:0;bottom:var(--tb);z-index:40;display:none;flex-direction:column;background:rgba(4,4,3,.95);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#drawer.on{display:flex;animation:fadein .16s ease-out}
@keyframes fadein{from{opacity:0}}
.dtop{flex:none;display:flex;justify-content:flex-end;padding:clamp(12px,4.5vh,40px) clamp(14px,12vw,240px) 0}
.dsearch{width:min(300px,100%);height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:18px;background:#34342f;border:1px solid transparent}
.dsearch:focus-within{border-color:#8fc5ff;background:#3d3d37}
.dsearch svg{width:15px;height:15px;flex:none;stroke:var(--mut);stroke-width:2;fill:none;stroke-linecap:round}
.dsearch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:13.5px var(--kr);-webkit-user-select:text;user-select:text}
.dsearch input::placeholder{color:#8b8975}
.dstage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.dgrid{display:grid;align-content:center;justify-content:center}
.da{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;padding:6px 2px;border:0;border-radius:12px;background:none;cursor:pointer}
.da:hover,.da:focus-visible{background:rgba(255,255,255,.09)}
.da:active{background:rgba(255,255,255,.16)}
.da .l{max-width:100%;font-size:11.5px;line-height:1.25;text-align:center;color:#f1efe3;word-break:keep-all}
.dnav{position:absolute;top:50%;width:40px;height:56px;margin-top:-28px;border:0;border-radius:10px;background:none;display:grid;place-items:center;cursor:pointer;color:#ddd}
.dnav:hover{background:rgba(255,255,255,.08)}
.dnav svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dnav.p{left:clamp(6px,6vw,110px)}.dnav.n{right:clamp(6px,6vw,110px)}
.dnav[hidden]{display:none}
.ddots{flex:none;display:flex;justify-content:center;gap:12px;padding:6px 0 clamp(12px,3.5vh,26px);min-height:34px}
.ddots button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#6c6b60;cursor:pointer}
.ddots button.on{background:#fff}
.dnone{color:var(--mut);font-size:14px}
.tb2{width:34px;height:34px;padding:0;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:#e6e4d6;cursor:pointer;flex:none}
.tb2:hover{background:rgba(255,255,255,.1)}
.tb2.on{background:rgba(255,255,255,.18)}
.tb2 svg{width:20px;height:20px}
.clk{white-space:nowrap}
.mid0{position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.mid0{margin-left:4px}
@media (max-width:640px){.mid0{margin-left:6px}.mid0 .mid{display:none}}
.mid0 .tb2{width:44px;height:44px;border-radius:12px}
.mid0 .mid{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:4px}
@media (max-width:640px){#cdate{display:none}.dnav{display:none}.tray #tSearch{width:32px}}
.ai.im{background:none!important;box-shadow:none;border-radius:0}
.ai.im img{width:100%;height:100%;object-fit:contain;display:block}
.ai{display:inline-grid;place-items:center;border-radius:27%;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.ai svg{width:72%;height:72%;display:block}

/* ───── 창 ───── */
#wins{position:absolute;left:0;right:0;top:0;bottom:var(--tb);z-index:5;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:300px;min-height:220px;background:#f2f2f2;border-radius:8px 8px 3px 3px;overflow:hidden;
 box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.tbar{height:36px;flex:none;display:flex;align-items:flex-end;background:#dedede;touch-action:none;cursor:default}
.win:not(.act) .tbar{filter:brightness(.97)}
.tabs{flex:1;min-width:0;display:flex;align-items:flex-end;height:100%}
.tab{height:30px;margin-left:10px;padding:0 24px;display:flex;align-items:center;gap:7px;min-width:0;max-width:240px;background:#f2f2f2;color:#333;font-size:12px;
 clip-path:polygon(0 100%,10px 0,calc(100% - 10px) 0,100% 100%)}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg{width:14px;height:14px;flex:none}
.newtab{width:36px;height:21px;margin:0 0 4px 4px;border:0;padding:0;background:#cdcdcd;cursor:pointer;clip-path:polygon(0 100%,7px 0,calc(100% - 7px) 0,100% 100%)}
.newtab:hover{background:#c0c0c0}
.win.app .tbar{background:#2b2c24;color:var(--ink)}
.ttl{display:flex;align-items:center;gap:8px;padding:0 0 0 10px;height:100%;min-width:0;font-size:13px;font-weight:500}
.ttl span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{display:flex;align-items:center;gap:3px;height:100%;padding:0 6px 0 10px;flex:none}
.xb{width:23px;height:23px;padding:0;border:1px solid #fff;border-radius:4px;display:grid;place-items:center;cursor:pointer;
 background:linear-gradient(160deg,#7fa9f5 0%,#2d62d6 55%,#2552c0 100%);box-shadow:inset 0 0 2px rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.4)}
.xb.x{background:linear-gradient(160deg,#f0a086 0%,#d8482a 55%,#c13a1c 100%)}
.xb:hover{filter:brightness(1.13)}.xb:active{filter:brightness(.88)}
.xb svg{width:12px;height:12px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:square;stroke-linejoin:miter}
.wbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:#fff}
.wbody iframe{flex:1;width:100%;border:0;background:#fff}
.grip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:9;touch-action:none;
 background:linear-gradient(135deg,transparent 55%,rgba(0,0,0,.28) 55%,rgba(0,0,0,.28) 62%,transparent 62%,transparent 72%,rgba(0,0,0,.28) 72%,rgba(0,0,0,.28) 79%,transparent 79%)}
body.drg iframe{pointer-events:none}
body.drg{cursor:grabbing}
@media (max-width:760px),(max-height:520px){
 .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
 .xb.mx,.grip{display:none}
 .tab{margin-left:6px}
}

/* ───── 작업표시줄 ───── */
#tb{position:absolute;left:0;right:0;bottom:0;height:var(--tb);padding-bottom:env(safe-area-inset-bottom,0px);z-index:50;display:flex;align-items:center;
 background:var(--bar);border-top:1px solid rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.keys{flex:1 1 0;display:flex;align-items:center;gap:2px;padding-left:10px}
.sk{width:46px;height:44px;border:0;border-radius:12px;background:none;display:grid;place-items:center;cursor:pointer}
.sk:hover{background:rgba(255,255,255,.1)}
.sk:active,.sk.on{background:rgba(255,255,255,.18)}
.sk svg{width:22px;height:22px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mid{display:flex;align-items:center;justify-content:center;gap:4px}
.mb{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:none;display:grid;place-items:center;cursor:pointer}
.mb:hover{background:rgba(255,255,255,.1)}
.mb.run:after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:#8c8a78;transition:width .15s,margin .15s}
.mb.act:after{width:16px;margin-left:-8px;background:var(--acc)}
.mb.mn .ai{opacity:.6}
.tray{flex:1 1 0;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-right:14px;color:#cfcdbd}
.tray svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bat{min-width:28px;height:18px;padding:0 5px;border:0;border-radius:5px;background:#d8d6c6;color:#1b1c14;font:800 11px var(--kr);display:grid;place-items:center;line-height:1;cursor:pointer;flex:none}
.bat:hover{filter:brightness(1.1)}
.bat.sv{background:#f2c744;color:#2a2200}
#svToast{position:absolute;left:50%;bottom:calc(var(--tb) + 14px);transform:translateX(-50%);z-index:70;max-width:min(92vw,420px);padding:10px 16px;border-radius:10px;background:#f2f0e2;color:#1b1c14;font-size:13px;line-height:1.45;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none}
#svToast[hidden]{display:none}
.pp{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:#000;cursor:pointer}
.pp img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.pp i{position:absolute;left:50%;top:50%;width:64px;height:44px;margin:-22px 0 0 -32px;border-radius:12px;background:#e5372b;display:grid;place-items:center}
.pp i:after{content:"";border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff;margin-left:3px}
/* ───── 절전 모드 (배터리 표시를 누르면 켜짐 · saver.js 와 같은 'ds.saver' 값을 공유) ─────
   글씨·이미지·배경은 그대로 보이고, 움직임·그림자·블러·전환 같은 효과와 장식 스크립트는 모두 끕니다. */
html.ds-saver *,html.ds-saver *::before,html.ds-saver *::after{animation:none!important;transition:none!important;box-shadow:none!important;text-shadow:none!important;filter:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;scroll-behavior:auto!important}
html.ds-saver #wall:before{display:none}
html.ds-saver #drawer{background:#050504}
html.ds-saver #tb{background:#181913}
html.ds-saver #start{background:#1e1f18}
html.ds-saver .win{outline:1px solid rgba(0,0,0,.6)}
html.ds-saver .xb{border-color:#fff}
html.ds-saver .sp{border-top-color:#ddd}
.clk{text-align:right;line-height:1.25;font-size:11.5px;color:var(--ink);padding-left:10px;border-left:1px solid rgba(255,255,255,.14)}
.clk b{display:block;font-weight:500;font-size:12px}
@media (max-width:640px){.tray .hide-s{display:none}.keys{padding-left:4px}.sk{width:42px}.tray{gap:8px;padding-right:10px}}

/* ───── 시작 메뉴 ───── */
#start{position:absolute;left:8px;bottom:calc(var(--tb) + 8px);z-index:60;width:min(620px,calc(100% - 16px));height:min(520px,calc(100% - var(--tb) - 20px));
 display:none;grid-template-columns:270px 1fr;grid-template-rows:minmax(0,1fr) auto;background:rgba(30,31,24,.97);border:1px solid rgba(255,255,255,.11);border-radius:10px;overflow:hidden;
 box-shadow:0 20px 56px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#start.on{display:grid;animation:up .14s ease-out}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.sl{display:flex;flex-direction:column;min-height:0;border-right:1px solid rgba(255,255,255,.07)}
.sl h2{margin:0;padding:16px 18px 8px;font-size:13px;font-weight:700;color:var(--mut)}
.sl ul{list-style:none;margin:0;padding:0 8px;flex:1;overflow:auto}
.si{width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;font-size:14px}
.si:hover,.si:focus-visible{background:rgba(255,255,255,.1)}
.sq{margin:8px;display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;border-radius:8px;background:rgba(255,255,255,.09);border:1px solid transparent}
.sq:focus-within{border-color:#8fc5ff;background:rgba(255,255,255,.13)}
.sq svg{width:16px;height:16px;stroke:var(--mut);stroke-width:2;fill:none;stroke-linecap:round}
.sq input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:14px var(--kr);-webkit-user-select:text;user-select:text}
.sq input::placeholder{color:#8b8975}
.empty{padding:20px 18px;font-size:13px;color:var(--mut)}
.sr{padding:16px 16px 12px;overflow:auto;min-height:0}
.sr h2{margin:0 0 12px 2px;font-size:13px;font-weight:700;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;height:104px;padding:12px;border:0;border-radius:6px;cursor:pointer;color:#fff;text-align:left;font-size:13px;font-weight:500;
 background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tile:hover{filter:brightness(1.12)}
.tile.w{grid-column:span 2;height:92px}
.tile .ai{background:none;box-shadow:none;width:34px;height:34px}
.sf{grid-column:1/-1;padding:6px 8px;border-top:1px solid rgba(255,255,255,.09)}
.sf .si{font-weight:600}
.sf .si svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
#homeAsk{position:absolute;inset:0;z-index:200;display:grid;place-items:center;padding:14px;background:rgba(0,0,0,.5)}
#homeAsk[hidden]{display:none}
#homeAsk .hbox{width:min(360px,100%);padding:20px 18px 16px;border-radius:14px;background:#2a2b21;color:#f2f0e2;box-shadow:0 18px 50px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12)}
#homeAsk p{margin:0 0 16px;font-size:14.5px;line-height:1.6;text-align:center;word-break:keep-all}
#homeAsk .hrow{display:flex;gap:10px}
#homeAsk .hrow button{flex:1;height:42px;border:0;border-radius:10px;font:700 14.5px var(--kr);cursor:pointer;background:rgba(255,255,255,.12);color:#f2f0e2}
#homeAsk .hrow button:hover,#homeAsk .hrow button:focus-visible{background:rgba(255,255,255,.22)}
#homeAsk .hrow #homeYes{background:#e8495b;color:#fff}
#homeAsk .hrow #homeYes:hover,#homeAsk .hrow #homeYes:focus-visible{background:#f0596b}
@media (max-width:600px){#start{grid-template-columns:1fr;width:min(340px,calc(100% - 16px))}.sr{display:none}.sl{border:0}}

/* ───── 브라우저(유튜브) ───── */
.bw{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:#f2f2f2;color:#222}
.tool{height:42px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid #d3d3d3;background:#f2f2f2}
.nb{width:30px;height:30px;flex:none;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;color:#5f6368}
.nb:hover:not(:disabled){background:rgba(0,0,0,.09)}
.nb:disabled{color:#c2c2c2;cursor:default}
.nb svg,.addr svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.addr{flex:1;min-width:0;height:30px;margin:0 6px;padding:0 10px;display:flex;align-items:center;gap:8px;border:1px solid #cdcdcd;border-radius:6px;background:#fff;color:#777}
.addr svg{width:14px;height:14px}
.addr:focus-within{border-color:#4d8ff0;box-shadow:0 0 0 2px rgba(77,143,240,.25)}
.addr input{flex:1;min-width:0;border:0;outline:0;background:none;font:13px var(--kr);color:#222;-webkit-user-select:text;user-select:text}
.page{flex:1;min-height:0;overflow:auto;background:#fafafa;color:#222;-webkit-user-select:text;user-select:text}
.yh{max-width:720px;margin:0 auto;padding:clamp(22px,8vh,72px) 20px 40px}
.yh h1{margin:0;font-size:clamp(23px,4.4vw,30px);font-weight:800;letter-spacing:-.025em;line-height:1.25}
.yh p.sub{margin:8px 0 0;color:#5f5f5f;font-size:14px;line-height:1.55}
.ys{display:flex;margin:22px 0 14px;border:1px solid #c9c9c9;border-radius:999px;background:#fff;overflow:hidden}
.ys:focus-within{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.ys input{flex:1;min-width:0;height:46px;padding:0 18px;border:0;outline:0;background:none;font:16px var(--kr);color:#111}
.ys button{padding:0 22px;border:0;border-left:1px solid #d6d6d6;background:#f3f3f3;font:700 14px var(--kr);color:#222;cursor:pointer}
.ys button:hover{background:#e8e8e8}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{padding:7px 14px;border:1px solid #d4d4d4;border-radius:999px;background:#fff;color:#333;font:500 13px var(--kr);cursor:pointer}
.cat:hover{background:#f0f0f0}
.cat.on{background:#161616;border-color:#161616;color:#fff}
.sec{margin:30px 0 10px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.sec button{border:0;background:none;color:#606060;font:12px var(--kr);cursor:pointer;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border:0;border-radius:8px;background:#ececec;color:#222;font:13px var(--kr);cursor:pointer}
.chip:hover{background:#e0e0e0}
.rh{position:sticky;top:0;z-index:3;padding:10px 16px 10px;background:rgba(250,250,250,.96);border-bottom:1px solid #e4e4e4;display:flex;flex-direction:column;gap:9px}
.rh .ys{margin:0;max-width:560px}
.rh .ys input{height:38px;font-size:14px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px 14px;padding:16px}
.vc{display:block;align-self:start;padding:0;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.vt{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#ddd}
.vt img{width:100%;height:100%;object-fit:cover;display:block}
.vc:hover .vt{box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vn{margin:8px 2px 0;word-break:keep-all;font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{margin:3px 2px 0;font-size:12px;color:#606060}
.note{margin:20px 16px;padding:18px 20px;border-radius:12px;background:#fff;border:1px solid #e2e2e2;max-width:640px}
.note b{display:block;font-size:15px;line-height:1.4}
.note p{margin:8px 0 14px;color:#555;font-size:13px;line-height:1.6}
.btn{display:inline-block;padding:9px 16px;border:0;border-radius:999px;background:#161616;color:#fff;font:700 13px var(--kr);cursor:pointer;text-decoration:none}
.btn:hover{background:#333}

 function onPick(fs){
  fs=[].slice.call(fs||[]);if(!fs.length)return;
  if(!MG.is(c)){go(fs[0]);return}
  var g=fs.filter(function(x){return MG.isRom(x.name)})[0];

 }
 function go(file){
  S.file=file;S.name=file.name.replace(/\.[^.]+$/,'');

  start(file,0);

 /* 게임 시작 */
 function start(file,ci,lvl){
  var seq=++S.seq;clearTimeout(S.watch);killFrame();
  if(c.id==='psx'&&hasLG&&LoadGame.needUnzip(file)){
   showLoad(a.n+' · 압축 푸는 중',40);drop.classList.add('hidden');
   LoadGame.unzip(file,function(p,l){try{prog(p,l)}catch(e){}}).then(function(f){if(seq===S.seq)start(f,ci,lvl)},function(e){if(seq===S.seq){hideLoad();drop.classList.remove('hidden');alertBox('압축을 풀지 못했어요: '+(e&&e.message||e))}});
   return;
  }
  if(c.id==='psx'&&hasLG){var bad=LoadGame.badFormat(file);if(bad){alertBox(bad,'파일 형식 안내');drop.classList.remove('hidden');return}}
  var list=[c.core].concat(c.alt||[]),coreName=list[ci],hasNext=ci+1<list.length,isMame=MG.is(c),isPs=c.id==='psx';
  var psxLvl=lvl==null?(hasLG&&isPs?LoadGame.autoLevel():0):lvl,lastErr='';
  drop.classList.add('hidden');
  showLoad(a.n+' · 파일 준비 중',Math.max(5,Math.min(300,file.size/1048576*0.35+4)));
  try{if(hasLG&&LoadGame.has(c.id))LoadGame.start(stage)}catch(e){}
  var giveUp=function(msg,title,force){
   if(seq!==S.seq||(S.started&&!force))return;
   S.seq++;hideLoad();killFrame();drop.classList.remove('hidden');alertBox(msg,title||'게임을 시작하지 못했어요');
  };
  var tryNext=function(){if(seq!==S.seq||S.started||!hasNext)return false;say('다른 코어로 다시 시도합니다…');start(file,ci+1,lvl);return true};
  var psxFail=function(){if(seq!==S.seq||S.started)return;if(psxLvl<2){say('저사양 안전 모드로 다시 시도합니다…');start(file,ci,2);return}giveUp(hasLG?LoadGame.explain():'플레이스테이션 게임을 시작하지 못했어요.','불러오기 실패')};
  var onFail=function(m){
   if(seq!==S.seq||S.started)return;lastErr=m;
   if(isPs&&/failed to (start|load|initialize)/i.test(m)){psxFail();return}
   if(hasNext&&!/out of memory|RangeError/i.test(m)&&/abort|wasm|WebAssembly|runtime|unreachable|core/i.test(m)){if(tryNext())return}
   if(/out of memory|memory|allocat|Aborted|RangeError|WebAssembly/i.test(m))giveUp('기기 메모리가 부족해 이 게임을 열 수 없어요. 다른 탭·앱을 닫고 다시 시도하거나 용량이 작은 게임을 선택해 보세요.\n('+m.slice(0,80)+')','메모리 부족');
  };
  var fr=S.fr=h('iframe','emf');fr.setAttribute('allow','autoplay; gamepad; fullscreen');fr.setAttribute('scrolling','no');fr.title=c.n;
  stage.insertBefore(fr,drop);
  S.watch=setTimeout(function(){if(tryNext())return;giveUp(isPs&&hasLG?LoadGame.TOO_LONG+'\n게임 파일이 플레이스테이션용인지 확인해 주세요.':'게임 시작이 너무 오래 걸립니다. 이 기종에 맞는 ROM 파일인지 확인하고 다시 시도해 보세요.'+(lastErr?'\n('+lastErr.slice(0,80)+')':''))},isPs?300000:(hasNext?180000:300000));
  setTimeout(function(){
   if(seq!==S.seq)return;
   Promise.resolve(file.mgBios||[]).then(function(bios){
    if(seq!==S.seq)return;
    var d,gw;
    try{d=fr.contentDocument;gw=fr.contentWindow;d.open();d.write(EM_HOST);d.close()}catch(e){giveUp('에뮬레이터 준비 실패: '+e.message);return}
    S.gw=gw;
    try{
     if(isMame)MG.hook(gw);
     gw.EJS_player='#game';gw.EJS_core=coreName;gw.EJS_gameName=S.name;
     gw.EJS_gameUrl=new gw.File([file],file.name);
     gw.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
     if(bios.length){gw.EJS_biosUrl=bios[0].url;var ef={};bios.forEach(function(b){ef[b.name]=b.url});gw.EJS_externalFiles=ef}
     if(/desmume|melonds/.test(coreName)){gw.EJS_controlScheme='nds';gw.EJS_defaultOptions={'desmume_pointer_type':'touch','melonds_touch_mode':'Touch'}}
     if(isPs&&hasLG)gw.EJS_defaultOptions=LoadGame.psxOptions(psxLvl);
     gw.EJS_startOnLoaded=true;gw.EJS_color=c.a;gw.EJS_language='ko-KR';
     gw.EJS_onGameStart=function(){
      if(seq!==S.seq)return;
      S.started=true;clearTimeout(S.watch);prog(100,'게임 시작 완료');setTimeout(hideLoad,500);applyCtl();say('게임 시작! 🎮');
      if(!compact()&&!isFull()&&!w.el.classList.contains('max'))w.el.classList.add('max');   /* PC 에서는 큰 화면으로 */
      setTimeout(function(){try{gw.dispatchEvent(new Event('resize'))}catch(e){}},200);
      if(isMame)MG.watch(gw,function(){return seq===S.seq},hasNext,function(){say('게임이 안 열려서 다른 방식(코어)으로 다시 시도합니다…');start(file,ci+1)},function(m){giveUp(m,null,true)});
     };
     gw.addEventListener('error',function(e){onFail((e&&e.message)||'error')});
     gw.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;onFail(String((r&&(r.message||r))||'rejection'))});
     if(isPs&&hasLG)LoadGame.watchError(gw,function(){return seq===S.seq&&!S.started},psxFail);
     d.addEventListener('pointerdown',function(){try{gw.focus()}catch(e){}},true);
     if(typeof WebAssembly!=='object'){giveUp('이 브라우저는 WebAssembly 를 지원하지 않아요.');return}
     var sc=d.createElement('script');sc.src=gw.EJS_pathtodata+'loader.js';
     sc.onload=function(){if(seq===S.seq&&!S.started)prog(60,'에뮬레이터 엔진 다운로드 완료 · 게임 코어 준비 중…')};
     sc.onerror=function(){giveUp('에뮬레이터 엔진을 불러오지 못했습니다. 인터넷 연결을 확인하세요.','연결 오류')};
     d.body.appendChild(sc);
    }catch(err){giveUp('에뮬레이터 준비 실패: '+err.message)}
   });
  },60);
 }

 function cloudSave(){
  if(!need())return;
  var key,fname;
  var pAuth=gAuth();say('☁ 구글 로그인 확인 중…');S.keyP.then(function(k){key=k;fname='YH_'+c.id+'_'+k+'.SAVEDATA';return pAuth}).then(function(tok){
   say('☁ 구글 드라이브에 저장하는 중…');
   var data=packSave(S.gw.EJS_emulator.gameManager.getState(),metaNow(key));
   return gFind(tok,fname).then(function(fid){return gPut(tok,fname,data,fid)});
  }).then(function(){say('☁ 구글 드라이브에 저장했어요')},cloudErr);

 function cloudLoad(){
  if(!need())return;
  var key,tk;
  var pAuth=gAuth();say('☁ 구글 로그인 확인 중…');S.keyP.then(function(k){key=k;return pAuth}).then(function(tok){
   tk=tok;say('☁ 구글 드라이브에서 불러오는 중…');
   return gFind(tok,'YH_'+c.id+'_'+key+'.SAVEDATA');
  }).then(function(fid){
   if(!fid){alertBox('클라우드에 이 게임의 세이브가 없어요.','클라우드');return}
   return fetch('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media',{headers:{Authorization:'Bearer '+tk}}).then(function(r){if(!r.ok)throw new Error('구글 드라이브 오류 ('+r.status+')');return r.arrayBuffer()}).then(applySave);
  }).catch(cloudErr);
 }

 /* 화면캡처 */
 function capture(){
  if(!need())return;
  var E=S.gw.EJS_emulator,done=false,name=c.fn+'_'+(S.name.replace(/[^\w\-]/g,'').slice(0,20)||'GAME')+'_'+stampNow()+'.png';
  function fin(b){if(done||!b)return;done=true;dlBlob(b,name);say('📷 화면캡처 저장: '+name)}
  try{var r=E.screenshot&&E.screenshot(function(b){fin(b)},'canvas','png');if(r&&r.then)r.then(function(x){fin(x&&x.blob?x.blob:(x instanceof Blob?x:null))},function(){})}catch(e){}
  setTimeout(function(){
   if(done)return;
   try{var u=E.gameManager.screenshot();if(u&&u.length){fin(new Blob([u],{type:'image/png'}));return}}catch(e){}
   try{S.gw.document.querySelector('canvas').toBlob(function(b){fin(b)},'image/png')}catch(e){}
   setTimeout(function(){if(!done)say('화면캡처에 실패했어요')},800);
  },700);
 }
}

    return;
   }
   e.items=(j.items||[]).filter(function(x){return x.id&&x.id.videoId}).map(function(x){
    var s=x.snippet||{},th=s.thumbnails||{};
    return{id:x.id.videoId,title:decode(s.title),ch:decode(s.channelTitle),th:(th.medium||th.default||{}).url||('https://i.ytimg.com/vi/'+x.id.videoId+'/mqdefault.jpg'),date:(s.publishedAt||'').slice(0,10)};
   });
   if(!e.items.length){e.err='검색 결과가 없어요. 게임 이름이나 띄어쓰기를 바꿔서 다시 찾아보세요.';delete e.items}
  }).catch(function(){e.err='인터넷 연결을 확인한 뒤 새로고침해 주세요.'});
 }

 /* 영상 보기 */
 function viewWatch(e){
  var box=h('div','wv'),pl=h('div','pl');
  if(saverOn()&&!e.play){
   var pb=h('button','pp');pb.type='button';pb.setAttribute('aria-label','영상 재생');
   var pi=h('img');pi.src='https://i.ytimg.com/vi/'+e.id+'/hqdefault.jpg';pi.alt='';pb.append(pi,h('i'));
   pb.onclick=function(){e.play=true;render()};pl.append(pb);
  }else{
   var f=h('iframe');f.title='유튜브 영상';
   f.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');f.allowFullscreen=true;
   f.src='https://www.youtube-nocookie.com/embed/'+e.id+'?autoplay=1&rel=0&playsinline=1';
   pl.append(f);
  }
  var ti=h('h2',null,e.title||'영상'),by=h('p','by',e.by||'');
  box.append(pl,ti,by);
  var row=h('div','row');
  var a=h('a','btn ghost','유튜브에서 보기');a.href='https://www.youtube.com/watch?v='+e.id;a.target='_blank';a.rel='noopener';
  row.append(a);
  if(e.q){var more=h('button','btn ghost','“'+e.q+'” 다른 영상');more.type='button';more.onclick=function(){back()};row.append(more)}
  box.append(row);
  box.append(h('p','by',saverOn()&&!e.play?'절전 모드: 영상 화면을 누르면 그때 영상을 불러와요.':'재생이 안 되면 영상 주인이 다른 사이트 재생을 막은 거예요. “유튜브에서 보기”를 눌러 주세요.'));
  page.append(box);
  if(!e.title){
   fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+e.id)).then(function(r){return r.json()}).then(function(j){
    e.title=j.title;e.by=j.author_name;
    if(cur()===e){ti.textContent=e.title||'영상';by.textContent=e.by||'';w.setTab(e.title||'유튜브 게임 검색')}
   }).catch(function(){});
  }
 }

 /* 메뉴 · 검색 키 설정 */
 function closeMenu(){if(menu){menu.remove();menu=null}}
 function toggleMenu(){
  if(menu){closeMenu();return}
  menu=h('div','pop');menu.setAttribute('role','menu');
  [['검색 키 설정 (선택)',openKeyDlg],['최근 검색 지우기',function(){LS.del(K_REC);toast('최근 검색을 지웠어요.');if(cur().t==='home')render()}],['처음 화면',home]].forEach(function(it){
   var b=h('button',null,it[0]);b.type='button';b.setAttribute('role','menuitem');b.onclick=function(){closeMenu();it[1]()};menu.append(b);
  });
  root.append(menu);
 }
 function closeDlg(){if(dlg){dlg.remove();dlg=null}}
 function openKeyDlg(){
  closeMenu();closeDlg();
  dlg=h('div','dlgbg');
  var d=h('div','dlg');d.setAttribute('role','dialog');d.setAttribute('aria-label','검색 키 설정');
  d.append(h('h3',null,'유튜브 검색 키 (선택)'));
  d.append(h('p',null,'키가 없어도 검색할 수 있어요. 키를 등록하면 유튜브 공식 검색을 쓰기 때문에 더 안정적이에요. 구글 클라우드에서 “YouTube Data API v3”를 켜고 만든 API 키를 붙여 넣으세요. 키는 이 기기의 브라우저에만 저장돼요.'));
  var i=h('input');i.type='text';i.placeholder='AIza…';i.autocomplete='off';i.spellcheck=false;i.value=LS.get(K_KEY,'');i.setAttribute('aria-label','API 키');
  d.append(i);
  var r=h('div','row');
  var del=h('button','btn ghost','키 삭제');del.type='button';del.onclick=function(){LS.del(K_KEY);closeDlg();toast('검색 키를 삭제했어요. 이제 키 없이 검색해요.');render()};
  var no=h('button','btn ghost','닫기');no.type='button';no.onclick=closeDlg;
  var ok=h('button','btn','저장');ok.type='button';
  ok.onclick=function(){var v=i.value.trim();if(!v){toast('키를 입력해 주세요.');return}LS.set(K_KEY,v);closeDlg();S.hist.forEach(function(x){delete x.items;delete x.err;delete x.keyIssue});toast('검색 키를 저장했어요.');render()};
  i.onkeydown=function(ev){if(ev.key==='Enter')ok.click()};
  r.append(del,no,ok);d.append(r);dlg.append(d);
  dlg.addEventListener('pointerdown',function(ev){if(ev.target===dlg)closeDlg()});
  root.append(dlg);i.focus();
 }

 /* 화면 그리기 */
 function render(){
  var e=cur();
  closeMenu();
  bBack.disabled=S.i===0;bFwd.disabled=S.i>=S.hist.length-1;
  inp.value=urlOf(e);
  page.scrollTop=0;page.replaceChildren();
  if(e.t==='home'){viewHome();w.setTab('유튜브 게임 검색')}
  else if(e.t==='results'){viewResults(e);w.setTab(e.q+' · '+catOf(e.cat).n)}
  else{viewWatch(e);w.setTab(e.title||'유튜브 영상')}
 }

 bBack.onclick=back;bFwd.onclick=fwd;bRel.onclick=reload;bMenu.onclick=function(ev){ev.stopPropagation();toggleMenu()};
 inp.addEventListener('focus',function(){setTimeout(function(){inp.select()},0)});
 inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){submitAddr(inp.value);inp.blur()}else if(ev.key==='Escape'){inp.value=urlOf(cur());inp.blur()}});
 root.addEventListener('pointerdown',function(ev){if(menu&&!menu.contains(ev.target)&&ev.target!==bMenu&&!bMenu.contains(ev.target))closeMenu()});
 w.newTab=function(){home();};
 w.onBack=function(){if(dlg){closeDlg();return true}if(menu){closeMenu();return true}return back()};
 render();
}

})();
</script>
</body>
</html>
