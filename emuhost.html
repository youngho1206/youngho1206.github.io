<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script>
/* 아이폰 확대(핀치·더블탭) 방지 — 조작버튼을 두 손가락으로 누르거나 빠르게 눌러도 화면이 커지지 않게 막고, 이미 커졌으면 원래 크기로 되돌립니다. */
(function(){
 var A='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover',
     B='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
 function nz(d,w){
  if(!d||d.__nz)return;d.__nz=1;
  var opt={passive:false},lt=0;
  try{var s=d.createElement('style');s.textContent='html,body{touch-action:pan-x pan-y!important;-webkit-text-size-adjust:100%}';(d.head||d.documentElement).appendChild(s)}catch(_){}
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){d.addEventListener(t,function(e){e.preventDefault()},opt)});
  function multi(e){if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault()}
  d.addEventListener('touchstart',multi,opt);d.addEventListener('touchmove',multi,opt);
  d.addEventListener('touchend',function(e){
   var n=Date.now(),t=e.target&&e.target.tagName||'';
   if(n-lt<320&&e.cancelable&&!/^(INPUT|SELECT|TEXTAREA|LABEL|A)$/.test(t))e.preventDefault();
   lt=n;
  },opt);
  if(d===document&&w.visualViewport){
   var flip=0;
   w.visualViewport.addEventListener('resize',function(){
    if(w.visualViewport.scale<=1.02)return;
    var m=d.querySelector('meta[name=viewport]');
    if(!m){m=d.createElement('meta');m.name='viewport';d.head.appendChild(m)}
    flip^=1;m.setAttribute('content',flip?A:B);
    setTimeout(function(){try{w.scrollTo(0,0)}catch(_){}},30);
   });
  }
 }
 window.__nz=nz;nz(document,window);
})();
</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<title>emulator host</title>
<style>
/* 콘솔 게임 전용 호스트 페이지 (mobile.html 의 iframe 안에서 열립니다)
   - about:blank + document.write 방식은 아이폰/아이패드 사파리에서 화면이 지워지는 문제가 있어
     실제 페이지(emuhost.html)로 바꿨습니다. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
 touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#game{position:fixed;left:0;top:0;width:100%;height:100%}
.hidectl .ejs_virtualGamepad_parent,.hidectl .ejs_menu_bar{display:none!important}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function(){
 /* 아이패드 사파리(데스크톱 모드)는 '맥'으로 보여서 터치 조작버튼이 안 뜹니다 → 아이패드 UA 로 알려줌 */
 var IPAD_UA='Mozilla/5.0 (iPad; CPU OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1';

 /* 확대/핀치 방지 (아이폰 사파리는 user-scalable=no 를 무시하므로 직접 막음) */
 ['gesturestart','gesturechange','gestureend'].forEach(function(t){
  document.addEventListener(t,function(e){e.preventDefault()},{passive:false});
 });
 document.addEventListener('contextmenu',function(e){e.preventDefault()});

 window.startEmu=function(c){
  var W=window;
  /* 아이폰 무음 스위치가 켜져 있어도 소리가 나게 (iOS 17+) */
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}

  if(c.spoofMobile){
   try{Object.defineProperty(navigator,'userAgent',{configurable:true,get:function(){return IPAD_UA}})}catch(e){}
  }

  /* iOS 는 터치 전에는 소리를 막음 → 만들어지는 AudioContext 를 모아 두었다가 터치할 때마다 깨움 */
  var AC=W.AudioContext||W.webkitAudioContext;
  if(AC){
   var list=[];
   var P=function(){
    var a=arguments,x;
    try{x=new AC(a[0],a[1])}catch(e){x=new AC()}
    list.push(x);return x;
   };
   P.prototype=AC.prototype;
   try{W.AudioContext=P;W.webkitAudioContext=P}catch(e){}
   var unlock=function(){
    for(var i=0;i<list.length;i++){
     var x=list[i];
     if(x.state!=='running'&&x.resume){try{var p=x.resume();if(p&&p.catch)p.catch(function(){})}catch(e){}}
    }
   };
   ['touchstart','touchend','pointerdown','mousedown','click','keydown'].forEach(function(t){
    document.addEventListener(t,unlock,{passive:true,capture:true});
   });
   document.addEventListener('visibilitychange',function(){if(!document.hidden)unlock()});
   W.addEventListener('pageshow',unlock);
  }

  /* 에러를 부모 페이지로 전달 (메모리 부족 등 원인 안내용) */
  function fail(m){try{c.onFail&&c.onFail(String(m||''))}catch(e){}}
  W.addEventListener('error',function(e){fail((e&&e.message)||'error')});
  W.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;fail((r&&(r.message||r))||'rejection')});

  if(typeof WebAssembly!=='object'){fail('WebAssembly 미지원');return}

  W.EJS_player='#game';
  W.EJS_core=c.core;
  W.EJS_gameName=c.name;
  W.EJS_gameUrl=new File([c.file],c.file.name);
  W.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  W.EJS_startOnLoaded=true;
  W.EJS_color=c.color;
  W.EJS_language='ko-KR';
  /* 닌텐도DS: 조작 방식을 DS 용으로 지정하고, 아래 화면 터치(포인터)를 켬 */
  if(/desmume|melonds/.test(String(c.core||''))){
   W.EJS_controlScheme='nds';
   W.EJS_defaultOptions={'desmume_pointer_type':'touch','melonds_touch_mode':'Touch'};
  }
  /* iframe 안에서도 키/터치 입력을 받도록 포커스 유지 */
  try{W.focus()}catch(e){}
  document.addEventListener('pointerdown',function(){try{W.focus()}catch(e){}},{passive:true,capture:true});
  /* 마메게임 바이오스: MAME/_bios/neogeo.zip 등 바이오스 주소를 코어에 같이 전달 (롬 파일은 그대로) */
  if(c.bios&&c.bios.length){
   W.EJS_biosUrl=c.bios[0].url;
   var ef={};c.bios.forEach(function(b){ef[b.name]=b.url});
   W.EJS_externalFiles=ef;
  }
  /* PS1 속도 개선: 다이나믹 리컴파일러(DRC) 켬 · 자동 프레임스킵 · 부팅로고/보간 끔 */
  if(c.core==='psx'){W.EJS_defaultOptions=c.psxOpts||{'pcsx_rearmed_drc':'enabled','pcsx_rearmed_frameskip_type':'auto','pcsx_rearmed_frameskip_threshold':'33','pcsx_rearmed_neon_enhancement_enable':'disabled','pcsx_rearmed_neon_interlace_enable':'disabled','pcsx_rearmed_show_bios_bootlogo':'disabled','pcsx_rearmed_spu_interpolation':'off','pcsx_rearmed_spu_reverb':'enabled'}}
  /* 저사양 전용(갤럭시 A32급): 셰이더 끄고 스레드 사용 안 함 */
  if(c.lite){W.EJS_defaultOptions=Object.assign({'shader':'disabled'},W.EJS_defaultOptions||{});W.EJS_threads=false}
  W.EJS_onGameStart=function(){try{c.onStart&&c.onStart()}catch(e){}};

  var s=document.createElement('script');
  s.src=W.EJS_pathtodata+'loader.js';
  s.onload=function(){try{c.onScript&&c.onScript()}catch(e){}};
  s.onerror=function(){try{c.onScriptError&&c.onScriptError()}catch(e){}};
  document.body.appendChild(s);
 };
})();
</script>
</body>
</html>
