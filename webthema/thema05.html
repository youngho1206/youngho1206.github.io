<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<script src="../noads.js"></script>
<script src="../saver.js"></script>
<meta name="theme-color" content="#143a78">
<title>아이폰 4</title>
<style>
/* @theme-start */
:root{--bg:#17407f;--fg:#fff;--mut:#d3e2ff;--acc:#4f8fe8;--acc2:#2f6fd6;--line:rgba(255,255,255,.28);--sans:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--serif:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
html,body{background:#17407f}
.bg{background:radial-gradient(ellipse 130% 55% at 50% 108%,rgba(130,200,255,.6),transparent 62%),radial-gradient(circle at 16% 20%,rgba(255,255,255,.16),transparent 20%),radial-gradient(circle at 82% 14%,rgba(255,255,255,.11),transparent 17%),radial-gradient(circle at 70% 52%,rgba(255,255,255,.09),transparent 13%),radial-gradient(circle at 28% 66%,rgba(255,255,255,.08),transparent 11%),linear-gradient(180deg,#081634 0,#143a78 52%,#2a6cb8 100%)}
.bg i,.bg:after{display:none}
.bg.img:after{display:block;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.12) 40%,rgba(0,0,0,.4))}
h1{background:none!important;-webkit-text-fill-color:#fff!important;color:#fff!important;font-family:var(--sans);font-weight:700;letter-spacing:0;text-shadow:0 -1px 0 rgba(0,0,0,.5),0 2px 5px rgba(0,0,0,.55);animation:rise .9s .25s backwards}
.eyebrow{color:#dbe8ff;text-shadow:0 1px 2px rgba(0,0,0,.6)}.orn{color:#dbe8ff}.orn:before,.orn:after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.75))}
header p{color:#e8f0ff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-weight:400}
/* 분류 탭 = iOS 4 분할 컨트롤 */
.tabs{padding:0;gap:0;border:1px solid #1c2f50;border-radius:8px;background:none;overflow:hidden;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 0 rgba(255,255,255,.3),0 2px 5px rgba(0,0,0,.45)}
.tabs button{border-radius:0;color:#fff;font:700 13px var(--sans);letter-spacing:0;text-shadow:0 -1px 0 rgba(0,0,0,.55);background:linear-gradient(180deg,#b4c4da 0,#8aa2c4 49%,#7692ba 50%,#8aa6cb 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.tabs button+button{border-left:1px solid #2b4263}
.tabs button:hover{color:#fff}
.tabs button.on{background:linear-gradient(180deg,#46618c 0,#5878a6 49%,#496891 50%,#5b7dad 100%);box-shadow:inset 0 2px 5px rgba(0,0,0,.55);color:#fff}
/* 아이콘 */
.app{background:none!important;border-color:transparent!important;box-shadow:none!important}
.app:hover{border-color:transparent!important;box-shadow:none!important;transform:translateY(-3px)}
.app .ico{filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))!important;max-width:88px}
.app b{color:#fff;font:700 clamp(12px,1.8vw,14px) var(--sans);text-shadow:0 1px 2px rgba(0,0,0,.95)}
.app small{color:#cfe0ff;font:600 11px var(--sans);font-style:normal;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.sec{color:#fff;font-family:var(--sans);font-weight:700;text-shadow:0 -1px 0 rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.5)}.sec small{color:#d3e2ff;text-shadow:none}
footer{color:#d3e2ff;border-top-color:rgba(255,255,255,.3)}
.st{color:#d3e2ff}
/* 상단 = 내비게이션 바 */
.gbar{border-color:#2b4263}
#topnav,#botnav{border-radius:0;border-width:0 0 1px;border-bottom:1px solid #2b4263;background:linear-gradient(180deg,#c9d4e4 0,#a6b8d1 2%,#8da4c4 49%,#7c96ba 50%,#6b87ae 100%);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.7)}
#topnav button,#botnav button{color:#fff;font:700 12.5px var(--sans);text-shadow:0 -1px 0 rgba(0,0,0,.55)}
#topnav button svg,#botnav button svg{filter:drop-shadow(0 -1px 0 rgba(0,0,0,.5))}
#topnav button+button,#botnav button+button{border-left:1px solid rgba(35,58,95,.55);box-shadow:inset 1px 0 0 rgba(255,255,255,.25)}
#topnav button.on,#botnav button.on{background:linear-gradient(180deg,rgba(25,45,80,.6),rgba(60,90,140,.4));box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#topnav button.on:after,#botnav button.on:after{display:none}
#botnav{border-width:1px 0 0;border-bottom:0;border-top:1px solid #2b4263;background:linear-gradient(0deg,#c9d4e4 0,#a6b8d1 2%,#8da4c4 49%,#7c96ba 50%,#6b87ae 100%);box-shadow:0 -2px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.7)}
#botnav{background:linear-gradient(180deg,#c9d4e4 0,#a6b8d1 2%,#8da4c4 49%,#7c96ba 50%,#6b87ae 100%)}
/* 팝업 = 줄무늬 설정창 */
#msh{background:rgba(0,0,0,.5);-webkit-backdrop-filter:none;backdrop-filter:none}
#msh .sheet{margin-bottom:calc(env(safe-area-inset-bottom) + 62px);border-radius:12px;border:1px solid #1c2f50;color:#2c3550;background:repeating-linear-gradient(90deg,#c9ced6 0,#c9ced6 4px,#d3d8df 4px,#d3d8df 8px);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 8px 28px rgba(0,0,0,.65)}
#msh.top .sheet{margin-top:calc(env(safe-area-inset-top) + 56px)}
#msh .sh-h{padding:7px 10px;min-height:46px;border-radius:11px 11px 0 0;border-bottom:1px solid #2b4263;background:linear-gradient(180deg,#c9d4e4 0,#a6b8d1 2%,#8da4c4 49%,#7c96ba 50%,#6b87ae 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
#msh .sh-h b{font:700 18px var(--sans);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
#msh .sh-h button{padding:6px 13px;border:1px solid #2b4263;border-radius:6px;font:700 12.5px var(--sans);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.55);background:linear-gradient(180deg,#8ca4c8 0,#5f7fae 49%,#4b6c9d 50%,#5f81b3 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 rgba(255,255,255,.4)}
#msh .sh-s{padding-top:10px;color:#4c566c;text-shadow:0 1px 0 #fff;font-weight:500}
.sec2{color:#4c566c;text-shadow:0 1px 0 #fff;font:700 15px var(--sans);letter-spacing:0}
.gc,.gbtn,.wtl button,.sit{color:#000;background:#fff;border:1px solid #a7aeb9;border-radius:10px;box-shadow:inset 0 1px 0 #fff}
.gc{font-weight:400}.gc h3{color:#385487}
.gc.em{background:none;border:0;box-shadow:none;color:#4c566c;text-shadow:0 1px 0 #fff}
.gbtn span,.sit .tg{color:#385487}.gbtn svg{stroke:#4f6d9f}
.sit{border-radius:0;border-width:0 0 1px;background:#fff}
.sit .nm mark{color:#2f6fd6}
.gbtn:active,.sit:active,.wtl button:active{background:linear-gradient(180deg,#4da0f4,#0d65d6);color:#fff;border-color:#0a4fa8}
.gbtn:active span,.gbtn:active svg{color:#fff;stroke:#fff}
.sbox{background:linear-gradient(180deg,#b3bdce,#8f9db5);border:1px solid #6d7c97;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);height:46px}
.sbox input{height:32px;padding:0 12px;border-radius:16px;background:#fff;color:#000;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}.sbox input::placeholder{color:#8e8e93}.sbox svg{stroke:#fff;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.4))}
.sbox:focus-within{border-color:#2f6fd6;box-shadow:0 0 0 2px rgba(47,111,214,.4)}
.shint{color:#4c566c;text-shadow:0 1px 0 #fff}
.thit{border:1px solid rgba(0,0,0,.45);border-radius:9px}.thit.on{border:2px solid #2f6fd6;box-shadow:0 0 0 2px rgba(47,111,214,.4)}.thit.on:after{background:linear-gradient(#5aa8ff,#1d62d0)}
.wtl button i{border-color:#7f8fa8}.wtl button.on{border-color:#2f6fd6;box-shadow:0 0 0 2px rgba(47,111,214,.35)}.wtl button.on i{background:#2f6fd6;border-color:#2f6fd6;box-shadow:inset 0 0 0 3px #fff}

/* @theme-end */
