<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="theme-color" content="#05010f">
<title>레트로</title>
<style>
/* @theme-start */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--bg:#05010f;--fg:#f0e9ff;--mut:#a79bc9;--acc:#ff4fd8;--acc2:#9fd0ff;--line:rgba(167,139,250,.4)}
body{background:#05010f}
.bg{background:radial-gradient(ellipse at 15% 0,rgba(140,60,255,.5),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(255,61,240,.28),transparent 50%),linear-gradient(165deg,#2b0b66,#05010f)}
.bg i{background:#ff3df0!important;opacity:.1!important}
.bg:after{opacity:1;background-size:280px 280px;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 38% 64%,#9fd0ff,transparent),radial-gradient(1.6px 1.6px at 71% 27%,#ff9af5,transparent),radial-gradient(1.2px 1.2px at 86% 80%,#ffe45e,transparent),radial-gradient(1px 1px at 55% 90%,#fff,transparent),radial-gradient(1px 1px at 24% 46%,#fff,transparent);animation:rgtw 3.2s ease-in-out infinite alternate,rgfall 60s linear infinite}
@keyframes rgtw{to{opacity:.45}}
@keyframes rgfall{to{background-position:0 280px}}
body:after{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
header:before{content:"🪙 👾 🚀 ⭐ 🕹️";display:block;font-size:clamp(20px,4vw,30px);letter-spacing:.35em;filter:drop-shadow(0 0 8px #ff3df0);animation:rgbob 3s ease-in-out infinite alternate}
@keyframes rgbob{to{transform:translateY(-8px)}}
.eyebrow,.orn{display:none!important}
h1{font-size:0!important;line-height:0;background:none!important;-webkit-text-fill-color:initial!important;margin-top:14px}
h1:before{content:none!important}
h1:after{content:"RETRO GAME UNIVERSE";display:block;font:400 clamp(16px,5vw,46px)/1.45 "Press Start 2P",monospace;color:#fff;text-shadow:0 0 10px #ff3df0,0 0 28px rgba(255,61,240,.6),3px 3px 0 #3d7bff;animation:rgon 1.1s steps(1) 1}
@keyframes rgon{0%{opacity:0}12%{opacity:1}20%{opacity:.1}34%{opacity:1}48%{opacity:.3}60%,100%{opacity:1}}
header p{font-size:0!important;letter-spacing:0}
header p:after{content:"추억의 게임 속으로 떠나는 시간 여행";font-size:clamp(13px,2vw,16px);font-weight:500;color:#ffe45e;text-shadow:0 0 12px rgba(255,228,94,.45)}
.tabs{border:2px solid rgba(183,92,255,.6)}
.tabs button.on{color:#fff3b0;background:linear-gradient(#ff4a5e,#c2102c);box-shadow:0 3px 0 #7a0a1c,0 0 16px rgba(255,74,94,.6)}
.app{border:2px solid rgba(183,92,255,.55);border-radius:22px;box-shadow:0 0 0 1px rgba(61,123,255,.4) inset}
.app:hover{border-color:#ff3df0;box-shadow:0 0 32px color-mix(in srgb,var(--ac) 70%,#ff3df0),0 22px 50px rgba(0,0,0,.65)}
.app:hover .ico{transform:translateY(-6px) scale(1.14) rotate(-5deg)}
.app small{font:400 9px "Press Start 2P",monospace;font-style:normal;color:#ffe45e;letter-spacing:.04em}
.app b{color:#fff}
@media(prefers-reduced-motion:reduce){.bg:after,header:before,h1:after{animation:none}}
/* @theme-end */
</style></head><body></body></html>
