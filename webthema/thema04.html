<html lang="ko"><head><meta charset="utf-8">
<meta name="theme-color" content="#9fcfff">
<title>파스텔 하늘</title>

/* @theme-start */

:root{--bg:#9fcfff;--fg:#14407a;--mut:#3d6ba6;--acc:#1b4f8f;--acc2:#14407a;--line:rgba(27,79,143,.28)}
html,body{background:#9fcfff}
.bg{background:linear-gradient(180deg,#a9d5ff,#92c6fb)}
.bg i,.bg:after{display:none}
h1{background:none!important;-webkit-text-fill-color:#14407a!important;color:#14407a!important;font-family:var(--sans);font-weight:700;letter-spacing:0;text-shadow:none;animation:rise .9s .25s backwards}
.eyebrow{color:#2a5d9f}.orn{color:#1b4f8f}.orn:before,.orn:after{background:linear-gradient(90deg,transparent,#1b4f8f)}
header p{color:#2a5d9f}
.tabs{background:rgba(255,255,255,.45);border-color:rgba(27,79,143,.3)}
.tabs button{color:#2a5d9f}
.tabs button.on{color:#fff;background:#1b4f8f;box-shadow:0 3px 10px rgba(27,79,143,.35)}
.app{background:none!important;border-color:transparent!important;box-shadow:none!important}
.app:hover{border-color:transparent!important;box-shadow:none!important;transform:translateY(-4px)}
.app .ico{filter:none!important}
.app b{color:#14407a;font-weight:600}
.app small{color:#3d6ba6;font:500 12px var(--sans);font-style:normal;letter-spacing:.04em}
.sec{color:#14407a;font-family:var(--sans);font-weight:700}.sec small{color:#3d6ba6}
footer{color:#2a5d9f;border-top-color:rgba(27,79,143,.3)}
.st{color:#3d6ba6}
.gbar{background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.4));border-color:rgba(27,79,143,.3);box-shadow:inset 0 1px 0 #fff,0 10px 28px rgba(27,79,143,.25)}
#topnav,#botnav{background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.55));box-shadow:0 8px 24px rgba(27,79,143,.22),0 1px 0 rgba(27,79,143,.25)}
.gbar button{color:#1b4f8f;text-shadow:none}.gbar button svg{filter:none}
#topnav,#botnav button+button{border-left-color:rgba(27,79,143,.18)}
#topnav,#botnav button.on{background:linear-gradient(180deg,transparent,rgba(27,79,143,.2))}
.gbar button.on:after{background:#1b4f8f;box-shadow:none}
#msh .sheet{background:linear-gradient(165deg,rgba(235,246,255,.95),rgba(190,222,255,.92));color:#14407a;border-color:rgba(27,79,143,.3);box-shadow:0 24px 60px rgba(27,79,143,.35)}
#msh .sh-h b{text-shadow:none;color:#14407a}#msh .sh-h button{color:#1b4f8f;background:#fff;border-color:rgba(27,79,143,.3)}
#msh .sh-s,.sec2{color:#3d6ba6}
.gc,.gbtn,.wtl button,.sit{color:#14407a;background:rgba(255,255,255,.7);border-color:rgba(27,79,143,.2)}
.gc h3{color:#14407a}.gbtn span,.sit .tg{color:#3d6ba6}.gbtn svg{stroke:#1b4f8f}
.sbox{background:#fff;border-color:rgba(27,79,143,.35);box-shadow:none}.sbox input{color:#14407a}.sbox input::placeholder{color:#6b93c4}.sbox svg{stroke:#1b4f8f}
.sit .nm mark{color:#1b4f8f}
.wtl button i{border-color:#1b4f8f}.wtl button.on{background:#d8ebff;border-color:#1b4f8f}.wtl button.on i{background:#1b4f8f;box-shadow:inset 0 0 0 3px #d8ebff}
.thit.on{border-color:#1b4f8f}
#botnav{box-shadow:0 -8px 24px rgba(27,79,143,.22),0 -1px 0 rgba(27,79,143,.25);background:linear-gradient(0deg,rgba(255,255,255,.82),rgba(255,255,255,.55))}
#botnav button.on{background:linear-gradient(0deg,transparent,rgba(27,79,143,.2))}
/* @theme-end */
